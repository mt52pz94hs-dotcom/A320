<style>
:root{--bg:#0a0d12;--panel:#131922;--panel2:#0f141c;--cyan:#45cde2;--green:#2fd06b;--amber:#ffb300;--red:#ef5350;--line:#243044;--gray:#8b95a5;--dim:#5b6575;--white:#e8edf4;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--white);font-family:'Barlow Semi Condensed','Segoe UI',Arial,sans-serif;min-height:100vh;padding-bottom:40px;}
.mono{font-family:'IBM Plex Mono','Consolas',monospace;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}
header{border-bottom:1px solid var(--line);padding:18px 16px 14px;margin-bottom:20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
header .title{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--green);font-weight:700;}
header .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);}
header .crumb{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--cyan);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;}
.btn{background:transparent;border:1px solid var(--cyan);color:var(--cyan);border-radius:8px;padding:10px 14px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.5px;}
.btn.gray{border-color:var(--gray);color:var(--gray);}
.btn.amber{border-color:var(--amber);color:var(--amber);}
.btn.green{border-color:var(--green);color:var(--green);}
.solid{border-radius:8px;padding:10px 16px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.5px;border:1px solid;color:#08131a;}
.solid.cyan{background:var(--cyan);border-color:var(--cyan);}
.solid.green{background:var(--green);border-color:var(--green);}
.solid.gray{background:var(--gray);border-color:var(--gray);}
button:disabled{opacity:.45;cursor:default;}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.syscard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;cursor:pointer;text-align:left;color:var(--white);font-family:inherit;}
.syscard .ecp{font-family:'IBM Plex Mono',monospace;color:var(--green);font-size:15px;font-weight:700;}
.syscard .nm{font-size:12.5px;color:var(--gray);margin-top:3px;line-height:1.3;}
.syscard .st{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:7px;color:var(--dim);}
.badge{display:inline-block;border:1px solid;border-radius:5px;padding:1px 7px;font-size:11px;font-family:'IBM Plex Mono',monospace;letter-spacing:.8px;}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;color:var(--white);background:var(--panel2);font-size:14.5px;cursor:pointer;font-family:inherit;line-height:1.4;}
.opt:disabled{cursor:default;}
.progress{height:4px;background:var(--panel2);border-radius:2px;margin:10px 0 14px;}
.progress>div{height:4px;background:var(--cyan);border-radius:2px;transition:width .25s;}
.expl{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:13.5px;line-height:1.55;color:var(--cyan);}
footer{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);text-align:center;margin-top:34px;line-height:1.6;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.spread{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.qtext{font-size:16.5px;line-height:1.45;margin-bottom:14px;}
.score{font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:700;}
.missrow{font-size:13.5px;color:var(--gray);border-bottom:1px solid var(--line);padding:7px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
@media (max-width:480px){header .title{font-size:16px;} .score{font-size:36px;}}
/* ===== v3 visual upgrade ===== */
body{background:radial-gradient(1100px 520px at 18% -8%,#101a29 0%,var(--bg) 58%) fixed;padding-bottom:100px;}
.wrap{max-width:1024px;}
header{padding:20px 20px 16px;background:linear-gradient(180deg,rgba(19,25,34,.9),rgba(10,13,18,0));}
header .title{font-size:22px;letter-spacing:1.5px;background:linear-gradient(90deg,var(--green) 0%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.card{border-radius:14px;background:linear-gradient(180deg,#151d28 0%,#10161f 100%);box-shadow:0 10px 30px rgba(0,0,0,.35);}
.syscard{border-radius:14px;background:linear-gradient(180deg,#151d28 0%,#10161f 100%);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;}
.syscard:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 12px 26px rgba(69,205,226,.12);}
.btn{transition:background .15s,box-shadow .15s;}
.btn:hover:not(:disabled){background:rgba(69,205,226,.12);box-shadow:0 0 0 1px var(--cyan) inset;}
.btn.gray:hover:not(:disabled){background:rgba(139,149,165,.12);box-shadow:0 0 0 1px var(--gray) inset;}
.btn.amber:hover:not(:disabled){background:rgba(255,179,0,.12);box-shadow:0 0 0 1px var(--amber) inset;}
.btn.green:hover:not(:disabled){background:rgba(47,208,107,.12);box-shadow:0 0 0 1px var(--green) inset;}
.solid{transition:filter .15s,transform .08s;}
.solid:hover{filter:brightness(1.12);}
.solid:active{transform:scale(.98);}
.opt{transition:border-color .12s,background .12s;}
.opt:not(:disabled):hover{border-color:var(--cyan);background:#121a24;}
.btn.lg{padding:6px 12px;font-size:12px;}
.btn.lg.on{background:var(--cyan);color:#08131a;font-weight:700;}
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,13,18,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
.navbtn{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:1px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--gray);cursor:pointer;transition:all .15s;}
.navbtn.on{border-color:var(--cyan);color:#08131a;background:var(--cyan);font-weight:700;box-shadow:0 4px 18px rgba(69,205,226,.25);}
.navbtn:not(.on):hover{color:var(--cyan);border-color:var(--cyan);}
.navinfo{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);background:transparent;border:none;cursor:pointer;padding:8px;}
.navinfo:hover{color:var(--red);}
.login{min-height:70vh;display:flex;align-items:center;justify-content:center;}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--white);font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:1px;padding:11px 12px;margin-bottom:10px;}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(69,205,226,.18);}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px;}.qtext{font-size:18px;}header .title{font-size:24px;}}
.rec{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important;animation:pul 1.1s infinite;}
@keyframes pul{50%{opacity:.55;}}
.ta{width:100%;}
.logo{filter:drop-shadow(0 0 7px rgba(69,205,226,.5));flex:0 0 auto;}
header{align-items:center;gap:14px;}
.loginlogo{display:flex;justify-content:center;margin-bottom:16px;}
.tile{flex:1 1 180px;text-align:center;padding:18px 12px;}
.tno{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:700;}
.tlb{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--gray);letter-spacing:1px;margin-top:4px;}
.tsb{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);margin-top:5px;}
.covrow{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.covbar{flex:1;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;}
.covbar>div{height:7px;background:linear-gradient(90deg,var(--green),var(--cyan));}
.trow,.qrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:linear-gradient(180deg,#151d28,#10161f);}
.qrow{cursor:pointer;}
select.inp{appearance:none;-webkit-appearance:none;}
.qa .ecp{font-size:14px;}
@media (max-width:520px){.navbtn{padding:8px 9px;font-size:10px;letter-spacing:.5px;}}
.pager{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0;}
.pager .btn{padding:6px 11px;font-size:11.5px;}
</style>

/* d: 1 = EASY, 2 = MEDIUM, 3 = HARD */
const BANK = {
GEN: [
{d:1,q:"Which displays make up the ECAM system?",o:["Two PFDs and two NDs","The upper E/WD and the lower SD","The MCDU and the FCU","Three DMC display units"],a:1,e:"ECAM consists of the Engine/Warning Display (upper) and the System Display (lower). PFD/ND belong to EFIS, not ECAM."},
{d:1,q:"What information is permanently shown on the E/WD?",o:["Hydraulic pressures and quantities","Engine primary parameters, fuel on board, flap/slat position, and warning/caution messages","Cabin pressure and outflow valve position","Electrical bus configuration"],a:1,e:"The E/WD always shows engine primary indications (N1, EGT, N2, FF), FOB, slat/flap position and W/C or memo messages. System diagrams appear on the SD."},
{d:1,q:"On ECAM, what does the color RED indicate?",o:["A system in normal operation","A configuration or failure requiring immediate action","A parameter to monitor","An action to be carried out"],a:1,e:"Red is reserved for Level 3 warnings requiring immediate crew action. Amber is awareness, green is normal, blue is actions to perform."},
{d:1,q:"On ECAM, what does the color AMBER indicate?",o:["Immediate action required","Crew awareness required, but no immediate action","Normal system operation","A limitation exceeded"],a:1,e:"Amber identifies cautions: the crew must be aware but action can wait until time permits. Immediate action is red territory."},
{d:1,q:"On ECAM, GREEN is used for:",o:["Titles of system pages","Normal system operation","Abnormal procedures","Memo messages only"],a:1,e:"Green means a system or parameter operating normally. Page titles are white; procedures/actions are blue."},
{d:2,q:"How many Flight Warning Computers (FWC) are installed?",o:["1","2","3","4"],a:1,e:"Two FWCs generate the warnings, cautions, aural alerts and memos. One FWC is sufficient, but some functions are lost with a single FWC."},
{d:2,q:"How many Display Management Computers (DMC) are installed?",o:["2","3","4","6"],a:1,e:"Three DMCs process display data; DMC 3 can replace DMC 1 or 2 in case of failure, keeping all six display units supplied."},
{d:2,q:"A Level 3 ECAM alert is accompanied by:",o:["Single chime and MASTER CAUT","Continuous repetitive chime (or specific sound) and MASTER WARN","No aural alert","Triple click"],a:1,e:"Level 3 = red warning: MASTER WARN lights plus CRC or a specific sound (e.g., cavalry charge). Level 2 gives single chime + MASTER CAUT."},
{d:2,q:"A Level 2 caution is announced by:",o:["Continuous repetitive chime","Single chime and MASTER CAUT lights","Cavalry charge","No attention getters"],a:1,e:"Level 2 cautions trigger a single chime and the amber MASTER CAUT lights. Level 1 cautions have no aural and no attention getters."},
{d:3,q:"What characterizes a Level 1 caution?",o:["Amber message with single chime","Amber message without MASTER CAUT and without aural alert","Red message without sound","Green pulsing parameter"],a:1,e:"Level 1 is degradation requiring monitoring: amber message on E/WD only — no chime, no MASTER CAUT. That distinguishes it from Level 2."},
{d:2,q:"What is an ECAM advisory?",o:["A red warning","A parameter drifting out of range: it pulses green on the SD and the relevant page is called automatically","A blue action line","A maintenance message"],a:1,e:"An advisory makes the affected parameter pulse green and auto-calls the system page so the crew can monitor the trend before it becomes a caution."},
{d:2,q:"How many ECAM flight phases are used for warning management?",o:["6","8","10","12"],a:2,e:"The FWCs divide operation into 10 flight phases; certain warnings are inhibited depending on the phase (T.O INHIBIT / LDG INHIBIT)."},
{d:2,q:"What do T.O INHIBIT and LDG INHIBIT memos indicate?",o:["ECAM has failed","Non-essential warnings are suppressed during high-workload phases","Takeoff/landing is prohibited","The FWC is in test"],a:1,e:"During takeoff and landing phases, warnings that are not operationally critical are inhibited to avoid distraction at critical moments."},
{d:2,q:"What does the CLR pushbutton on the ECAM control panel do?",o:["Erases the flight plan","Clears the displayed warning/caution or system page, stepping through the sequence","Cancels the fuel used","Resets the FWC"],a:1,e:"CLR steps through and clears ECAM messages/pages after the crew has dealt with them; it lights up when there is something to clear."},
{d:2,q:"What does the RCL pushbutton do?",o:["Recalls warnings/cautions previously cleared or inhibited","Reloads the SD page","Restarts the DMC","Shows the flight plan"],a:0,e:"RCL recalls cleared or currently inhibited alerts so the crew can review them; held 3 s it also shows cancelled cautions."},
{d:3,q:"What is the effect of the EMER CANC pushbutton?",o:["Cancels any red warning permanently","Silences the current aural and cancels/inhibits the present caution for the rest of the flight","Turns off both ECAM screens","Resets MASTER WARN only"],a:1,e:"EMER CANC suppresses a nuisance caution (shown on STATUS as CANCELLED CAUTION) and silences aurals. Red warnings are only silenced, never cancelled."},
{d:1,q:"Where are the MASTER WARN and MASTER CAUT lights located?",o:["On the pedestal","On the glareshield, in front of each pilot","On the overhead panel","On the ECAM control panel"],a:1,e:"The attention getters sit on the glareshield in each pilot's field of view; pressing them extinguishes the light and silences the aural."},
{d:2,q:"What does the ALL pushbutton on the ECAM control panel do?",o:["Shows all warnings","Cycles through all SD pages while pressed — useful if the ECP fails","Selects all systems for test","Displays both ECAM images on one screen"],a:1,e:"Holding ALL steps through every system page in sequence, giving access to pages even with a failed ECAM control panel."},
{d:3,q:"If the lower ECAM display fails, how can the SD be viewed?",o:["It cannot","Using the ECAM/ND transfer selector to show the SD on a Navigation Display, or E/WD priority logic","Only via the MCDU","By swapping DMC 3"],a:1,e:"The ECAM/ND XFR selector displays the SD image on an ND. With one ECAM screen, the E/WD has priority; the SD is shown on demand."},
{d:2,q:"What data is permanently displayed at the bottom of the SD?",o:["Fuel flow and N1","TAT, SAT, UTC time, gross weight and CG (when available)","Wind and track","Cabin altitude"],a:1,e:"The lower part of the SD always shows air temperatures, clock and weight/CG data, independent of the page selected."},
{d:1,q:"What is shown on the STATUS (STS) page?",o:["The flight plan","Operational summary after failures: limitations, approach procedures, inop systems","The maintenance report","Fuel predictions"],a:1,e:"The STATUS page is the aircraft's operational summary after a failure — limitations, deferred procedures and INOP SYS — reviewed before approach."},
{d:2,q:"Which aural alert corresponds to autopilot disconnection?",o:["Single chime","Cavalry charge","Triple click","C-chord"],a:1,e:"AP disconnect triggers the cavalry charge. Triple click marks reversion of AP/FD modes; C-chord is the altitude alert."},
{d:3,q:"An overflow green arrow at the bottom of the E/WD messages area means:",o:["More memo/warning lines exist than can be displayed","The engine is over limit","Scroll is disabled","A DMC has failed"],a:0,e:"When there are more message lines than display space, an arrow indicates additional hidden lines; clearing messages reveals them."},
{d:1,q:"Which engines power the A320 you operate (CFM version)?",o:["CFM56-5B turbofans","IAE V2500","PW1100G","CFM LEAP-1A"],a:0,e:"The A320ceo CFM variant uses CFM56-5B twin-spool turbofans; the IAE V2500 is the alternative ceo powerplant, LEAP powers the neo."},
{d:2,q:"The cockpit sliding windows:",o:["Cannot be opened","Can be opened on the ground and serve as emergency exits for the flight crew","Open automatically on evacuation","Are heated only in flight"],a:1,e:"Each pilot has a sliding window usable for ventilation on the ground and as an emergency escape route with the escape rope."},
{d:2,q:"What does the ECAM DOOR page show?",o:["Only cabin doors","Status of cabin/cargo/avionics doors and slide arming","Cockpit door lock only","Oxygen quantity only"],a:1,e:"The DOOR/OXY page shows each door's open/closed state, slide armed indication, and crew oxygen pressure."},
{d:3,q:"During takeoff, most warnings are inhibited between:",o:["Brake release and 400 ft","80 kt and 1,500 ft (T.O INHIBIT phases)","V1 and VR only","Liftoff and gear retraction"],a:1,e:"T.O INHIBIT is active from 80 kt until 1,500 ft AGL (or 2 min), suppressing non-critical alerts during the critical takeoff window."},
{d:1,q:"The normal sequence to review ECAM after a failure is:",o:["STATUS first, then actions","Read the E/WD, perform blue actions, CLR, review affected SD pages, then STATUS","Reset the FWC","Cancel with EMER CANC and continue"],a:1,e:"ECAM philosophy: identify the warning, execute the blue action lines, clear, analyze the system pages presented, and finish with STATUS review."},
{d:2,q:"A magenta (pink) message or parameter on ECAM indicates:",o:["Immediate danger","A particular condition applying to the message (e.g., inhibition context)","Autopilot engaged","Test in progress"],a:1,e:"Magenta identifies particular/conditional information, such as messages tied to specific configurations or inhibits."},
{d:3,q:"If both FWCs fail:",o:["Nothing changes","ECAM warnings, cautions, aurals and memos are lost; monitoring reverts to SD pages and local warnings","Only aurals are lost","The flight must divert immediately"],a:1,e:"The FWCs generate the alerting; losing both removes ECAM alerting and aural warnings — a significant monitoring degradation handled per QRH."},
],
ELEC: [
{d:1,q:"How many main engine-driven generators does the A320 have, and what is their rating?",o:["Two, 90 kVA each","Two, 115 kVA each","Three, 90 kVA each","Two, 75 kVA each"],a:0,e:"GEN 1 and GEN 2, driven through the IDGs, deliver 90 kVA of three-phase 115/200 V 400 Hz power each."},
{d:1,q:"What is the function of the Transformer Rectifiers (TR)?",o:["Convert 28V DC into 115V AC","Convert 115V AC into 28V DC","Regulate generator frequency","Charge the batteries only"],a:1,e:"TR 1 and TR 2 rectify 115 V AC into 28 V DC to feed the DC network. Battery charging is a byproduct, not their only role."},
{d:1,q:"How many batteries are installed and what is their capacity?",o:["One, 40 Ah","Two, 23 Ah each","Two, 37 Ah each","Three, 23 Ah each"],a:1,e:"Two 23 Ah batteries connect to the DC BAT BUS through their battery contactors, controlled by the BCLs."},
{d:2,q:"How is the emergency generator driven and what is its rating?",o:["By the yellow system, 8 kVA","By the blue hydraulic system (CSM/G), 5 kVA","By the RAT directly as an electric generator, 15 kVA","By battery 1, 5 kVA"],a:1,e:"The RAT pressurizes the blue system; blue pressure drives the Constant Speed Motor/Generator producing 5 kVA. The RAT itself is hydraulic, not electric, on the A320."},
{d:1,q:"The AC ESS BUS is normally supplied by:",o:["AC BUS 2","AC BUS 1","The static inverter","The emergency generator"],a:1,e:"AC ESS is fed from AC BUS 1 in normal configuration; alternate supply is AC BUS 2 via AC ESS FEED."},
{d:2,q:"If AC BUS 1 is lost, how is the AC ESS BUS recovered?",o:["It cannot be recovered","By pressing AC ESS FEED to supply it from AC BUS 2","By starting the APU only","By the hand pump"],a:1,e:"AC ESS FEED transfers the essential bus to AC BUS 2 (automatic on enhanced aircraft — verify GLG standard). Starting the APU restores AC BUS 1 itself but the pb logic is the direct answer."},
{d:2,q:"What is the normal power source priority for AC BUS 1?",o:["EXT PWR, GEN 1, APU GEN, GEN 2","GEN 1, EXT PWR, APU GEN, GEN 2","APU GEN, GEN 1, EXT PWR, GEN 2","GEN 1, APU GEN, EXT PWR, GEN 2"],a:1,e:"Each bus prefers its own engine generator, then external power, then APU generator, then the opposite generator via the bus tie."},
{d:2,q:"When does the RAT extend automatically (electrical logic)?",o:["Loss of one generator","Loss of AC BUS 1 and AC BUS 2 with speed above 100 kt","Loss of both batteries","Whenever the emergency generator fails"],a:1,e:"Loss of both main AC buses in flight above 100 kt auto-deploys the RAT to drive the emergency generator. A single generator loss is fully covered by the remaining sources."},
{d:2,q:"What does the static inverter do?",o:["Converts BAT 1 DC power into single-phase 115V AC for part of the AC ESS network","Converts AC into DC for the batteries","Feeds the galleys in emergency","Powers the DC BAT BUS from the generators"],a:0,e:"In emergency, the static inverter turns Battery 1 DC into 115 V AC for the AC ESS bus — the AC lifeline when no generator is available."},
{d:2,q:"Regarding the IDG disconnect pushbutton:",o:["It can be pressed at any time for as long as needed","Press for no more than ~3 seconds and only with the engine running or windmilling","It reconnects the IDG when pressed twice","It only works on the ground"],a:1,e:"Holding it longer than ~3 s can damage the disconnect mechanism, and N2 rotation is required. Reconnection is maintenance-only — the action is irreversible in flight."},
{d:2,q:"In case of generator overload, which loads are shed automatically?",o:["Fuel pumps","Galley (and part of commercial loads)","Avionics ventilation","Probe heat"],a:1,e:"The galley/commercial loads are shed first — they are comfort loads. Fuel pumps and probe heat are flight-essential and are never shed automatically in normal logic."},
{d:1,q:"The EXT PWR AVAIL light indicates:",o:["Ground power is plugged in and its parameters are normal","External power is supplying the aircraft","The GPU is being tested","Batteries are charging"],a:0,e:"AVAIL means the ground source is connected with correct voltage/frequency; the aircraft only uses it after pressing the pb (ON lights up)."},
{d:2,q:"What is the power source priority for AC BUS 2?",o:["GEN 2, EXT PWR, APU GEN, GEN 1","GEN 1, GEN 2, APU, EXT","EXT PWR always first","APU GEN, GEN 2, EXT, GEN 1"],a:0,e:"Mirror of bus 1: own generator, external power, APU generator, then the opposite generator. Own-side sources always win."},
{d:2,q:"Can two AC sources be connected to the same bus simultaneously?",o:["Yes, they share load","No — A320 sources are never paralleled; contactor logic connects one source at a time","Only GEN 1 and APU GEN","Only on the ground"],a:1,e:"The A320 electrical system is a split, non-paralleled network: contactors ensure a single source per bus at any moment."},
{d:1,q:"Generator output characteristics are:",o:["115/200 V, 400 Hz, three-phase AC","28 V DC","230 V, 50 Hz","115 V, 60 Hz"],a:0,e:"Constant-frequency 400 Hz, 115/200 V three-phase AC — the IDG's constant-speed drive keeps frequency stable regardless of N2."},
{d:2,q:"Which bus normally supplies the DC BAT BUS?",o:["DC BUS 2","DC BUS 1","The batteries at all times","The ESS TR"],a:1,e:"In normal flight the DC BAT BUS is fed from DC BUS 1; the batteries float connected via their contactors mainly for charging."},
{d:3,q:"What supplies DC ESS in the emergency electrical configuration?",o:["TR 1","The ESS TR, fed by the emergency generator","Battery 2 directly at all times","DC BUS 2"],a:1,e:"With the emergency generator running, the ESS TR converts its AC output to DC for the DC ESS network — batteries take over only when the emergency generator is not available."},
{d:2,q:"With BAT pushbuttons in AUTO, when do the batteries connect to the DC BAT BUS?",o:["Never in flight","For APU starting, in the emergency configuration, or when charging is required","Only on the ground","Whenever EXT PWR is on"],a:1,e:"AUTO logic connects the batteries when needed: APU start, loss of AC power, or when battery voltage calls for charging."},
{d:3,q:"In EMER ELEC CONFIG (RAT/emergency generator only), the fuel pumps are:",o:["All operating","Lost — the engines are gravity/suction fed","Only center pumps lost","Powered by the static inverter"],a:1,e:"The emergency network does not power the fuel pumps; engines feed by gravity from the wing tanks, which drives the associated limitations."},
{d:3,q:"What is the purpose of the GEN 1 LINE pushbutton?",o:["Disconnect the IDG","Used in the smoke procedure: opens the GEN 1 line contactor while GEN 1 keeps supplying its hydraulic... network isolation","Parallel both generators","Reset GEN 1"],a:1,e:"GEN 1 LINE OFF opens the line contactor to isolate GEN 1 from the network (smoke/elec drill) while the generator itself remains available for reconnection."},
{d:2,q:"The APU generator rating is:",o:["60 kVA","90 kVA — same as a main generator","115 kVA","45 kVA"],a:1,e:"The APU GEN can replace a main generator, delivering 90 kVA, which is why a single APU GEN can carry the whole network on the ground."},
{d:2,q:"How is the IDG cooled?",o:["By ram air","By fuel through a heat exchanger","By hydraulic fluid","It needs no cooling"],a:1,e:"IDG oil is cooled by fuel in a heat exchanger — one reason fuel temperature and IDG oil temperature are operationally linked."},
{d:3,q:"Which buses are shed when flying on batteries only (before RAT deployment or below emergency generator speed)?",o:["No shedding occurs","AC and DC SHED ESS buses are shed to preserve endurance","All DC buses","The AC ESS bus"],a:1,e:"On batteries alone, the SHED portions of the essential buses are dropped so the batteries feed only vital equipment (~ design endurance on batteries, verify FCOM)."},
{d:3,q:"Approximate battery-only endurance in the emergency configuration is:",o:["10 minutes","About 30 minutes","2 hours","Unlimited with load shedding"],a:1,e:"Certification requires the batteries to sustain the essential network for a nominal ~30 minutes — a figure to confirm in the GLG FCOM."},
{d:2,q:"The maximum continuous load of each TR is approximately:",o:["100 A","200 A","400 A","50 A"],a:1,e:"Each TR is rated for about 200 A continuous; TR loads are monitored on the ECAM ELEC page."},
{d:1,q:"Where can the electrical system configuration be monitored?",o:["On the E/WD","On the ECAM ELEC page","On the MCDU","On the FCU"],a:1,e:"The ELEC SD page shows sources, contactors, buses, TRs and battery voltages/currents in real time."},
{d:2,q:"After an IDG disconnect in flight:",o:["It reconnects automatically on landing","The generator is lost for the rest of the flight; reconnection is a maintenance action","It can be reset with GEN pb","APU GEN cannot replace it"],a:1,e:"Mechanical disconnection is irreversible in flight; APU GEN (90 kVA) is the standard replacement source."},
{d:3,q:"Battery voltage check before APU start on a cold aircraft: the target is",o:["Above 20 V","At or above ~25.5 V; if lower, a charging cycle is required before start","Exactly 28 V","Below 24 V"],a:1,e:"With BAT below ~25.5 V, connect external power and charge before relying on batteries — verify exact figure and procedure in GLG FCOM."},
{d:1,q:"External power receptacle supplies:",o:["28V DC to the whole aircraft","115V/400 Hz AC ground power","Only battery charging","Hydraulic power"],a:1,e:"The GPU delivers 115 V 400 Hz AC; the aircraft's TRs derive the DC side from it."},
{d:3,q:"With the emergency generator online, which flight instruments remain powered?",o:["None","Captain instruments and essential systems via AC/DC ESS buses","Both pilots' full panels","Only standby instruments"],a:1,e:"The essential network keeps the captain's side and vital systems alive; the F/O side and non-essential loads are lost — standby instruments have their own supply."},
],
HYD: [
{d:1,q:"Name the hydraulic systems and their normal operating pressure.",o:["Green, Blue, Yellow — 3000 psi","Green, Blue, Yellow — 2500 psi","Left, Center, Right — 3000 psi","Green and Yellow only — 3000 psi"],a:0,e:"Three independent systems — Green, Blue, Yellow — each at 3000 psi nominal. They never exchange fluid."},
{d:1,q:"How is each system normally pressurized?",o:["Green: ENG 2 pump; Yellow: ENG 1; Blue: PTU","Green: ENG 1 pump; Yellow: ENG 2 pump + electric pump; Blue: electric pump + RAT","All three by electric pumps","Green and Blue by engine pumps; Yellow by RAT"],a:1,e:"Green = ENG 1 engine-driven pump; Yellow = ENG 2 EDP plus a yellow electric pump; Blue = electric pump, backed up by the RAT in emergency."},
{d:1,q:"What is the function of the PTU?",o:["Transfers hydraulic fluid between green and yellow","Transfers hydraulic power (not fluid) between green and yellow systems","Pressurizes the blue system in emergency","Drives the emergency generator"],a:1,e:"The Power Transfer Unit is a reversible hydraulic motor-pump: one system drives it, the other gets pressurized. No fluid crosses between systems — a key exam point."},
{d:2,q:"When does the PTU activate automatically?",o:["Whenever an engine fails","When the pressure differential between green and yellow reaches ~500 psi","Only in flight","When the RAT deploys"],a:1,e:"A ΔP of about 500 psi between green and yellow triggers PTU operation — for example after losing one engine pump."},
{d:2,q:"At approximately what pressure does the RAT pressurize the blue system?",o:["3000 psi","2500 psi","2000 psi","1450 psi"],a:1,e:"The RAT delivers about 2500 psi — slightly below normal — enough for flight controls and the emergency generator."},
{d:1,q:"What is the yellow system hand pump used for?",o:["Alternate braking","Operating the cargo doors on the ground","Extending the landing gear","Pressurizing the reservoir"],a:1,e:"The hand pump pressurizes the yellow system to open/close cargo doors when no electrical power is available."},
{d:2,q:"One condition that inhibits PTU operation is:",o:["Flaps extended","Cargo door operation (yellow electric pump running for doors)","Autopilot engaged","Parking brake released"],a:1,e:"During cargo door operation the PTU is inhibited so yellow pressure does not back-drive green. It is also inhibited during the first engine start sequence."},
{d:2,q:"The yellow brake accumulator allows:",o:["Normal braking indefinitely","Parking brake and about 7 alternate brake applications","Nosewheel steering","Gear retraction"],a:1,e:"With all pumps lost, the accumulator provides parking brake and roughly seven full alternate brake applications — brake with care."},
{d:2,q:"The blue electric pump normally runs:",o:["Only on ground with EXT PWR","Automatically when at least one engine is running (or in flight)","Only when the RAT deploys","Only during taxi"],a:1,e:"In AUTO the blue pump starts with the first engine and runs throughout flight; on ground with engines off it can be forced with BLUE PUMP OVRD."},
{d:2,q:"Why are the hydraulic reservoirs pressurized?",o:["To increase system pressure to 3000 psi","With bleed air, to prevent pump cavitation","To cool the fluid","For fire protection"],a:1,e:"Low-pressure bleed air keeps positive pressure on the fluid so the pumps receive a solid supply at altitude — preventing cavitation, not creating system pressure."},
{d:2,q:"What does the ENG FIRE pushbutton do to the hydraulic system?",o:["Nothing","Closes the engine fire shutoff valve, isolating the engine-driven pump","Depressurizes all three systems","Activates the PTU"],a:1,e:"The fire pb closes that engine's hydraulic fire shutoff valve, cutting fluid supply to the EDP so no hydraulic fluid feeds a fire."},
{d:3,q:"What is the purpose of priority valves?",o:["To give APU bleed priority","To cut off heavy/low-priority users when system pressure drops, protecting flight controls","To select which pump pressurizes the system","To isolate leaks automatically"],a:1,e:"At low pressure, priority valves shed heavy consumers (gear, flaps, steering) so the remaining pressure serves the primary flight controls."},
{d:2,q:"Which thrust reverser is powered by which system?",o:["Both by green","ENG 1 reverser by green, ENG 2 reverser by yellow","Both by yellow","ENG 1 by blue, ENG 2 by green"],a:1,e:"Each reverser uses the system pressurized by its own engine: green for ENG 1, yellow for ENG 2 — so a single hydraulic loss affects only one reverser."},
{d:2,q:"Flaps and slats are powered respectively by:",o:["Flaps: green+blue / Slats: green+yellow","Flaps: green+yellow / Slats: green+blue","Both by green only","Both by blue"],a:1,e:"Flaps use green and yellow; slats use green and blue. Losing one system halves the drive speed of the affected surfaces rather than stopping them."},
{d:3,q:"After a total GREEN system failure, which consequences apply?",o:["Loss of all braking","Gear by gravity extension, no NWS, alternate brakes on yellow, PTU unavailable to help green users","Loss of all spoilers","No flap extension possible"],a:1,e:"Green users are lost: normal gear operation, NWS, normal brakes. Gravity extension and yellow alternate braking cover the landing; flaps still run on yellow at half speed."},
{d:2,q:"How can the RAT be deployed manually?",o:["It cannot","Via the RAT MAN ON pushbutton","By the gravity gear crank","Pulling both ENG masters"],a:1,e:"Guarded pushbutton(s) allow manual RAT extension for hydraulic (and emergency electrical) purposes; extension is irreversible in flight — stowing is a ground task."},
{d:3,q:"Below approximately what speed does RAT output become insufficient for the emergency generator?",o:["100 kt","About 140 kt","200 kt","60 kt"],a:1,e:"Around 140 kt the RAT can no longer sustain the CSM/G; the batteries then carry the essential network — relevant on final approach in EMER ELEC."},
{d:1,q:"What hydraulic fluid is used?",o:["Mineral oil","Phosphate-ester synthetic fluid (Skydrol type)","Engine oil","Silicone fluid"],a:1,e:"Fire-resistant phosphate-ester fluid — corrosive to skin and paint; handling precautions apply."},
{d:3,q:"The LO PR caution for a hydraulic system triggers at approximately:",o:["2500 psi","1450 psi","500 psi","3000 psi"],a:1,e:"System low pressure is flagged around 1450 psi — well below that, users start dropping off. Verify exact threshold in GLG FCOM."},
{d:3,q:"What are the leak measurement valves used for?",o:["Automatic leak isolation in flight","Maintenance: isolating flight control circuits on the ground to locate leaks","Measuring fluid quantity","Draining the reservoirs"],a:1,e:"Maintenance closes them to isolate portions of the flight-control circuits and trace leaks; they are not a flight crew tool."},
{d:2,q:"Where do you monitor hydraulic quantities, pressures and pump status?",o:["E/WD","ECAM HYD page","Overhead gauges","MCDU"],a:1,e:"The HYD SD page shows reservoir levels, system pressures, pump status, PTU state and fire shutoff valve positions."},
{d:2,q:"During the second engine start, a momentary 'barking' noise is heard. This is:",o:["A pump failure","The PTU self-test as pressure differentials appear","The RAT cycling","Brake accumulator recharging"],a:1,e:"The PTU briefly runs during the second engine start sequence as green/yellow pressures equalize — a normal, expected sound."},
{d:2,q:"With engines shut down, how are cargo doors normally operated?",o:["Green electric pump","Yellow electric pump (or hand pump if no power)","Blue pump","APU hydraulic pump"],a:1,e:"The yellow electric pump pressurizes the system for cargo door actuation; the hand pump is the no-power backup."},
{d:3,q:"Towing the aircraft with the yellow electric pump running can be hazardous because:",o:["Brakes overheat","The PTU can pressurize the green system and cause uncommanded movement of green users","The RAT may deploy","Fuel transfers"],a:1,e:"Yellow pressure drives the PTU, which pressurizes green — with associated risks during ground work. Hence PTU inhibition logics and ground procedures."},
{d:1,q:"What does an accumulator do in a hydraulic system?",o:["Filters the fluid","Stores pressure and damps pulsations","Cools the fluid","Increases pump speed"],a:1,e:"Accumulators store energy (nitrogen precharge) to damp pressure transients and provide reserve pressure — the brake accumulator being the prime example."},
{d:3,q:"A reservoir OVHT indication commands the crew to:",o:["Continue monitoring only","Switch off the associated pump(s) per ECAM to stop heating the fluid","Deploy the RAT","Open the leak measurement valves"],a:1,e:"Overheated fluid degrades and damages seals; ECAM directs shutting down the heat source (pump/PTU as applicable)."},
{d:2,q:"Which flight control surfaces can the BLUE system power?",o:["Landing gear and brakes","Slats, spoiler 3, elevator/THS and rudder contributions, plus the emergency generator","Flaps and NWS","Cargo doors"],a:1,e:"Blue is a flight-control oriented system: slats (with green), one spoiler pair, tail surfaces contributions and the CSM/G. It has no gear, brake or NWS users."},
{d:2,q:"RAT stowage after deployment:",o:["Automatic when hydraulics recover","Only by maintenance on the ground","By pressing RAT MAN ON again","On touchdown"],a:1,e:"Once out, the RAT stays out — retraction requires ground servicing."},
{d:3,q:"If GREEN and YELLOW are both lost (dual hydraulic failure):",o:["Normal landing configuration is available","Control remains on BLUE: expect alternate law aspects, no flaps (slats only), gravity gear, no normal/alternate brakes until accumulator, longer landing distance","Only the PTU can restore them","The flight controls are lost"],a:1,e:"G+Y dual failure leaves blue alone: slats only, gravity gear, accumulator braking — a QRH-managed scenario with large performance penalties. Blue+one other lost gives different equipment; know the deltas."},
{d:1,q:"Hydraulic power on the A320 is used for all EXCEPT:",o:["Flight controls","Landing gear and brakes","Cargo doors","Windshield wipers"],a:3,e:"Wipers are electric. Flight controls, gear/brakes/NWS and cargo doors are hydraulic consumers."},
],
FCTL: [
{d:1,q:"Which computers manage the fly-by-wire flight controls?",o:["3 ELAC, 2 SEC, 2 FAC","2 ELAC, 3 SEC, 2 FAC","2 ELAC, 2 SEC, 3 FAC","2 FMGC and 2 FAC"],a:1,e:"Two ELACs (elevator/aileron), three SECs (spoilers, standby elevator) and two FACs (rudder functions, speeds, yaw damping)."},
{d:2,q:"In normal law, sidestick pitch input commands:",o:["Elevator deflection directly","A load factor (g) demand","Pitch rate only","Angle of attack directly"],a:1,e:"Pitch normal law is a load-factor demand with auto-trim: stick neutral = 1 g corrected for pitch attitude, which is why the aircraft holds its trajectory hands-off."},
{d:1,q:"Which protections are available in normal law?",o:["Only stall warning","High AOA, high speed, pitch attitude, bank angle and load factor protections","Only overspeed protection","None below 100 ft"],a:1,e:"The full envelope: alpha protection, high-speed, pitch attitude limits (+30/-15 approx), 67° bank and g limits. This is what defines normal law."},
{d:2,q:"In alternate law:",o:["All protections remain","Most protections are lost (load factor kept) and stall/overspeed WARNINGS replace protections","The aircraft reverts to mechanical control","Autopilot cannot be engaged"],a:1,e:"Alternate law keeps load-factor protection and adds stabilities; hard protections become warnings — the aircraft CAN now stall, which changes how you fly it."},
{d:2,q:"When does the aircraft transition from alternate law to direct law?",o:["Below 100 ft","When the landing gear is extended","When flaps reach CONFIG FULL","On autopilot disconnection"],a:1,e:"Gear extension in alternate law brings direct law: stick position commands surface deflection, no auto-trim — manual trim for landing."},
{d:2,q:"What does mechanical backup provide?",o:["Aileron control via cables","Pitch control through the trim wheel (THS) and yaw through the rudder pedals","Full control of all surfaces","Spoiler control"],a:1,e:"With total computer/electrical loss: THS via trim wheel and rudder via pedals — enough to stabilize the aircraft while restoring systems."},
{d:2,q:"How many spoiler panels are installed per wing and which act as ground spoilers?",o:["4 per wing; panels 1-3 as ground spoilers","5 per wing; all 5 act as ground spoilers","5 per wing; only 2-4 as ground spoilers","6 per wing; all as ground spoilers"],a:1,e:"Five spoilers per wing. All five extend for ground spoiler function; roll uses 2-5 and speedbrakes use 2-4."},
{d:2,q:"Load factor limits in clean configuration:",o:["+2.0 g / -1.0 g","+2.5 g / -1.0 g","+3.0 g / 0 g","+2.5 g / -1.5 g"],a:1,e:"Clean: +2.5/-1 g. With slats or flaps extended: +2/0 g. The flight control system protects these limits in normal law."},
{d:2,q:"Bank angle protection in normal law limits bank to a maximum of:",o:["45°","60°","67°","75°"],a:2,e:"Maximum 67°; with high-AOA or high-speed protection active the limit reduces to 45°/40°, and above 33° positive spiral stability returns the bank."},
{d:2,q:"What does ALPHA FLOOR do?",o:["Retracts the speedbrakes","Commands TOGA thrust through the A/THR regardless of thrust lever position","Extends the slats automatically","Limits AOA mechanically"],a:1,e:"An autothrust protection: at a high AOA threshold, TOGA is applied even with levers at idle — available from lift-off to 100 ft on approach, in normal law only."},
{d:2,q:"On the ground, selecting flap lever position 1 gives:",o:["Slats only (CONF 1)","CONF 1+F (slats + flaps 10°)","CONF 2","Flaps only"],a:1,e:"On ground, position 1 = CONF 1+F for takeoff. In flight, selecting 1 from clean gives slats only; the flaps auto-retract from 1+F above 210 kt."},
{d:2,q:"The rudder travel limiter:",o:["Is controlled by the ELACs","Limits rudder deflection as airspeed increases (FAC function)","Only works on the ground","Limits pedal force"],a:1,e:"The FACs progressively reduce maximum rudder deflection with speed to protect the vertical stabilizer from overstress."},
{d:2,q:"How does sidestick priority work?",o:["Left seat always has priority","Pressing the takeover pushbutton gives priority to that stick; holding 40 s latches it","Both inputs are ignored","The FO stick is disabled in flight"],a:1,e:"Takeover pb deactivates the other stick ('PRIORITY LEFT/RIGHT' callout); without takeover, simultaneous inputs are algebraically summed with a DUAL INPUT warning."},
{d:3,q:"Are the two sidesticks mechanically connected?",o:["Yes, through cables","No — inputs are electrically processed; simultaneous deflections are summed","Yes, hydraulically","Only in pitch"],a:1,e:"No mechanical link: each stick sends independent signals. That is why dual-input discipline and the takeover logic matter."},
{d:2,q:"The THS (trimmable horizontal stabilizer) range is approximately:",o:["10° up / 10° down","13.5° nose-up / 4° nose-down","5° each way","20° nose-up only"],a:1,e:"Roughly 13.5° aircraft nose-up to 4° nose-down — the green band on the trim wheel marks the takeoff range. Verify exact values in FCOM."},
{d:3,q:"When does automatic pitch trim stop in normal law?",o:["Never","Below 50 ft in flare, at high g/protection edges, and in certain protections","Above 20,000 ft","With autopilot on"],a:1,e:"Auto-trim freezes near the ground (flare law) and at protection boundaries so the pilot feels conventional forces where it matters."},
{d:3,q:"What happens at 50 ft during landing (flare law)?",o:["Direct law engages fully","The system memorizes pitch attitude and introduces a gentle nose-down demand so the pilot flares conventionally","Autotrim speeds up","Alpha floor arms"],a:1,e:"Flare mode gives a conventional feel: without back pressure the nose would slowly drop, prompting the natural flare input."},
{d:2,q:"Ground spoilers deploy automatically at landing when:",o:["Selecting reverse only","Armed, with both main gear on ground and thrust levers at idle (or reverse selected)","Above 100 kt only","The autobrake commands them"],a:1,e:"Armed ground spoilers extend at main-gear touchdown with levers idle; if not armed, selecting reverse triggers them. Partial extension occurs on RTO above 72 kt."},
{d:3,q:"During a rejected takeoff above 72 kt with spoilers not armed, ground spoilers:",o:["Do not extend","Extend automatically when reverse is selected","Extend at 80 kt regardless","Must be extended manually"],a:1,e:"RTO logic: above 72 kt, reverse selection deploys full ground spoilers even if unarmed — killing lift and putting weight on the brakes."},
{d:2,q:"Alpha prot and alpha max are indicated on the PFD as:",o:["A red flag","A black/amber strip and red barber strip at the bottom of the speed scale","Numbers on the FMA","Nothing is displayed"],a:1,e:"The speed tape shows alpha prot (top of black/amber strip) and alpha max (top of red strip): flying below VLS toward these bands engages AOA protection."},
{d:3,q:"Within alpha protection range, the sidestick commands:",o:["Load factor","Angle of attack directly — full aft stick gives alpha max","Pitch rate","Nothing; the computers ignore it"],a:1,e:"Between alpha prot and alpha max the law changes to AOA demand: full back stick delivers alpha max, which is why the A320 cannot be conventionally stalled in normal law."},
{d:2,q:"The FACs compute and display which characteristic speeds?",o:["V1, VR, V2 only","VLS, S speed, F speed, Green Dot, VSW as applicable","Only VMO/MMO","Fuel speeds"],a:1,e:"FAC data drives the PFD speed scale: VLS, F and S speeds, green dot (best L/D clean), and stall warning speed in alternate/direct law."},
{d:2,q:"If both ELACs fail, elevator and aileron control:",o:["Is lost completely","Elevator/stabilizer control passes to the SECs (spoilers cover roll); expect alternate law","Reverts to mechanical","Transfers to the FACs"],a:1,e:"SECs provide standby pitch control and roll via spoilers; ailerons are lost with both ELACs. Law degradation accompanies the reconfiguration."},
{d:2,q:"Speedbrake use is inhibited or auto-retracted when:",o:["Never","In CONF FULL, at alpha protection, at TOGA/MCT thrust, or with certain SEC failures","Above FL200","With gear down"],a:1,e:"Speedbrake logic protects performance and control: they retract/inhibit at high thrust, full flaps and AOA protection — a frequent oral question."},
{d:1,q:"Roll control surfaces on the A320 are:",o:["Ailerons only","One aileron per wing plus spoilers 2-5","Spoilers only","Ailerons and rudder"],a:1,e:"Each wing has a single aileron assisted by four roll spoilers; ailerons also droop with flaps extension to increase lift."},
{d:2,q:"Maximum altitude for flap/slat extension is:",o:["15,000 ft","20,000 ft","25,000 ft","No limit"],a:1,e:"Flaps/slats are limited to 20,000 ft — both a structural and operational envelope figure."},
{d:3,q:"In pitch alternate law, what replaces high-speed protection?",o:["Nothing at all","An overspeed WARNING (aural + VMO/MMO indications) without automatic pitch-up protection","Automatic speedbrake","Alpha floor"],a:1,e:"Alternate law downgrades hard protections to warnings: the aircraft will exceed VMO if mishandled — crew awareness replaces the computer's authority."},
{d:2,q:"What is Green Dot speed?",o:["Minimum flap retraction speed","Best lift-to-drag speed in clean configuration (engine-out drift down / holding reference)","Maximum endurance in landing config","VLS + 10"],a:1,e:"Green dot marks best L/D clean — target for single-engine climb/drift down and clean holding."},
{d:2,q:"Slat/flap positions available on the FLAPS lever are:",o:["0, 1, 2, 3, FULL","UP, HALF, FULL","0 through 5","1, 2, 3 only"],a:0,e:"Five lever positions: 0, 1, 2, 3, FULL. The SFCCs translate lever position into slat/flap surface configurations (1 vs 1+F depending on phase)."},
{d:3,q:"Turn coordination and yaw damping are provided by:",o:["The ELACs through the ailerons","The FACs through the rudder, without pedal movement","The SECs","Mechanical linkages"],a:1,e:"FAC yaw functions (damping, coordination, trim, travel limit) act directly on the rudder; the pedals do not move with yaw damper inputs."},
],
WHEEL: [
{d:1,q:"The landing gear is normally extended and retracted by:",o:["The yellow system","The green hydraulic system","The blue system","Electric actuators"],a:1,e:"Green hydraulic pressure operates gear and doors under LGCIU sequencing. Yellow and blue have no gear users."},
{d:2,q:"In gravity extension:",o:["The doors close after extension","The crew uses the crank; gear locks by gravity and springs, and the gear doors remain open","Yellow pressure extends the gear","It can be reset in flight"],a:1,e:"The crank isolates green hydraulics and unlocks the gear: it free-falls, locking by gravity/springs/aero loads. Doors stay open — expect extra drag."},
{d:2,q:"What are the landing gear speed limits?",o:["VLO ext 250 kt, VLO ret 220 kt, VLE 280 kt/M 0.67","VLO ext 220, VLO ret 250, VLE 280","All at 250 kt","VLE 320 kt"],a:0,e:"Extend up to 250 kt, retract up to 220 kt, fly extended up to 280 kt/M 0.67. Retraction is the lowest because the gear retracts against airloads."},
{d:1,q:"How many LGCIUs are installed?",o:["1","2","3","4"],a:1,e:"Two Landing Gear Control and Interface Units alternate control of each cycle and feed gear position to ECAM and other systems."},
{d:1,q:"Normal braking is powered by ___ and alternate braking by ___.",o:["Yellow / Green","Green (with anti-skid) / Yellow (with accumulator)","Blue / Yellow","Green / Blue"],a:1,e:"Normal brakes: green with full anti-skid/autobrake. Alternate: yellow, backed by the accumulator; anti-skid availability depends on the failure case."},
{d:2,q:"Anti-skid is deactivated below approximately:",o:["10 kt","20 kt","40 kt","70 kt"],a:1,e:"Below ~20 kt ground speed the anti-skid releases its authority — wheel speed references become unreliable at very low speed."},
{d:1,q:"Which autobrake mode is used exclusively for takeoff?",o:["LO","MED","MAX","BTV"],a:2,e:"MAX arms only for takeoff (RTO protection). LO and MED are landing modes; MAX is not recommended for landing."},
{d:2,q:"Nosewheel steering is powered by:",o:["The yellow system","The green hydraulic system","The blue system","Electric motor"],a:1,e:"NWS is a green system user, controlled through the BSCU from tillers and pedals."},
{d:2,q:"Maximum nosewheel steering angles are approximately:",o:["±75° with tiller, ±6° with rudder pedals","±65° tiller, ±10° pedals","±45° tiller, ±6° pedals","±75° pedals, ±6° tiller"],a:0,e:"The tiller commands up to ±75° for taxi turns; the pedals give ±6° for directional control on the runway."},
{d:2,q:"Maximum brake temperature for takeoff is:",o:["150°C","300°C","500°C","There is no limit"],a:1,e:"Takeoff requires brake temperature below 300°C (brake fans off), protecting against hot brakes in the wheel wells after retraction. Verify in GLG FCOM."},
{d:1,q:"The parking brake is pressurized by:",o:["The green system","The yellow system / brake accumulator","The blue system","A dedicated electric pump"],a:1,e:"Parking brake uses yellow pressure or the accumulator, which sustains it for hours after shutdown."},
{d:2,q:"Which computer controls braking, anti-skid and steering?",o:["The LGCIU","The BSCU (dual channel)","The SEC","The FADEC"],a:1,e:"The Brake and Steering Control Unit runs normal braking, anti-skid, autobrake and NWS; its two channels alternate each gear cycle."},
{d:2,q:"Autobrake activation at landing is triggered by:",o:["Touchdown switches only","Ground spoiler extension command","Reverse thrust selection","Wheel spin-up alone"],a:1,e:"Autobrake (LO/MED) engages when the ground spoilers deploy — tying automatic braking to confirmed ground logic."},
{d:3,q:"Autobrake LO and MED begin braking respectively:",o:["Immediately at touchdown for both","LO ~4 s and MED ~2 s after ground spoiler deployment","LO at 80 kt, MED at 100 kt","Only when pedals are pressed"],a:1,e:"LO delays about 4 seconds and MED about 2 seconds after spoiler extension; MAX (takeoff) commands full pressure immediately."},
{d:2,q:"Gear position indication: a red UNLK on the LDG GEAR panel means:",o:["Gear locked down","Gear in transit / not locked in the selected position","Doors closed","Brakes hot"],a:1,e:"Red UNLK = gear not locked where the lever commands. Green triangles = locked down; confirm on the ECAM WHEEL page."},
{d:3,q:"How are the wheels stopped during retraction?",o:["They spin freely","Main wheels are braked automatically; the nose wheels are stopped by friction band in the bay","Anti-skid stops them","Reverse thrust"],a:1,e:"A short automatic brake application stops main wheel rotation; nose wheels rub a friction band in the well — no rotating masses in the bays."},
{d:2,q:"Maximum tire speed is:",o:["165 kt","195 kt","225 kt","250 kt"],a:1,e:"Tire limit 195 kt ground speed — a certification limit relevant to high-altitude/high-weight takeoffs."},
{d:3,q:"With A/SKID & N/W STRG selector OFF, braking is:",o:["Unchanged","On yellow (alternate) without anti-skid — limit brake pressure to ~1000 psi using the triple indicator","Unavailable","Green with anti-skid"],a:1,e:"Without anti-skid, the crew modulates pedal pressure watching the triple indicator, max ~1000 psi, to avoid locking wheels and blowing tires."},
{d:2,q:"The triple pressure indicator on the instrument panel shows:",o:["Green system pressure","Yellow brake accumulator pressure and left/right alternate brake pressures","Normal brake pressures","Tire pressures"],a:1,e:"It displays accumulator pressure plus delivered alternate brake pressure per side — your only brake pressure reference in degraded braking."},
{d:2,q:"The brake accumulator maintains parking brake pressure for at least:",o:["1 hour","About 12 hours","30 minutes","One week"],a:1,e:"The accumulator is designed to hold the aircraft parked for roughly 12 hours; chocks remain good practice."},
{d:3,q:"A hydraulic safety valve cuts gear operation above approximately:",o:["200 kt","260 kt","280 kt","V1"],a:1,e:"Above ~260 kt the safety valve blocks gear hydraulic supply; the gear can still be locked down by gravity. Explains why gear won't retract at high speed after a late selection."},
{d:2,q:"The BSCU channels alternate:",o:["Every 10 minutes","With each landing gear lever cycle","Only after a failure","Never"],a:1,e:"Channel swap each gear cycle equalizes wear and verifies both channels regularly — same philosophy as CPC alternation in pressurization."},
{d:1,q:"Landing gear shock absorbers are:",o:["Spring steel","Oleo-pneumatic struts","Rubber blocks","Torsion bars"],a:1,e:"Classic oleo-pneumatic design: nitrogen + hydraulic fluid absorb landing energy."},
{d:2,q:"When is nosewheel steering deactivated for towing?",o:["It cannot be","With the towing lever/bypass pin on the nose gear, depressurizing the steering","By pulling a cockpit breaker only","Automatically with parking brake"],a:1,e:"The ground crew inserts the bypass/towing pin so the tow bar can turn the nose gear without fighting the steering actuator."},
{d:2,q:"Main gear doors are open:",o:["Whenever the gear is down","Only during gear transit","Always in flight","Only on the ground"],a:1,e:"Doors open to let the gear pass, then close — except after gravity extension, when they stay open."},
{d:3,q:"Brake temperature indication turns amber on the WHEEL page when a brake exceeds:",o:["100°C","300°C","500°C","800°C"],a:1,e:"Above 300°C the temperature indication turns amber (HOT BRAKES logic); delay takeoff and consider brake cooling. Verify GLG thresholds."},
{d:2,q:"After landing with brake fans installed, they are used to:",o:["Cool the hydraulics","Cool the brakes and wheels to permit turnaround dispatch","Dry the runway","Assist reverse"],a:1,e:"Brake fans accelerate cooling; note that fan-on readings differ from actual brake temperature. Confirm applicability to GLG fleet."},
{d:2,q:"Gear safety pins are installed:",o:["Before every flight","On the ground for maintenance/towing protection, removed before flight (shown to crew)","In flight for gravity extension","Never on A320"],a:1,e:"Pins mechanically lock the gear on the ground; the walkaround confirms removal — a classic 'gear won't retract' cause."},
{d:3,q:"After gravity extension, can the gear be retracted in flight?",o:["Yes, resetting the crank","No — the system stays isolated; retraction is a ground/maintenance action","Yes, above 220 kt","Only with the PTU"],a:1,e:"Once gravity-extended, the gear remains down and locked with hydraulics isolated — plan performance accordingly."},
{d:1,q:"The ECAM WHEEL page shows all EXCEPT:",o:["Brake temperatures","Gear and door position","Tire pressures (if equipped) and anti-skid status","Fuel quantity"],a:3,e:"Fuel is on the FUEL page. WHEEL consolidates gear/doors, braking, temperatures and steering-related data."},
],
FUEL: [
{d:1,q:"How many fuel tanks does the A320 have?",o:["3: left, right, center","5: two outer cells, two inner cells and one center tank","4: two wing and two center","2 wing tanks only"],a:1,e:"Each wing holds an inner and an outer cell; the center tank sits in the wing box — five volumes in total."},
{d:2,q:"Approximate total usable fuel capacity of the A320:",o:["~15,000 liters","~23,860 liters","~30,000 liters","~19,000 liters"],a:1,e:"About 23,860 L (≈18,700 kg at typical density). Confirm exact GLG figures — examiners like this number."},
{d:2,q:"How many main fuel pumps are installed?",o:["4","6: two per wing tank and two center tank pumps","8","2 per tank, 10 total"],a:1,e:"Six pumps in the classic CFM configuration: two per wing (inner) tank plus two center pumps. Any single pump can feed one engine."},
{d:1,q:"What is the normal fuel usage sequence?",o:["Wings first, then center","Center tank first, then wing tanks","Outer cells first","Simultaneous from all tanks"],a:1,e:"Center tank fuel burns first, keeping fuel in the wings for structural (wing bending relief) reasons."},
{d:3,q:"The center tank pumps are automatically inhibited when:",o:["The landing gear is extended","The slats are extended","The APU is running","Crossfeed is open"],a:1,e:"Classic logic stops CTR pumps with slats out (takeoff/approach) so engines feed from the wings in those phases. Mode logic varies by standard — verify GLG FCOM."},
{d:2,q:"The outer-to-inner cell transfer valves open when:",o:["The center tank is empty","The inner cell fuel drops to about 750 kg","The pilot selects them","Low pressure is detected"],a:1,e:"At ~750 kg in an inner cell, transfer valves on BOTH sides latch open and outer fuel gravity-transfers inboard — keeping outer fuel as late wing relief."},
{d:1,q:"How many crossfeed valves does the fuel system have?",o:["One","Two","Three","None"],a:0,e:"A single crossfeed valve joins the left and right engine feed manifolds — used for engine-out feeding or balancing per procedure."},
{d:2,q:"If all fuel pumps are lost:",o:["The engines flame out immediately","The engines can be fed by gravity (suction feed) within limitations","Only the APU can run","Crossfeed restores pressure"],a:1,e:"Gravity feeding from the wing tanks keeps the engines running, with ceiling and fuel-type limitations per QRH — center tank fuel becomes unusable."},
{d:2,q:"The WING TK LO LVL warning triggers at approximately:",o:["1500 kg","750 kg in a wing tank","500 kg total","250 kg per side"],a:1,e:"Low level sensing at ~750 kg per wing tank drives the caution — closely tied to minimum/diversion fuel decisions."},
{d:3,q:"Standard fuel temperature limits (JET A-1, CFM):",o:["Min -54°C / Max +43°C","Min -43°C / Max +54°C","Min -30°C / Max +60°C","No limits apply"],a:1,e:"Typical: -43°C to +54°C for JET A-1 (freezing point driven). Long cold-soak cruise legs make the minimum operationally relevant. Verify GLG limitations."},
{d:2,q:"Where is the refuel/defuel coupling located?",o:["Left wing root","Under the right wing, outboard of the engine","Tail cone","Belly centerline"],a:1,e:"The pressure refuel coupling and refuel panel are on the right wing — relevant for ground ops supervision."},
{d:2,q:"How is the IDG oil cooled in relation to the fuel system?",o:["It is air cooled only","Fuel passes through an IDG heat exchanger, absorbing heat","Hydraulic fluid cools it","The APU cools it"],a:1,e:"Fuel is the heat sink for IDG oil; some aircraft return warmed fuel to the outer tank (fuel return logic per model)."},
{d:2,q:"Automatic refueling works by:",o:["Timing the flow","Preselecting the desired total on the refuel panel; valves close automatically at target","Manual valve control only","MCDU entry"],a:1,e:"The ground operator preselects quantity; the system distributes and shuts valves at the preselected total — crew verifies FOB on ECAM."},
{d:1,q:"Is overwing gravity refueling possible?",o:["No","Yes, through overwing filler caps on the wing tanks","Only with adapters on the center tank","Only when defueling"],a:1,e:"Gravity filling is available as a backup at fields without pressure refueling; the center tank cannot be gravity filled."},
{d:2,q:"Magnetic level indicators (MLI) under the wing are used to:",o:["Measure fuel pressure","Manually verify tank quantity on the ground when FQI data is in doubt","Drain water","Vent the tanks"],a:1,e:"Dripless magnetic sticks provide a mechanical quantity check for dispatch with degraded fuel indication."},
{d:2,q:"Water in the fuel tanks is managed by:",o:["It cannot be removed","Water drain valves at tank low points during maintenance checks","Fuel heaters","The center pumps"],a:1,e:"Regular water drains prevent accumulation; microbial growth and freezing water are the classic threats."},
{d:1,q:"The vent surge tank at each wing tip serves to:",o:["Hold reserve fuel","Vent the tanks to ambient (NACA intake) and catch fuel expansion","Feed the APU","Balance lateral load"],a:1,e:"Vent surge tanks keep tank pressure equalized through the NACA vent and return overflow fuel to the tanks."},
{d:3,q:"Center tank pumps stop automatically after center fuel is exhausted by:",o:["The crossfeed closing","Low output pressure logic (after a time delay) shutting the pumps","The crew only","Slat retraction"],a:1,e:"When center pumps run dry, low delivery pressure triggers their automatic stop after a delay — protecting them from dry running."},
{d:3,q:"Typical minimum fuel quantity for takeoff (A320, standard) is:",o:["500 kg","1,500 kg","3,000 kg","No minimum exists"],a:1,e:"A commonly published minimum is 1,500 kg at takeoff (with conditions on center tank fuel usage). This is FCOM-limitation material — verify the GLG value."},
{d:2,q:"Fuel quantity measurement is performed by:",o:["Float gauges","Capacitance probes processed by the FQI computer","Pressure sensors","Flow totalizer only"],a:1,e:"Capacitance probes plus densitometry give ECAM FOB; FUEL USED comes from the FADEC fuel flow integration — two independent references to cross-check."},
{d:2,q:"A significant difference between FOB and (BLOCK − FUEL USED) may indicate:",o:["Normal operation","A fuel leak — apply the QRH fuel leak procedure","FQI recalibration","Center pump failure"],a:1,e:"The fuel-check discipline exists to catch leaks: mismatch beyond tolerance triggers the FUEL LEAK procedure, which may prohibit crossfeed use."},
{d:3,q:"With a suspected fuel leak from an engine/pylon, opening the crossfeed:",o:["Is mandatory","Is prohibited until the leak is isolated — you could lose fuel from both sides","Fixes the imbalance","Has no effect"],a:1,e:"Crossfeeding into a leaking side dumps the good side's fuel overboard. The QRH sequence first identifies and isolates the leak."},
{d:1,q:"The APU normally receives fuel from:",o:["Its own tank","The left engine feed line","The right wing only","The center tank directly"],a:1,e:"APU fuel comes from the left feed; if no main pump pressure exists, the dedicated APU fuel pump runs automatically."},
{d:2,q:"Fuel imbalance between wings is corrected by:",o:["A transfer pump between wings","Opening the crossfeed and switching off pumps on the light side per procedure","Flying with sideslip","The FQI automatically"],a:1,e:"There are no wing-to-wing transfer pumps: balancing = crossfeed open + selective pump management, per FCOM technique and within imbalance limits."},
{d:2,q:"The ECAM FUEL page shows all EXCEPT:",o:["Pump status and valve positions","Tank quantities and FOB","Fuel temperature indications","V2 speed"],a:3,e:"Performance speeds live on the PFD/MCDU. The FUEL page covers quantities, pumps, valves, temperatures and the APU feed."},
{d:3,q:"Center tank fuel with less-than-full wing tanks at dispatch:",o:["Is always allowed","Is restricted by a limitation (center fuel with wings not full) — check FCOM fuel loading rules","Is prohibited entirely","Requires ballast"],a:1,e:"Loading rules protect wing bending relief: center fuel carriage is limited unless wings are full (with defined exceptions). GLG FCOM defines the exact rule."},
{d:2,q:"Fuel used indication resets:",o:["Every 30 minutes","At engine start on the ground","At landing","Manually only"],a:1,e:"FUEL USED zeroes at engine start, enabling the FOB + FUEL USED = BLOCK cross-check throughout the flight."},
{d:1,q:"Does the A320 have a fuel jettison system?",o:["Yes, from the wing tips","No — overweight landings are handled by performance assessment instead","Only on the neo","Yes, from the center tank"],a:1,e:"No jettison capability: if landing above MLW is required, the QRH overweight landing considerations apply."},
{d:3,q:"During gravity feed at altitude, which fuel becomes unusable?",o:["Wing tank fuel","Center tank fuel (no gravity path to the engines)","Outer cell fuel","None"],a:1,e:"Without pumps, only the wing tanks gravity-feed the engines; center fuel has no gravity route — plan range accordingly."},
{d:2,q:"Fuel temperature is measured in:",o:["Every tank","The outer cells and inner tanks (displayed on the FUEL page)","The engine only","The vent tank"],a:1,e:"Tank temperature probes feed the ECAM display; cold fuel management on long cruise references these indications."},
],
COND: [
{d:1,q:"Into how many temperature zones is the aircraft divided?",o:["2: cockpit and cabin","3: cockpit, forward cabin and aft cabin","4 zones","1 single zone"],a:1,e:"Three independently regulated zones; the zone controller computes demand and the trim air fine-tunes each one."},
{d:2,q:"What does the mixing unit do?",o:["Mixes bleed air from both engines","Mixes fresh air from the packs with recirculated cabin air","Mixes hot and cold trim air","Cools the avionics"],a:1,e:"The mixer combines conditioned pack air with roughly 40% filtered recirculated cabin air — improving efficiency and reducing bleed demand."},
{d:2,q:"What is trim air?",o:["Air from the recirculation fans","Hot air tapped upstream of the packs to fine-tune each zone's temperature","APU bleed air","Ram air"],a:1,e:"Hot bleed air, controlled by the hot air valve and zone trim valves, is added downstream to raise each zone from the common duct temperature."},
{d:2,q:"When would you select PACK FLOW LO?",o:["With high ambient temperature","With low passenger load, to save fuel","Always in flight","During takeoff"],a:1,e:"LO reduces bleed extraction with light loads; HI is for hot/humid days. The controller forces HI automatically in single-pack or APU-bleed operation."},
{d:2,q:"How many Cabin Pressure Controllers (CPC) are there and how do they alternate?",o:["One only","Two; one controls per flight and they swap automatically after each flight","Two; both control simultaneously","Three, in rotation"],a:1,e:"Two CPCs: one active, one standby, swapping after each flight or upon failure — same redundancy pattern as the BSCU channels."},
{d:2,q:"The EXCESS CAB ALT warning triggers at a cabin altitude of approximately:",o:["8,000 ft","9,550 ft","11,300 ft","14,000 ft"],a:1,e:"~9,550 ft cabin altitude raises the red warning; passenger masks deploy automatically around 14,000 ft."},
{d:2,q:"Maximum normal cabin differential pressure is:",o:["7.5 psi","8.06 psi","8.6 psi","9.2 psi"],a:1,e:"Normal max ΔP ≈ 8.06 psi; the safety valves relieve at ~8.6 psi. Two different numbers — a classic exam trap."},
{d:2,q:"The safety valves are located:",o:["On the forward bulkhead","On the rear pressure bulkhead (two valves)","In the wing root","On the outflow valve itself"],a:1,e:"Two safety valves on the aft pressure bulkhead protect against overpressure (~8.6 psi) and negative differential."},
{d:1,q:"What pressurization control modes exist?",o:["Automatic only","Automatic, semi-automatic and manual","Manual and emergency","Ground and flight"],a:1,e:"AUTO (CPC with FMGS data), semi-auto (crew-selected landing elevation) and MAN (direct crew control of the outflow valve)."},
{d:2,q:"The RAM AIR pushbutton:",o:["Closes the outflow valve","Provides ambient air ventilation; the ram air valve opens fully only if ΔP is below ~1 psi","Starts both packs","Activates emergency pressurization"],a:1,e:"Used for smoke removal or loss of both packs: the ram inlet feeds the mixer, with opening logic protected against high differential."},
{d:2,q:"Avionics ventilation uses:",o:["Pack air only","A blower fan and an extract fan, with skin exchange configurations","Ram air only","Trim air"],a:1,e:"Blower + extract circulate air over the avionics; the AEVC changes configuration (closed/open circuit) with skin temperature and flight/ground state."},
{d:2,q:"The DITCHING pushbutton:",o:["Opens all valves","Closes the outflow valve and valves below the waterline","Deploys the RAT","Shuts down both packs only"],a:1,e:"DITCHING seals fuselage openings below the flotation line (outflow, ram air, avionics inlet/extract, pack valves as applicable) before water contact."},
{d:2,q:"How does an air conditioning pack cool the air?",o:["Refrigerant gas cycle","Air cycle machine (compressor-turbine bootstrap) with heat exchangers","Fuel heat exchange","Peltier cells"],a:1,e:"The ACM bootstrap cycle: bleed air pre-cooled in exchangers, compressed, cooled again, then expanded through the turbine — expansion produces the cold air."},
{d:3,q:"Water in the pack outlet is handled by:",o:["Draining overboard directly","A water extractor; removed moisture is sprayed into the ram air flow improving cooling","Trim air evaporation","It is not managed"],a:1,e:"The condenser/water extractor removes moisture; injecting it into the ram flow adds evaporative cooling — free efficiency."},
{d:2,q:"The HOT AIR pushbutton OFF causes:",o:["Packs to stop","Trim air valves to close; zones receive common duct temperature only","Cabin heating to increase","Ram air to open"],a:1,e:"HOT AIR OFF shuts the trim source — used with trim faults or duct overheat; fine zone control is lost."},
{d:2,q:"The pack valves close automatically during:",o:["Cruise","Engine start, ENG FIRE pb release, and DITCHING","Descent","APU bleed operation"],a:1,e:"Pack valves shut during engine start to guarantee start bleed pressure, and with fire/ditching logics. They reopen per the start sequence timing."},
{d:1,q:"Zone temperature selection range is approximately:",o:["10–40°C","18–30°C","15–25°C","20–35°C"],a:1,e:"Selectors span roughly 18 to 30°C, with 24°C as the usual neutral position."},
{d:2,q:"The outflow valve is driven by:",o:["One motor","Three motors: two for the automatic CPC channels and one for manual control","Cabin pressure directly","Bleed air"],a:1,e:"Redundant actuation: each CPC has a motor, plus an independent manual motor commanded by the MAN V/S CTL switch."},
{d:2,q:"In manual pressurization, the crew controls cabin altitude using:",o:["The packs","MODE SEL to MAN and the MAN V/S CTL toggle to drive the outflow valve","The trim valves","The safety valves"],a:1,e:"With MODE SEL in MAN, the toggle positions the outflow valve directly; the crew flies the cabin using the V/S and cabin altitude indications."},
{d:3,q:"Normal maximum cabin descent rate targeted by the auto system is about:",o:["300 fpm","750 fpm","1500 fpm","Any rate"],a:1,e:"The schedule limits cabin descent to ~750 fpm for comfort (climb ~1000). In manual mode, the crew applies similar targets."},
{d:2,q:"Where does the AUTO mode obtain the landing elevation?",o:["Pilot entry always","From the FMGS destination data","Fixed at sea level","Radio altimeter"],a:1,e:"AUTO uses FMGS landing elevation/QNH data; the LDG ELEV knob out of AUTO provides the semi-automatic override."},
{d:2,q:"Pack controller flow demand becomes HI automatically when:",o:["Above FL300","Operating single pack or with APU bleed supplying","With HOT AIR off","In manual pressurization"],a:1,e:"Single-pack ops and APU bleed force high flow to maintain ventilation/pressurization margins regardless of selector position."},
{d:1,q:"How many recirculation fans are installed?",o:["1","2","4","None"],a:1,e:"Two recirc fans draw filtered cabin air to the mixing unit — their failure raises pack demand."},
{d:3,q:"After landing, residual cabin pressure is removed by:",o:["Opening doors against pressure","The outflow valve driving fully open on the ground","The safety valves","The packs reversing"],a:1,e:"Ground logic opens the outflow valve fully, ensuring zero ΔP before doors open — verify ΔP indication if a door feels stuck."},
{d:3,q:"In the AVIONICS SMOKE procedure, the ventilation is configured to:",o:["Full recirculation","Extract smoke overboard (blower/extract per ECAM, GEN 1 LINE logic as applicable)","Stop completely","Feed from the packs only"],a:1,e:"The drill isolates the suspected source and routes avionics air overboard to clear smoke — a procedure to walk through with the QRH."},
{d:2,q:"The emergency ram air inlet is located:",o:["On the vertical stabilizer","On the lower fuselage (belly area)","At each wing root","On the APU intake"],a:1,e:"The ram inlet on the lower fuselage feeds ambient air to the mixing unit when RAM AIR is selected."},
{d:2,q:"Cabin pressure information is displayed on:",o:["The E/WD permanently","The ECAM CAB PRESS page (auto-called when relevant)","Only the overhead panel","The PFD"],a:1,e:"CAB PRESS page shows ΔP, cabin altitude, V/S and valve positions; it auto-displays with advisories/failures."},
{d:3,q:"With both packs failed at cruise level, the correct course is:",o:["Continue at cruise level","Descend (typically FL100 or MEA) per procedure; use RAM AIR as directed","Open DITCHING","Climb to reduce ΔP"],a:1,e:"Without packs the cabin climbs; the procedure commands descent and ventilation management. Cabin altitude, not comfort, drives the urgency."},
{d:2,q:"Aft cargo compartment heating/ventilation (if installed):",o:["Uses pack 1 air directly","Uses cabin air routed through the compartment with its own isolation valves","Is provided by trim air","Does not exist on any A320"],a:1,e:"Optional cargo vent/heat draws cabin air; valves isolate the compartment for fire suppression. Confirm GLG fleet configuration."},
{d:1,q:"The pressurization system's normal cabin altitude at cruise is approximately:",o:["Sea level","Up to about 8,000 ft at maximum cruise altitude","12,000 ft","10,500 ft"],a:1,e:"The schedule keeps the cabin at or below ~8,000 ft at max certified altitude, tied to the 8.06 psi differential."},
],
BLEED: [
{d:1,q:"From which engine compressor stages is bleed air taken (CFM56)?",o:["3rd and 7th","IP (5th) and HP (9th) stages","5th only","9th only"],a:1,e:"Intermediate (5th stage) normally; high pressure (9th stage) supplements when IP pressure is low. Two ports, one regulated output."},
{d:2,q:"When does the HP bleed valve open?",o:["At takeoff thrust","At low engine power, when IP pressure is insufficient","Only on the ground","With anti-ice ON"],a:1,e:"At idle/descent power the 5th stage cannot sustain demand, so the HP valve opens; at high power it closes to save performance and limit temperature."},
{d:2,q:"How is bleed air cooled before entering the pneumatic system?",o:["By fuel","In the precooler, using engine fan air","By ram air","By the packs"],a:1,e:"The precooler is an air-air exchanger using fan discharge, with the fan air valve modulating flow to hit target temperature (~200°C)."},
{d:2,q:"Bleed air is regulated to approximately:",o:["30 psi","45 psi","60 psi","80 psi"],a:1,e:"The bleed pressure regulating valve targets about 45 psi delivered to the ducts."},
{d:2,q:"When APU BLEED is selected ON:",o:["Nothing changes","The engine bleed valves close automatically — APU bleed has priority","The crossbleed closes","The packs stop"],a:1,e:"APU bleed has priority: engine bleeds close and the crossbleed opens (AUTO), feeding both sides from the APU."},
{d:1,q:"The crossbleed valve selector positions are:",o:["ON / OFF","AUTO / OPEN / SHUT","NORM / ALTN","1 / 2 / BOTH"],a:1,e:"AUTO opens with APU bleed and closes with a detected leak; OPEN/SHUT give manual override (e.g., crossbleed engine start)."},
{d:2,q:"Which computers monitor the bleed system and leaks?",o:["The FADECs","Two BMCs (Bleed Monitoring Computers)","The FWCs","The zone controller"],a:1,e:"BMC 1 and 2 monitor their sides and the leak loops; one BMC can cover most functions of the other if it fails."},
{d:2,q:"A wing or pylon leak detection loop senses:",o:["Fuel vapor","Overheat from hot bleed air escaping a duct","Smoke","Low duct pressure"],a:1,e:"The sensing loops detect duct overheat: hot air escaping raises loop temperature, triggering BLEED LEAK and automatic isolation of that side."},
{d:2,q:"The engine bleed valve closes automatically in all these cases EXCEPT:",o:["APU bleed ON","Engine start sequence","ENG FIRE pushbutton released","Selecting PACK FLOW LO"],a:3,e:"Pack flow selection modulates pack demand, not the bleed valve. Fire pb, start sequence, leaks/overpressure and APU bleed priority all close it."},
{d:3,q:"In case of loss of electrical control, the HP valve:",o:["Fails open","Fails closed (spring loaded)","Stays as is","Cycles"],a:1,e:"The HP valve is designed to fail closed, protecting the system from 9th-stage overpressure/overtemperature."},
{d:3,q:"Overpressure protection downstream of the bleed valve is provided by:",o:["The precooler","An overpressure valve that closes/relieves at excessive duct pressure","The pack valve","The crossbleed"],a:1,e:"An OPV protects the ducting against regulation failures delivering excessive pressure — think of it as the pneumatic 'safety valve'."},
{d:2,q:"Bleed air temperature delivered after the precooler is regulated to approximately:",o:["100°C","200°C","300°C","60°C"],a:1,e:"Target around 200°C: hot enough for anti-ice effectiveness, cool enough for duct/structure protection."},
{d:1,q:"Bleed air users include:",o:["Packs, wing anti-ice, engine starting, hydraulic reservoir and water tank pressurization","Wipers and probes","Cargo doors","IDG cooling"],a:0,e:"All pneumatic consumers hang off the crossbleed ducting; probe heat and wipers are electric."},
{d:2,q:"Minimum duct pressure typically required for engine start is about:",o:["10 psi","30 psi","45 psi","60 psi"],a:1,e:"Around 30 psi ensures the air starter can accelerate the engine; below that expect a slow/failed start — relevant with weak ground carts."},
{d:2,q:"A ground high-pressure air cart connects to:",o:["The APU intake","The HP ground connector feeding the ducting for engine start","The pack outlet","The mixing unit"],a:1,e:"The HP ground connection lets a start cart pressurize the ducts when the APU bleed is unavailable."},
{d:3,q:"With APU bleed ON and an APU leak detected:",o:["Nothing happens","The APU bleed valve closes and the leak is isolated (crossbleed logic per BMC)","Engine bleeds close","The packs trip"],a:1,e:"Leak isolation logic shuts the affected supply; with APU duct leaks, APU bleed closes and engine bleeds resume supply."},
