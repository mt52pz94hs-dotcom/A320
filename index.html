{d:3,q:"With BUS TIE OFF and GEN 2 failed:",o:["AC2 recovered by APU","AC BUS 2 remains unpowered even with APU/EXT available — the tie path is open","AC1 also fails","Nothing changes"],a:1,e:"No tie = no alternate routing: understand why BUS TIE OFF is reserved for specific isolation drills."},
{d:2,q:"Wing/nav/logo/beacon lights matter to ELEC because:",o:["They are AC ESS loads","They are examples of distributed lighting loads across DC/AC buses lost per failed bus","They prevent generator overload","They are hot-bus only"],a:1,e:"Knowing which annunciators/lights die with which bus helps you confirm electrical diagnosis visually."},
{d:2,q:"The correct response to ELEC GEN 1 FAULT ECAM is:",o:["Immediate IDG disconnect","Follow ECAM: attempt reset via GEN pb cycle; consider APU start per procedure","Land immediately","BAT off"],a:1,e:"Measured sequence: reset attempt, backup source planning — IDG disconnect only if directed (mechanical distress)."},
{d:3,q:"An 'AC ESS BUS ALTN' memo/status line indicates:",o:["Failure of AC ESS","AC ESS is being fed from AC BUS 2 through the alternate path","Inverter operation","EMER config"],a:1,e:"Status vocabulary: ALTN = alternate feed active, a configuration note rather than an active failure."},
{d:2,q:"After landing with EXT PWR connected and ON, shutting down engines:",o:["Causes blackout","Buses transfer seamlessly to external power","Requires battery start later","Trips the GPU"],a:1,e:"With EXT ON, engine gen loss at shutdown hands the network to the GPU without interruption — standard turnaround flow."},
{d:2,q:"Two electrical facts to always verify against GLG FCOM are:",o:["Colors of panels","Exact battery minimum voltage and battery-only endurance figures","Number of buses","Location of receptacle"],a:1,e:"Fleet-standard-dependent numbers: quote them in the oral with the verification habit an examiner expects."}
);

BANK.HYD.push(
{d:3,q:"Spoiler panels are powered per system as follows:",o:["All on green","1:G, 2:Y, 3:B, 4:Y, 5:G (per wing, inboard to outboard)","1:B, 2:G, 3:Y, 4:G, 5:B","All on yellow"],a:1,e:"Memorize the G-Y-B-Y-G pattern: it explains exactly which spoilers survive each hydraulic failure."},
{d:3,q:"Each aileron is actuated by servos of which systems?",o:["Green + Yellow","Green + Blue","Yellow + Blue","Green only"],a:1,e:"G+B per aileron — so a G+B dual failure costs you the ailerons, leaving roll to the yellow spoilers."},
{d:3,q:"Elevator servo distribution is:",o:["Both elevators G+Y","Left elevator B+G; right elevator B+Y","Left Y+G; right B only","Both on blue"],a:1,e:"Blue backs both elevators, paired with green (left) and yellow (right) — total elevator loss needs a very specific dual failure."},
{d:3,q:"The THS is driven by hydraulic motors of:",o:["Blue + Yellow","Green + Yellow","Green + Blue","All three"],a:1,e:"Two of three systems (G+Y) power the stabilizer trim motors — mechanical input via cables from the trim wheels."},
{d:3,q:"The rudder is powered by:",o:["Green only","All three hydraulic systems","Blue + Yellow","Green + Yellow"],a:1,e:"Triple redundancy on the rudder — the surface that survives every dual hydraulic failure, key to mechanical backup."},
{d:2,q:"Hydraulic fire shutoff valves exist for:",o:["All three systems","Green and Yellow only — Blue has no engine-driven pump","Blue only","None"],a:1,e:"Fire valves isolate EDP supply; blue's pump is electric, so no engine fire valve is needed."},
{d:2,q:"Setting an ENG PUMP pb to OFF:",o:["Stops the pump rotating","Depressurizes the pump via solenoid — the pump keeps turning with the engine","Closes the fire valve","Drains the reservoir"],a:1,e:"EDPs are gear-driven: OFF only de-strokes them. Cutting fluid supply requires the fire pushbutton."},
{d:2,q:"Hydraulic pumps on the A320 are:",o:["Fixed displacement","Variable displacement, self-regulating to constant pressure","Centrifugal","Hand-operated"],a:1,e:"Variable displacement maintains ~3000 psi across demand changes — pressure stays steady while flow varies."},
{d:2,q:"The engine-driven pumps are mounted on:",o:["The fan case front","The engine accessory gearbox (N2-driven)","The pylon","The wing root"],a:1,e:"N2 rotation drives the EDP — hence windmilling engines still generate partial hydraulic flow."},
{d:3,q:"A pure GREEN + YELLOW low-level failure does NOT auto-deploy the RAT because:",o:["The RAT is manual only","RAT auto-extension logic is electrical (loss of AC 1+2), not hydraulic","The PTU prevents it","Blue pressure inhibits it"],a:1,e:"With AC power normal, the blue electric pump already keeps blue pressurized — the RAT adds nothing automatic there; manual deployment remains possible."},
{d:2,q:"Hydraulic reservoir air pressurization is approximately:",o:["3000 psi","~50 psi from the pneumatic system","500 psi","Ambient"],a:1,e:"Regulated low-pressure air (~50 psi) prevents cavitation — verify exact figure; low air pressure has its own ECAM caution."},
{d:2,q:"A RES LO AIR PR caution implies:",o:["System overpressure","Risk of pump cavitation, especially at high altitude — procedure per ECAM","Fluid loss","PTU failure"],a:1,e:"Without reservoir pressurization the pumps may cavitate; ECAM manages pump usage accordingly."},
{d:2,q:"The accumulator gas precharge is:",o:["Oxygen","Nitrogen","Compressed air","Helium"],a:1,e:"Dry nitrogen precharge — inert and stable; low precharge shows as abnormal accumulator behavior."},
{d:2,q:"The brake accumulator is recharged by:",o:["Green pressure","Yellow system pressure (engine pump or electric pump)","Blue system","The hand pump only"],a:1,e:"Any yellow pressure source recharges it — on the ground the yellow electric pump does the job."},
{d:3,q:"On the ECAM HYD page, PTU operation is indicated by:",o:["A yellow flag","The PTU symbol with flow direction between green and yellow","Reservoir arrows","A pressure needle"],a:1,e:"The page shows the PTU coupling and which way power flows — verify it matches the failure logic you expect."},
{d:2,q:"An electric pump OVHT indication requires:",o:["Increasing its load","Switching the pump OFF per ECAM to prevent damage","Deploying the RAT","Opening leak valves"],a:1,e:"Thermal protection: shut the overheated pump; system consequences follow the standard loss-of-pressure logic."},
{d:3,q:"After a dual engine flameout, the primary flight-control hydraulic source is:",o:["Yellow electric pump","The RAT pressurizing the blue system (auto-deployed with AC loss)","The PTU","Accumulators"],a:1,e:"AC loss deploys the RAT; blue carries flight controls (plus windmilling G/Y partial flow) — the ditching/relight scenario baseline."},
{d:2,q:"With the yellow reservoir empty (fluid lost), the hand pump:",o:["Still opens cargo doors","Is useless — it pumps fluid, and there is none","Pressurizes green instead","Recharges the accumulator"],a:1,e:"No fluid, no hydraulics: cargo doors stay shut until maintenance refills — pumps move fluid, they don't create it."},
{d:2,q:"The RAT is stowed in:",o:["The tailcone","The lower fuselage/belly fairing area","The wing root leading edge","The nose bay"],a:1,e:"Belly fairing stowage; deployment drops it into the airstream — know the location for the walkaround."},
{d:2,q:"CSM/G stands for:",o:["Central System Master Generator","Constant Speed Motor/Generator — the blue-hydraulic-driven emergency generator","Cabin Smoke Management Gear","Crossbleed System Manifold Gauge"],a:1,e:"Blue pressure spins the CSM/G at constant speed to make stable 400 Hz emergency power."},
{d:3,q:"With GREEN + BLUE systems lost:",o:["Roll control is lost","Ailerons are lost; roll comes from yellow spoilers (2,4); slats inoperative; flaps available on yellow at half speed","Only rudder remains","Flaps and slats both lost"],a:1,e:"Trace the mapping: G+B kills ailerons (G+B) and slats (G+B); yellow keeps spoilers 2/4, flaps (half), right elevator side, rudder share."},
{d:3,q:"With YELLOW + BLUE systems lost:",o:["Gear must free-fall","Green keeps gear/brakes/NWS normal; flaps AND slats both operate at half speed on green","No braking exists","Ailerons lost"],a:1,e:"Green is the do-everything system: gear normal, both high-lift channels alive at half rate, left elevator + ailerons(G) + spoilers 1/5."},
{d:2,q:"Which dual hydraulic failure preserves NORMAL landing gear extension?",o:["G+Y","Y+B (green intact)","G+B","None"],a:1,e:"Only green extends the gear normally — any failure pair that spares green keeps normal extension."},
{d:2,q:"A transient GREEN pump LO PR during engine start is:",o:["A failure requiring maintenance","Normal until the engine reaches stable rotation","A leak sign","PTU fault"],a:1,e:"Pressure builds with N2: momentary LO PR flickers during the start sequence are expected."},
{d:2,q:"An engine pump FAULT light illuminates for:",o:["Only overheat","Low pressure (and reservoir-related conditions per logic)","High pressure","PTU activity"],a:1,e:"FAULT integrates LO PR with the associated ECAM caution — read the HYD page for the underlying cause."},
{d:2,q:"Hydraulic fluid characteristics require:",o:["No precautions","Skin/eye protection and paint care — phosphate-ester fluid is aggressive","Warming before flight","Weekly replacement"],a:1,e:"Skydrol-type fluid irritates tissue and strips paint — handle and report leaks accordingly."},
{d:3,q:"Hydraulic leak trend monitoring between flights is supported by:",o:["Crew memory","CFDS/maintenance data and reservoir quantity comparisons","The FADEC","The FQI"],a:1,e:"Maintenance tracks quantities/trends via the maintenance system — crews report abnormal quantity drops."},
{d:2,q:"Cockpit hydraulic pressure indications exist:",o:["On overhead gauges","Only on ECAM (plus the brake triple indicator)","On the pedestal","On standby instruments"],a:1,e:"No dedicated mechanical gauges apart from the brake triple indicator — ECAM is the reference."},
{d:2,q:"The PTU 'barking' noise on ground during start is:",o:["Abnormal — stop start","Normal self-test behavior as differential pressure develops","Cargo door operation","RAT test"],a:1,e:"Cyclic PTU engagement sounds like barking — brief it to avoid unnecessary alarm; continuous operation would be abnormal."},
{d:2,q:"Ground hydraulic servicing/connections are located:",o:["In the cockpit","At ground service panels (belly/wing areas) with self-sealing couplings","On the tail","At the refuel panel"],a:1,e:"Maintenance carts pressurize systems via service connections for checks without running engines."},
{d:3,q:"During maintenance, GREEN can be pressurized without engines by:",o:["The blue pump","Yellow electric pump + PTU power transfer","Hand pump","RAT"],a:1,e:"Y elec pump drives the PTU, pressurizing green — the standard engines-off green pressure method (with its ground safety implications)."},
{d:3,q:"A failed (unpowered) spoiler servo results in the panel:",o:["Floating up","Being held/retained in the retracted position","Full extension","Oscillation"],a:1,e:"Fail-safe: dead spoilers stay down, preserving lift symmetry; ECAM flags the affected panel on F/CTL page."},
{d:3,q:"In mechanical backup, pitch control works because:",o:["Elevators are cable-driven","The THS remains hydraulically powered (G/Y) but mechanically COMMANDED via the trim wheel","Springs move the THS","The rudder does pitch"],a:1,e:"Mechanical backup = mechanical signaling, hydraulic muscle: cables command the still-pressurized THS motors."},
{d:2,q:"Hydraulic temperature monitoring is via:",o:["Continuous gauges","Discrete OVHT detection (reservoir) driving ECAM cautions","The fuel temperature","No monitoring exists"],a:1,e:"No analog temp display — overheat discretes trigger the caution and pump-off procedures."},
{d:2,q:"System pressure fluctuating slightly with heavy control demand is:",o:["A leak","Normal — variable pumps re-stroke to match flow demand","PTU failure","Accumulator loss"],a:1,e:"Transient dips under big demands (gear + flaps) are expected; sustained low pressure is not."},
{d:2,q:"Yellow system total loss affects nosewheel steering how?",o:["NWS lost","NWS unaffected — it is a green system user","NWS reverts to pedals only","NWS locks center"],a:1,e:"Cross-check user lists: steering, normal brakes and gear all live on green — yellow loss touches none of them."},
{d:3,q:"After RAT deployment (EMER ELEC), flight control law is typically:",o:["Normal law retained","Degraded (alternate) law due to the associated electrical/computer losses","Direct law immediately","Mechanical backup"],a:1,e:"The law depends on remaining computers/sensors, not the RAT itself — EMER ELEC configurations pair with alternate law; direct comes with gear."},
{d:2,q:"Reservoir quantity indications on the HYD page turn amber when:",o:["Above normal","Below the low-level threshold band","At exactly half","Never"],a:1,e:"Amber band = leak suspicion; ECAM low-level procedures shut pumps to protect what remains for isolation logic."},
{d:2,q:"Which statement about the hand pump is correct?",o:["It pressurizes all systems","It serves yellow only, for cargo doors, accessible at the ground service area","It charges the brake accumulator in flight","It is located in the cockpit"],a:1,e:"A niche ground tool: yellow circuit, cargo door actuation, external access."},
{d:2,q:"Cargo door operation with engines running is:",o:["Standard","Restricted/prohibited per SOP — yellow pressurization and PTU interactions on ground","Required for cooling","Automatic"],a:1,e:"Ground safety: door circuits, PTU inhibits and area hazards make engines-running cargo operation a controlled exception. Verify GLG SOP."},
{d:3,q:"With only BLUE operating (G+Y lost), the ECAM approach strategy includes:",o:["Normal configuration","Slats only (no flaps), gravity gear, accumulator braking, increased approach speed and landing distance","Autoland CAT 3","Normal braking with anti-skid"],a:1,e:"Blue survivors: slats(with G lost→half? actually blue channel), spoiler 3, elevators, rudder, emer gen. Configuration/performance corrections come from QRH tables — rehearse this scenario."},
{d:3,q:"Why does the G+Y dual failure leave SLATS available but not FLAPS?",o:["Flaps are electric","Slats ride on green+BLUE; flaps on green+YELLOW — blue survives, yellow doesn't","Slats have accumulators","It doesn't — both are lost"],a:1,e:"Channel mapping is the key: high-lift availability after failures reads directly from G+B (slats) / G+Y (flaps)."},
{d:2,q:"Wing anti-ice, cargo doors and reservoir pressurization relate to hydraulics because:",o:["They are hydraulic users","They illustrate cross-system dependencies (pneumatic pressurizes reservoirs; yellow moves doors)","They share fluid","No relation"],a:1,e:"Systems thinking: bleed problems can degrade hydraulics (reservoir air); electrical problems can strand cargo doors."},
{d:2,q:"The three-system design philosophy ensures:",o:["Triple flight time","No single (and no probable dual) failure leaves the aircraft uncontrollable","Cheaper maintenance","Faster flap operation"],a:1,e:"Surface actuation is deliberately spread so any dual failure retains pitch, roll and yaw paths — certification by architecture."},
{d:3,q:"Which surfaces remain with GREEN alone (Y+B lost)? Select the complete set:",o:["Rudder only","L elevator, THS, ailerons(single servo), spoilers 1&5, rudder, flaps+slats half speed, gear/brakes/NWS","Spoilers 2&4 and flaps","Ailerons and right elevator only"],a:1,e:"Run the mapping mentally by system letters — the examiner will ask exactly this style of consolidation."},
{d:2,q:"Quantity check before flight is done:",o:["Dipstick","On the ECAM HYD page (plus maintenance ground indicators)","By pressure only","Not required"],a:1,e:"Preliminary cockpit prep includes HYD quantities within normal band — low quantity is a dispatch/maintenance item."},
{d:2,q:"Yellow ELEC pump running indication appears:",o:["Nowhere","On the HYD page (pump symbol) and overhead pb light","On E/WD permanently","On the fuel page"],a:1,e:"Crosscheck overhead selection with HYD page status — standard verification habit."},
{d:3,q:"PTU inhibition logic exists during first engine start because:",o:["Noise abatement","To avoid PTU cycling on normal single-system pressure transients during the start","Fuel saving","Certification test only"],a:1,e:"Green pressurizes before yellow: without inhibition, the ΔP would run the PTU pointlessly each start."},
{d:2,q:"After landing, brief PTU activity during shutdown transients is:",o:["A fault to log always","Normal as engine pumps spool down asymmetrically","A leak indicator","Impossible"],a:1,e:"Differential decay of G/Y pressures can trigger short PTU runs — recognize normal vs continuous abnormal operation."},
{d:2,q:"Parking with all pumps off, brake pressure comes from:",o:["Green accumulator","The yellow brake accumulator","Blue accumulator","Residual line pressure only"],a:1,e:"Accumulator-held parking brake (~12 h design) — the triple indicator verifies it on the walkaround."},
{d:3,q:"Servicing mixed fluids (wrong hydraulic fluid) risks:",o:["Nothing if same color","Seal/system damage — phosphate-ester systems require the approved fluid specification","Better lubrication","Only smell issues"],a:1,e:"Fluid specification is a hard maintenance limit; contamination events are reportable and grounding."},
{d:2,q:"Hydraulic panel layout on the overhead includes:",o:["Only one pump pb","ENG 1 PUMP, ENG 2 PUMP, ELEC PUMPS (B auto/Y), PTU, RAT MAN ON, BLUE PUMP OVRD","Reservoir heaters","Brake fans"],a:1,e:"Know the panel geography — flows and abnormals reference these pushbuttons by location."},
{d:2,q:"The blue system's design role is best described as:",o:["Ground services system","Flight-control continuity + emergency electrical generation system","Braking system","High-lift primary"],a:1,e:"Blue exists so control surfaces and emergency power survive engine/pump losses — its user list reflects that mission."},
{d:3,q:"Total hydraulic quantity loss on ONE system in cruise: first crew priority is:",o:["Immediate diversion","ECAM sequence: secure pumps per procedure, assess remaining-system consequences via STATUS, plan configuration/performance for landing","RAT deployment","Fuel dumping"],a:1,e:"Method over reflex: run ECAM, read STATUS equipment losses, then strategize approach configuration — the oral wants the process."},
{d:2,q:"Green system pressurizes which brake function?",o:["Alternate brakes","Normal braking with anti-skid and autobrake","Parking brake","None"],a:1,e:"Normal braking architecture rides on green through the BSCU — alternate/parking are yellow's territory."},
{d:2,q:"An amber LO PR on the SYSTEM (not pump) means:",o:["Pump switch off only","Actual system pressure below threshold — users at risk regardless of pump status","Reservoir full","PTU active"],a:1,e:"Differentiate pump LO PR (source problem) from system LO PR (network problem) when diagnosing on the HYD page."},
{d:3,q:"Why can't the PTU help after GREEN fluid loss (quantity zero)?",o:["It can fully restore green","PTU transfers power, not fluid — an empty green system has nothing to pressurize","PTU needs blue","Electrical inhibit"],a:1,e:"The classic trap: PTU aids pressure-source failures, not fluid-loss failures. State it precisely in the oral."},
{d:2,q:"RAT deployment in flight is announced by:",o:["Silence","ECAM (EMER config indications) and characteristic aerodynamic noise/vibration","A green memo only","Cabin chime"],a:1,e:"Crew recognizes RAT operation by config warnings/status and the audible signature — confirm on HYD/ELEC pages."},
{d:2,q:"Which is TRUE about system interconnection?",o:["Fluid can crossfeed via PTU","Systems never exchange fluid; only the PTU exchanges POWER between G and Y","Blue feeds yellow in emergency","Reservoirs share a common vent"],a:1,e:"Independence is absolute on the fluid side — contamination or loss stays contained to one system."},
{d:3,q:"For the oral: 'Explain your hydraulic priorities after ENG 1 failure at V2.' Best structure:",o:["List every valve","Green EDP lost → PTU restores green from yellow automatically; confirm on HYD page; no immediate crew hydraulic action — fly the aircraft","Deploy RAT","Turn off yellow pump"],a:1,e:"Automation covers it: PTU bridges green. Your answer shows systems knowledge + prioritization (aviate first)."},
{d:2,q:"Blue overheat with BLUE PUMP OVRD in use on ground:",o:["Continue","Pump OFF per indication — ground testing respects thermal limits","Increase load","Deploy RAT"],a:1,e:"Thermal discipline applies on ground tests exactly as in flight."},
{d:2,q:"Which fluid quantity behavior suggests a slow leak?",o:["Stable quantity","Progressive quantity decrease across flights on one system","Oscillation with pump load","Growth when cold"],a:1,e:"Trend awareness: report progressive drops — maintenance isolates with leak measurement valves."},
{d:2,q:"The hydraulic content most examiners want linked to FCTL is:",o:["Pump part numbers","Which surfaces/servos each color powers and what survives each dual failure","Reservoir volumes","Fluid brand"],a:1,e:"The surface-to-system matrix is the payoff of this chapter — drill it until instant."},
{d:3,q:"State the complete GREEN user list:",o:["Slats, spoiler 3, emer gen","Gear+doors, NWS, normal brakes, ENG1 reverser, flaps(½)+slats(½), L elevator, THS, rudder share, ailerons servo, spoilers 1&5, PTU side","Cargo doors, alternate brakes","CSM/G and slats only"],a:1,e:"Green = the workhorse. Recite user lists by color fluently — a guaranteed oral question."},
{d:3,q:"State the complete YELLOW user list:",o:["Gear and NWS","ENG2 reverser, alternate+parking brakes, cargo doors, flaps(½), R elevator, THS, rudder share, spoilers 2&4, PTU side, Y elec/hand pump services","Slats and emer gen","Normal brakes"],a:1,e:"Yellow = braking backup + ground services + its surface share. Pair this with the green and blue lists."},
{d:3,q:"State the complete BLUE user list:",o:["Cargo doors and parking brake","Slats(½), spoiler 3, both elevators servo share, rudder share, CSM/G emergency generator, RAT-pressurized","Gear and reverser 1","Flaps and NWS"],a:1,e:"Blue = flight controls continuity + emergency power. Three lists mastered = hydraulic chapter mastered."}
);

BANK.FCTL.push(
{d:2,q:"How many Slat Flap Control Computers (SFCC) are installed?",o:["1","2, each with one slat channel and one flap channel","3","4"],a:1,e:"Two SFCCs; each computer runs both a slat and a flap channel — full redundancy per surface type."},
{d:2,q:"With one SFCC failed:",o:["Flaps and slats are lost","Flaps and slats operate at HALF speed","Only slats work","Nothing changes"],a:1,e:"One remaining channel per surface halves the drive rate — same effect as losing one hydraulic supply to the system."},
{d:3,q:"The Wing Tip Brakes (WTB) activate on:",o:["Pilot command","Asymmetry, overspeed, runaway or uncommanded movement of slats/flaps — and CANNOT be released in flight","Hydraulic low pressure","Touchdown"],a:1,e:"WTBs lock the transmission to freeze a dangerous condition; release is maintenance-only — the surfaces stay where they locked."},
{d:3,q:"The 'A. LOCK' indication on the E/WD means:",o:["Autopilot locked","Slat retraction is inhibited by the alpha/speed lock function (high AOA or low speed)","Aileron jam","Autobrake engaged"],a:1,e:"Alpha lock prevents retracting slats when slow/high AOA — protecting stall margin during a mis-sequenced cleanup."},
{d:2,q:"High-lift surfaces per wing are:",o:["3 slats, 3 flaps","5 slats and 2 flaps","4 slats, 1 flap","6 slats, 2 flaps"],a:1,e:"Five leading-edge slats, two trailing-edge flap surfaces per wing, driven by torque shafts from central PCUs."},
{d:3,q:"VFE for CONF FULL is:",o:["163 kt","177 kt","185 kt","200 kt"],a:1,e:"VFE ladder: 1→230, 1+F→215, 2→200, 3→185, FULL→177 kt (A320ceo typical — verify GLG FCOM)."},
{d:3,q:"VFE for CONF 2 and CONF 3 are respectively:",o:["215/200","200/185","185/177","230/215"],a:1,e:"Same ladder: memorize the descending 230-215-200-185-177 sequence — placarded and asked constantly."},
{d:2,q:"VMO / MMO of the A320 is:",o:["320 kt / M 0.78","350 kt / M 0.82","340 kt / M 0.80","360 kt / M 0.84"],a:1,e:"350/0.82 with high-speed protection (normal law) beyond — the barber pole references on the PFD."},
{d:3,q:"Flaps auto-retract from 1+F to 1 (slats only) at:",o:["190 kt","210 kt","230 kt","VFE"],a:1,e:"At 210 kt the flap portion retracts automatically, protecting the flap while keeping CONF 1 slats."},
{d:2,q:"Speedbrake extension with autopilot engaged is limited to:",o:["Full deflection","Half deflection","One third","Inhibited"],a:1,e:"With AP on, speedbrakes reach half travel — full deflection is available in manual flight."},
{d:2,q:"The F/CTL page shows:",o:["Only flap position","Surface positions (elevators, ailerons, spoilers, rudder), computer status and hydraulic supply per surface","Fuel-CG","Autopilot modes"],a:1,e:"The flight control check reads this page: each surface's response plus ELAC/SEC status confirms integrity."},
{d:2,q:"ELAC or SEC FAULT lights are handled by:",o:["Ignoring in flight","Pushbutton OFF/ON reset attempt per ECAM/QRH","Pulling breakers immediately","Landing ASAP always"],a:1,e:"Computer resets by pb cycling are standard; persistent faults reconfigure control paths automatically."},
{d:2,q:"Rudder trim with autopilot engaged:",o:["Is manual","Is automatic (FAC) — the pedestal knob is inhibited","Does not exist","Uses the trim wheel"],a:1,e:"AP flight includes auto rudder trim; the RESET pb re-centers trim in manual flight."},
{d:3,q:"After extreme upset recovery, the abnormal attitude law leaves the aircraft in:",o:["Normal law","Alternate law (without certain protections) for the remainder","Direct law with autotrim","Mechanical backup"],a:1,e:"Abnormal attitude triggers a specific law during the upset, then latches alternate afterwards — protections don't fully return."},
{d:3,q:"In alternate law, alpha protection is replaced by:",o:["Nothing at all","Low speed stability plus STALL aural warning — the aircraft CAN be stalled","Alpha floor only","Automatic slats"],a:1,e:"Static stability nudges the nose down and the 'STALL' + cricket warns — but no hard AOA limit exists anymore."},
{d:3,q:"The stall warning in alternate/direct law consists of:",o:["A red flag","'STALL STALL' aural with cricket sound at the computed warning AOA","Stick shaker","ECAM caution only"],a:1,e:"No stick shaker on Airbus FBW: aural stall warning appears once protections are gone — respect VLS/VSW."},
{d:2,q:"The amber 'USE MAN PITCH TRIM' PFD message appears in:",o:["Normal law","Direct law — autotrim is inoperative","Alternate law with protections","Ground mode"],a:1,e:"Direct law removes autotrim; the message commands conventional trimming technique."},
{d:3,q:"'MAN PITCH TRIM ONLY' in red on the PFD indicates:",o:["Direct law","Mechanical backup — pitch only via trim wheel, lateral via rudder","Trim runaway","THS jam"],a:1,e:"The deepest degradation: no elevator computer path — stabilize with THS and rudder while restoring computers."},
{d:2,q:"Sidestick inputs from both pilots simultaneously (no takeover) are:",o:["Ignored","Algebraically summed, limited to maximum single-stick deflection, with DUAL INPUT warning","Averaged then doubled","Captain's only"],a:1,e:"Summation plus the aural/visual dual-input alerting — the CRM lesson: one pilot flies."},
{d:2,q:"The sidestick priority takeover pushbutton also functions as:",o:["Trim switch","Autopilot instinctive disconnect","PTT radio","Alpha floor arm"],a:1,e:"Same red pb: quick press = AP disconnect; press-and-hold = stick priority over the other side."},
{d:3,q:"Sidestick priority annunciations include:",o:["Nothing","'PRIORITY LEFT/RIGHT' aural and arrow lights on the glareshield","ECAM warning only","Stick vibration"],a:1,e:"Glareshield arrows point to the side with priority; a red light in front of the deactivated pilot."},
{d:3,q:"Ground spoiler PARTIAL extension occurs when:",o:["Fully armed at touchdown","Reverse selected with only one main gear strut compressed","Speed above 72 kt","Autobrake MAX armed"],a:1,e:"Partial lift-dumping assists a bounced/one-gear touchdown when reverse is pulled — full extension follows both struts."},
{d:3,q:"Pitch attitude protection limits are:",o:["±20°","+30°/-15° (reduced to +25° at low speed)","+45°/-30°","+15°/-10°"],a:1,e:"Attitude limits complete the envelope set; they trim back near limits so the aircraft resists exceedances."},
{d:2,q:"High speed protection, when active:",o:["Retards thrust","Adds a nose-up demand and limits bank, preventing steady flight far beyond VMO/MMO","Extends speedbrakes","Disconnects hydraulics"],a:1,e:"Above VMO/MMO thresholds the aircraft pitches to recover — spiral-dive protection by design."},
{d:3,q:"Alpha floor is available:",o:["At all times","From lift-off until 100 ft RA on approach, in normal law, below certain Mach","Above FL200 only","In all control laws"],a:1,e:"Availability window matters: no alpha floor in alternate/direct law nor at high Mach — thrust protection has boundaries."},
{d:2,q:"After alpha floor activation, thrust remains at TOGA due to:",o:["Lever position","TOGA LK (lock) — cancelled by disconnecting the A/THR","FADEC failure","Alpha prot"],a:1,e:"'TOGA LK' on the FMA: thrust stays locked until the crew deliberately disconnects autothrust."},
{d:2,q:"The rudder in ALL control laws is:",o:["Electrically signaled only","Available via conventional mechanical/hydraulic path (with FAC electrical functions on top)","Locked at high speed","Spoiler-augmented"],a:1,e:"Classic rudder control survives computer degradation — cornerstone of mechanical backup lateral control. (Note: later models differ.)"},
{d:2,q:"Takeoff THS setting comes from:",o:["A fixed 0 position","The load & trim sheet CG, set on the trim wheel within the green band","The FMGC automatically on ceo","Yesterday's landing"],a:1,e:"Crew sets pitch trim per CG before takeoff; outside the green band = config warning at power application."},
{d:2,q:"The flap lever position must match:",o:["Nothing specific","The takeoff CONF inserted in the MCDU PERF page (1+F, 2 or 3)","Always CONF 2","The landing configuration"],a:1,e:"FMGS/actual configuration agreement is checked — mismatch invalidates computed V-speeds."},
{d:3,q:"CONF 3 landings require:",o:["Nothing special","LDG FLAP 3 GPWS selection and appropriate performance corrections","VFE FULL respect","Autoland prohibition"],a:1,e:"Config 3 is the abnormal/performance option: GPWS pb prevents nuisance alerts; speeds/distances per QRH."},
{d:3,q:"Does the A320 (not A321) have automatic flap load relief?",o:["Yes, FULL to 3","No — flap load relief is an A321 feature; on A320 respect VFE manually","Yes, on all configs","Only with sharklets"],a:1,e:"Common trap: A321's FLRS auto-retracts FULL→3 on overspeed; the A320 relies on pilot speed discipline. Verify fleet docs."},
{d:2,q:"Aileron droop function:",o:["Rolls the aircraft","Both ailerons deflect ~5° down with flaps extended, augmenting lift","Assists speedbrakes","Only on ground"],a:1,e:"Droop makes the ailerons part of the high-lift system while retaining roll authority around the drooped position."},
{d:2,q:"Slat/flap asymmetry between wings is detected by:",o:["The pilots visually","SFCC position pickoff comparison, commanding WTB lock","Hydraulic pressure","The FAC"],a:1,e:"Position sensors on the transmissions feed the SFCCs; disagreement beyond tolerance freezes the system via WTBs."},
{d:2,q:"S speed and F speed represent:",o:["Stall speeds","Slat retraction target (S) and flap retraction target (F) during cleanup","Spoiler limits","Steering speeds"],a:1,e:"Cleanup schedule: at F retract flaps (CONF change), at S retract slats to clean — displayed on the PFD speed tape."},
{d:2,q:"VLS displayed on the PFD is approximately:",o:["1.1 VS","1.23 VS1g (landing) — lowest selectable speed","V2","1.4 VS"],a:1,e:"VLS marks the amber-strip top: A/THR won't command speeds below it. (1.13 VS1g at takeoff phase — verify)."},
{d:2,q:"Releasing the stick at 45° bank in normal law results in:",o:["Holding 45°","Roll back to and hold 33° bank","Wings level","Increasing bank"],a:1,e:"Positive spiral stability above 33°: within 33°, the aircraft holds the established bank (neutral stability)."},
{d:3,q:"With one ELAC remaining (single ELAC operative):",o:["Direct law always","Normal law can be retained if supporting sensors/systems allow","Alternate law mandatory","Mechanical backup"],a:1,e:"Laws degrade by information/actuation availability, not computer count alone — one healthy ELAC may still deliver normal law."},
{d:2,q:"Each SEC controls:",o:["All ten spoilers","Specific spoiler pairs (plus standby elevator function on SEC 1/2)","Ailerons","The THS only"],a:1,e:"Spoiler pairs are distributed across the three SECs — losing one SEC removes its pairs from roll/speedbrake."},
{d:3,q:"With flaps jammed by WTB at CONF 2 in flight, the crew:",o:["Resets WTB pb","Flies QRH flap/slat jam procedure: speed limits, approach speed corrections (ΔVREF) and landing distance factors","Recycles the lever repeatedly","Uses gravity extension"],a:1,e:"No in-flight release exists: the QRH converts the stuck configuration into safe speeds and distances."},
{d:2,q:"During the flight control check, spoiler verification requires:",o:["Speedbrake lever full and observing panels on F/CTL page? No — spoilers are checked via roll inputs","Full stick displacements observing surface response on the F/CTL page","Ground spoiler arming","PTU running"],a:1,e:"Stick full deflections show ailerons AND roll spoilers responding on the SD — plus rudder pedal check."},
{d:2,q:"Autopilot engagement moves the sidesticks:",o:["Yes, they follow","No — sticks stay neutral; there is no backdrive","Only in pitch","Only the captain's"],a:1,e:"No control feedback motion on Airbus: monitor the FMA and instruments, not stick movement."},
{d:2,q:"The E/WD slat/flap indication shows:",o:["Only the lever position","Actual surface position plus the selected target (S/F index marks and CONF label)","Hydraulic pressure","VFE"],a:1,e:"Watch actual vs target during transit — jams/asymmetry become visible immediately."},
{d:3,q:"In direct law, roll handling requires care because:",o:["Spoilers are lost","Stick directly commands surfaces: response varies with airspeed and no rate damping assists","The rudder is locked","Bank protection is stricter"],a:1,e:"Direct proportional control = conventional jet feel: small inputs at high speed, anticipate at low speed."},
{d:2,q:"Ailerons contribute to the speedbrake function:",o:["Yes, symmetrically up","No — only spoilers 2-4 act as speedbrakes","Yes, drooped","Only above 250 kt"],a:1,e:"Speedbrakes are spoiler-only; ailerons handle roll (and droop), never symmetric drag."},
{d:2,q:"The flap lever is located:",o:["Overhead","Right side of the pedestal","Left console","On the FCU"],a:1,e:"Pedestal right — with the ground spoiler lever and its ARMED position on the left of the thrust levers."},
{d:2,q:"Pitch trim outside the green band at takeoff power triggers:",o:["Nothing","A takeoff configuration warning","Autotrim correction","FLEX inhibition"],a:1,e:"CONFIG PITCH TRIM warning: mis-set trim is a killer item — always crosschecked against the loadsheet."},
{d:2,q:"Rudder trim position indication is:",o:["On the PFD","On the pedestal rudder trim indicator (and F/CTL page)","Overhead","Not displayed"],a:1,e:"Digital/graphic indication by the knob; verify near zero for takeoff."},
{d:3,q:"An overspeed event in alternate law is announced by:",o:["Silent protection","OVERSPEED warning (CRC + master warn) requiring manual recovery","Automatic pitch-up hard protection","Speedbrake auto-extension"],a:1,e:"Warning replaces protection: the crew must recover — idle, speedbrakes as required, smooth pitch."},
{d:3,q:"Why is the A320 said to be 'carefree' in normal law?",o:["No pilot needed","The pilot can demand maximum performance (full stick) and the system limits AOA, load and attitude automatically","It self-lands","Turbulence has no effect"],a:1,e:"Envelope protections allow full deflections in an escape maneuver (windshear/EGPWS) without stalling or overstressing."},
{d:2,q:"During windshear escape in normal law, the recommended technique includes:",o:["Partial back stick","TOGA + full back stick if needed — alpha protections manage AOA","Configuration change","Autopilot on"],a:1,e:"The protections are designed for exactly this: commanding maximum performance safely."},
{d:2,q:"Speed brake lever operation in flight:",o:["Armed detent used airborne","Progressive lever aft extends spoilers 2-4 up to half/full per AP state","Automatic only","Same lever as flaps"],a:1,e:"Manual modulated drag; remember auto-retraction conditions (TOGA, protections, config FULL)."},
{d:3,q:"After both FACs fail:",o:["Rudder is lost","Yaw damping/turn coordination/rudder trim/travel limiting lost; rudder use with care — limiter frozen at last value","Alternate law only in pitch","Nothing happens"],a:1,e:"FAC loss strips the rudder electronics: careful feet at high speed (frozen limiter) and manual coordination."},
{d:2,q:"Characteristic speeds on the PFD are computed by:",o:["FMGC only","The FACs from weight/configuration data","The ELACs","ADIRUs alone"],a:1,e:"FAC speed computation drives VLS/S/F/GD and stall warning references — flag their loss mentally when FACs degrade."},
{d:3,q:"'Direct law' gains are scheduled with:",o:["Speed only","Configuration (and CG) — control sensitivity is adapted to flap setting","Altitude","Weight only"],a:1,e:"Gain scheduling keeps direct law manageable across configurations — but pilot smoothness is the real protection."},
{d:2,q:"During cleanup after takeoff, correct sequence at F then S is:",o:["Gear, then flaps anytime","At F speed: flaps 1; at S speed: flaps 0 (clean)","Immediate clean at 400 ft","At green dot: CONF 1"],a:1,e:"Fly the speed tape cues: F → reduce a stage, S → clean; green dot becomes your clean reference."},
{d:2,q:"Ground spoilers retract after landing when:",o:["Automatically at 40 kt","The lever is disarmed (or thrust levers advanced)","Reverse stows","Anti-skid releases"],a:1,e:"Disarming (or a go-around thrust application) retracts them — part of the after-landing flow."},
{d:3,q:"A jammed sidestick is countered by:",o:["Both pilots pushing","The other pilot pressing and HOLDING the takeover pb (40 s latches priority)","ELAC reset","Trim only"],a:1,e:"Priority latching isolates the faulty stick permanently — the design answer to a jammed-input failure."},
{d:2,q:"In normal law at cruise, a full aft stick pull results in:",o:["Stall","Load factor limited (2.5 g) climb with alpha protections guarding AOA","Overspeed protection","Autopilot engagement"],a:1,e:"G-limited maneuver: protections integrate load, AOA and attitude simultaneously."},
{d:3,q:"Elevator control redundancy: both ELACs fail AND both SEC 1/2 fail:",o:["Elevator remains via SEC 3","Pitch by THS mechanical backup only (trim wheel)","Nothing changes","FACs take the elevator"],a:1,e:"SEC 3 has no elevator function: this stack-up lands you in mechanical backup pitch — the reason the trim wheel path exists."},
{d:2,q:"'CONF FULL' green on the E/WD confirms:",o:["Flap lever at 3","Slats/flaps at the full landing configuration matching lever FULL","VFE exceedance","GPWS flap 3 mode"],a:1,e:"Configuration confirmation for the landing checklist — actual position, not just lever position."},
{d:2,q:"The primary purpose of the flight control laws architecture is:",o:["Reduce pilot workload only","Consistent handling qualities across the envelope plus protection against exceedances","Fuel savings","Autoland capability"],a:1,e:"Same stick response at any weight/CG/speed + envelope protection — the FBW value proposition, and a classic oral opener."},
{d:3,q:"Which failures typically produce ALTERNATE law? (best answer)",o:["Any single computer","Dual ADR, dual ELAC-type combinations, certain dual hydraulic or electrical configurations per FCOM tables","Gear extension","Speedbrake use"],a:1,e:"Alternate results from defined dual-failure combinations — study the FCOM reconfiguration table rather than memorizing one trigger."},
{d:2,q:"The rudder pedals on the ground (above 6° NWS authority) primarily provide:",o:["Full 75° steering","Rudder aerodynamic control + limited NWS for the takeoff/landing roll","Braking only","No function"],a:1,e:"Pedals blend limited steering with growing rudder authority as speed rises — directional control continuity through rotation."},
{d:2,q:"Recommended sidestick technique is:",o:["Continuous large corrections","Small, deliberate inputs, releasing to neutral — the aircraft holds the flight path","Constant back pressure","Two-handed grip"],a:1,e:"Path-stable FBW rewards minimal input; overcontrolling fights the design."},
{d:3,q:"During a bounced landing with ground spoilers extended, adding TOGA causes:",o:["Spoilers stay out","Automatic ground spoiler retraction as go-around logic activates","WTB lock","Autobrake MAX"],a:1,e:"Thrust lever go-around position retracts lift dumpers — the system supports the balked landing decision."},
{d:2,q:"Flight control probes/sensors feeding the laws include:",o:["Only stick position","ADR (speed/AOA), IR (attitudes/rates), configuration and weight data","Fuel flow","Cabin pressure"],a:1,e:"Air data + inertial + configuration feed the law computations — why ADR failures degrade laws."},
{d:3,q:"For the oral: 'What changes for you as pilot from normal to alternate law?' Core answer:",o:["Nothing important","Protections become warnings: respect VLS/stall warning and VMO manually; expect direct law at gear extension; fly conventionally","Autopilot flies better","Trim becomes manual immediately"],a:1,e:"Show operational translation of system knowledge — the mindset shift from protected to conventional flying is the answer they want."}
);

BANK.ELEC.push(
{d:2,q:"The AC ESS FEED pushbutton ALTN selection transfers the AC ESS BUS supply from:",o:["AC BUS 2 to AC BUS 1","AC BUS 1 to AC BUS 2","TR1 to TR2","Battery to inverter"],a:1,e:"Normal feed is AC BUS 1; ALTN reroutes essential AC to BUS 2 after an AC 1 side problem."},
{d:3,q:"Why does the ELEC EMER CONFIG procedure direct starting the APU (if available)?",o:["For bleed air","Restoring a main generator exits the emergency configuration and recovers normal networks","To charge batteries faster only","For cabin lighting"],a:1,e:"The APU generator can repower both AC buses — transforming a battery-limited emergency into a manageable failure."}
);
BANK.HYD.push(
{d:2,q:"Nominal operating pressure of all three hydraulic systems is:",o:["2500 psi","3000 psi (RAT: ~2500 psi on blue)","3500 psi","5000 psi"],a:1,e:"3000 psi standard; the RAT delivers reduced pressure/flow — enough for essential flight controls."},
{d:2,q:"The BLUE electric pump operates:",o:["Only on ground","Automatically whenever AC power is available (with OVRD for ground control)","Only in flight","Only with the RAT"],a:1,e:"Auto-run with electrical power keeps blue pressurized continuously — its FAULT light follows LO PR/OVHT logic."},
{d:3,q:"Landing gear GRAVITY extension after green loss requires spoiler/system knowledge because:",o:["Gear falls instantly","Doors open mechanically and gear locks by gravity/springs — green low pressure does not prevent it; NWS remains lost","Yellow must be pressurized","Blue drives the gear"],a:1,e:"Free-fall is independent of hydraulics once released — but steering (green) stays inoperative: plan the rollout."},
{d:2,q:"The leak measurement valves (maintenance) allow:",o:["Fluid transfer between systems","Isolating flight control circuits on ground to locate leaks","In-flight isolation","Refilling reservoirs"],a:1,e:"Ground troubleshooting hardware — crews only need to know they exist and are maintenance tools."}
);
BANK.FCTL.push(
{d:2,q:"Ground spoilers ARMED is indicated by:",o:["ECAM memo GND SPLRS ARMED","Both: speedbrake lever pulled up in ARMED detent and ECAM memo","A blue light on the FCU","F/CTL page flag only"],a:1,e:"Physical lever position plus the memo line — verified in the before-landing/takeoff flows."},
{d:3,q:"Speedbrake extension is inhibited or auto-retracted when (best set):",o:["Never","TOGA thrust, alpha protection active, CONF FULL, or with certain computer failures","Below FL100","With gear down"],a:1,e:"Inhibition logic protects performance-critical phases — reciting these conditions is standard oral material."},
{d:2,q:"The purpose of the takeover priority latch (holding pb 40 s) is:",o:["Radio transmission","Permanently deactivating a failed/jammed sidestick for the remainder of the flight","Autopilot engagement","Dual input training"],a:1,e:"Latched priority means the failed stick cannot re-inject inputs — flight continues on the healthy side."}
);

BANK.NAV=[];
BANK.NAV.push(
{d:1,q:"How many ADIRUs equip the A320?",o:["2","3","4","1"],a:1,e:"Three Air Data / Inertial Reference Units — each combines an ADR and an IR part."},
{d:2,q:"Each ADIRU contains:",o:["Only gyros","An ADR part (air data) and an IR part (inertial reference), independently selectable","GPS only","A radio altimeter"],a:1,e:"ADR gives speed/altitude/AOA/temp; IR gives attitude, heading, position — either part can fail separately."},
{d:2,q:"IR alignment on ground requires:",o:["Engines running","Aircraft stationary with present position entered (several minutes full alignment)","Airborne leveling","External power only"],a:1,e:"Motion corrupts alignment; position entry via MCDU INIT. Fast realignment available per FCOM when position is valid."},
{d:2,q:"The ADIRS panel IR mode selector positions are:",o:["ON/OFF","OFF / NAV / ATT","ALIGN/RUN","1/2/3"],a:1,e:"NAV is normal full inertial mode; ATT provides attitude/heading only after inertial navigation is lost."},
{d:3,q:"In ATT mode the IR provides:",o:["Full navigation","Attitude and heading only — heading must be entered/updated manually (magnetic drift)","Position updates","Nothing"],a:1,e:"ATT recovers attitude after alignment loss in flight; position/track data are gone."},
{d:2,q:"The ON BAT light on the ADIRS panel indicates:",o:["Alignment complete","One or more IRs powered by aircraft battery","GPS loss","IR failure"],a:1,e:"IR battery supply indication — expect it briefly during power transfers; continuous on ground = investigate."},
{d:3,q:"Loss of two ADRs results in:",o:["No effect","Degradation to alternate law and loss of associated protections/characteristic speeds","Direct law immediately","Autoland capability"],a:1,e:"Dual ADR failure removes air data voting — flight controls degrade; unreliable speed procedures may apply."},
{d:2,q:"The AIR DATA and ATT HDG switching selectors allow:",o:["Turning off ADIRUs","Supplying the Captain's or F/O's displays from ADIRU 3 after a failure","Selecting GPS","Testing probes"],a:1,e:"CAPT ON 3 / F/O ON 3 reroute display sources — standard reconfiguration after ADR or IR faults."},
{d:2,q:"How many radio altimeters are installed?",o:["1","2","3","4"],a:1,e:"Two RAs feed height below 2,500 ft for autoland, GPWS, callouts and law transitions."},
{d:2,q:"FM position is computed from:",o:["GPS only","A mix of IRS positions refined by GPS and/or radio navaid updates","VOR only","Dead reckoning"],a:1,e:"The FMGC blends IRS with GPS (GPS PRIMARY) or DME/DME, VOR/DME updating — accuracy shown on PROG page."},
{d:2,q:"GPS PRIMARY on the ND/PROG page means:",o:["GPS failed","Navigation accuracy meets requirements using GPS updating — no raw-data crosscheck required per SOP","Manual tuning needed","IRS only"],a:1,e:"GPS PRIMARY LOST triggers accuracy checks against raw data — know both states for RNAV operations."},
{d:2,q:"ND display modes available are:",o:["MAP only","ROSE (ILS/VOR/NAV), ARC and PLAN","HSI only","Compass only"],a:1,e:"Selected on the EFIS control panel with ranges 10-320 NM; PLAN is for route review."},
{d:2,q:"Navaids are normally tuned:",o:["Manually always","Automatically by the FMGC, with manual tuning available on the RAD NAV page","By ATC","Via RMP only"],a:1,e:"Autotuning supports position updating and display; RAD NAV page overrides when needed."},
{d:3,q:"Backup NAV tuning when both MCDUs/FMGCs fail is done via:",o:["Impossible","The RMPs (NAV backup mode under the cover)","The transponder","The FCU"],a:1,e:"RMP NAV key (guarded) tunes VOR/ILS directly — a degraded-mode skill worth demonstrating in the sim."},
{d:2,q:"The EGPWS enhances basic GPWS with:",o:["Radar returns","A terrain database enabling Terrain Ahead alerting and terrain display on ND","TCAS logic","Windshear prediction"],a:1,e:"Predictive terrain function with look-ahead alerts — display via TERR ON ND pushbutton."},
{d:2,q:"TCAS traffic is displayed on:",o:["PFD only","The ND (and RAs on the PFD V/S scale)","MCDU","E/WD"],a:1,e:"Intruder symbology on ND; resolution guidance on the vertical speed scale."},
{d:2,q:"The transponder panel on the pedestal controls:",o:["VHF frequencies","ATC code, mode selection and TCAS TA/RA modes","ILS course","ADF only"],a:1,e:"Combined ATC/TCAS panel: STBY/AUTO/ON, altitude reporting, TA only vs TA/RA."},
{d:3,q:"With one IR failed, autoland capability:",o:["Unaffected CAT 3 DUAL","Downgrades per FCOM (CAT 3 SINGLE/CAT 2 depending on configuration)","Is lost entirely","Improves"],a:1,e:"Redundancy losses cascade into approach capability — check the FCOM/QRH capability tables."},
{d:2,q:"Heading vs track on the ND:",o:["Identical always","Heading is where the nose points; track (diamond) is actual path over ground including drift","Track is magnetic only","Heading includes wind"],a:1,e:"The green track diamond versus lubber line difference visualizes drift — core instrument scan knowledge."},
{d:2,q:"ILS raw data is displayed by:",o:["Automatic always","Pressing LS on the EFIS panel (deviation scales on PFD)","MCDU PROG","The FCU APPR key"],a:1,e:"LS pb shows LOC/GS scales; APPR on FCU arms the capture modes — two different actions."},
{d:2,q:"The weather radar tilt function:",o:["Is automatic only","Adjusts antenna elevation manually to profile weather returns","Changes range","Selects frequency"],a:1,e:"Tilt discipline avoids over/under-scanning cells; gain refines return intensity. (Auto tilt on some standards — verify.)"},
{d:3,q:"IRS residual ground speed check after alignment should show:",o:["Any value","Near zero GS with position agreement between the three IRs","100 kt","Exactly airport elevation"],a:1,e:"Drift/GS residuals validate alignment quality before taxi — part of preliminary cockpit prep."},
{d:2,q:"Marker beacon indications appear:",o:["On the ND only","On the PFD (OM/MM blue/amber cues) with aural tones","On ECAM","On the RMP"],a:1,e:"Classic ILS markers still supported — PFD annunciation with associated audio."},
{d:2,q:"The standby compass:",o:["Does not exist","Provides magnetic heading independent of all electrical navigation systems","Requires IR 3","Is electronic"],a:1,e:"A direct-reading magnetic compass survives total system loss — with its deviation card."},
{d:3,q:"DME distance displayed on the PFD near the ILS ident refers to:",o:["Destination distance","The DME associated/paired with the tuned ILS","Nearest VOR","GPS distance"],a:1,e:"ILS/DME pairing feeds approach distance checks — verify ident/morse per raw data procedures."},
{d:2,q:"ADR probes include:",o:["Only pitot","Pitot, static ports, AOA vanes and TAT probes","GPS antennas","Radio altimeter horns"],a:1,e:"The measured air data set — all heated (probe/window heat) — feeding the three ADRs."},
{d:3,q:"Unreliable airspeed situations relate to NAV because:",o:["They don't","ADR disagreements trigger comparisons/rejections; memory items pitch/thrust apply until reliable sources are identified","GPS fixes speed","The IRs measure airspeed"],a:1,e:"ADR voting logic and crew isolation of the faulty source are the system side of the UAS drill."},
{d:2,q:"Position accuracy check (no GPS PRIMARY) compares:",o:["Two MCDUs","FM position against raw navaid data (needle/DME) per SOP thresholds","IRS 1 vs 2 only","ND vs PFD"],a:1,e:"Required in non-GPS-PRIMARY RNAV ops — thresholds per FCOM (e.g., terminal/enroute values)."},
{d:2,q:"Both FMGCs failed — navigation continues using:",o:["Nothing","IRS data, RMP backup tuning and raw data flying","GPS direct to airport","Compass only"],a:1,e:"Degraded nav toolkit: know how to fly conventional raw data on the A320 when the FMS layer drops."},
{d:2,q:"The EFIS control panel manages:",o:["Autopilot modes","ND mode/range, navaid overlays (VOR/ADF), FD, LS, and map option keys (CSTR/WPT/NDB/ARPT)","Radio frequencies","Engine displays"],a:1,e:"Per-pilot display control — know each key's effect for instrument procedures."}
);
BANK.AFS=[];
BANK.AFS.push(
{d:1,q:"The FMGS comprises:",o:["One computer","2 FMGCs, 2 MCDUs, the FCU and the FACs","Only the FCU","3 autopilots"],a:1,e:"Flight Management and Guidance System: management (FMGC/MCDU) + guidance (AP/FD/ATHR) + envelope (FAC)."},
{d:2,q:"On the FCU, PUSHING a selector knob means:",o:["Selected guidance","Managed guidance (FMGS targets)","Disconnect","Test"],a:1,e:"Push = give it to the aircraft (managed, dashes/dot); Pull = take it (selected value). The core FCU philosophy."},
{d:2,q:"Managed targets are displayed:",o:["In amber","In magenta (speed) with dots/dashes in FCU windows","In green","On the E/WD"],a:1,e:"Magenta = FMGS-managed; cyan/blue = selected by crew — color language of the PFD."},
{d:2,q:"AP engagement after takeoff is permitted:",o:["At V1","Above 100 ft AGL (approximately, per FCOM conditions)","On the runway","Above 1,500 ft only"],a:1,e:"Minimum engagement height plus stabilized conditions — verify the exact FCOM figure."},
{d:2,q:"Standard AP disconnection is via:",o:["FCU AP pb","The sidestick takeover (instinctive disconnect) pushbutton","Pulling breakers","Moving the stick hard"],a:1,e:"Takeover pb = standard (single 'cavalry charge' + master warn cancel on second press); FCU pb is the non-standard path."},
{d:2,q:"Thrust lever detents from idle forward are:",o:["IDLE-CL-MCT-TOGA","IDLE, CL (climb), FLX/MCT, TOGA (plus reverse aft of idle)","IDLE-TOGA only","Continuous with no detents"],a:1,e:"Four forward detents; A/THR is active with levers in CL (normal) and armed white/active per FMA."},
{d:2,q:"During normal operations after thrust reduction altitude, thrust levers stay in:",o:["TOGA","CL detent — A/THR manages thrust up to the CL limit","MCT","Manual modulation"],a:1,e:"Set-and-forget: levers in CL, autothrust commands within the climb limit; moving levers changes the ceiling."},
{d:2,q:"A/THR active vs armed is shown:",o:["Nowhere","On the FMA right column: white A/THR (armed) vs blue? — active in white box/blue per state on FMA","On the thrust levers","On ECAM only"],a:1,e:"FMA discipline: announce A/THR status changes; armed appears during takeoff (blue), active thereafter (white)."},
{d:3,q:"Alpha floor delivers:",o:["Idle thrust","TOGA thrust regardless of lever position, when AOA passes the threshold (normal law)","CL thrust","Autoland"],a:1,e:"FAC-commanded thrust protection; TOGA LK follows — cancel with A/THR disconnect."},
{d:2,q:"The FMA is read in columns representing:",o:["Random data","Thrust | Vertical | Lateral | Approach capability | AP-FD-ATHR status","Speed only","Engine ratings"],a:1,e:"Five columns on top of the PFD — the single source of truth for what the automation is doing."},
{d:2,q:"OP CLB differs from managed CLB in that:",o:["Nothing","OP CLB climbs openly to FCU altitude ignoring FMS vertical constraints","OP CLB uses idle","CLB is manual"],a:1,e:"Managed CLB respects flight plan constraints; open modes fly directly to the FCU-selected level."},
{d:2,q:"Pressing APPR on the FCU arms:",o:["Autoland directly","LOC and G/S capture modes (or APP NAV/FINAL for non-precision per standard)","Go-around","LAND mode"],a:1,e:"Approach arming per approach type; verify capture on the FMA — never assume."},
{d:2,q:"LAND mode engages:",o:["At glideslope capture","Below 400 ft RA on an ILS with AP — locking the guidance for autoland","At the FAF","At minimums"],a:1,e:"After LAND, FLARE and ROLL OUT follow; disconnecting requires go-around or AP off."},
{d:2,q:"Go-around guidance is obtained by:",o:["Pressing APPR again","Setting thrust levers to TOGA — SRS/GA TRK engage","FCU pull","Retracting flaps"],a:1,e:"Lever-driven mode change: TOGA triggers the go-around FMA regardless of prior modes."},
{d:2,q:"SRS mode provides:",o:["Cruise speed","Pitch guidance for takeoff/GA maintaining V2+10 (or current speed logic)","Autotrim","Track hold"],a:1,e:"Speed Reference System: initial climb-out pitch orders tied to configuration and speed."},
{d:2,q:"HDG-V/S vs TRK-FPA pushbutton changes:",o:["Autopilot count","Guidance references between heading/vertical-speed and track/flight-path-angle (with FPV bird)","Altitude units","ND range"],a:1,e:"TRK-FPA shows the flight path vector 'bird' — preferred for some non-precision techniques."},
{d:3,q:"CAT 3 DUAL requires:",o:["One AP","Both autopilots engaged (fail-operational) with required systems per capability table","No RA","Manual thrust"],a:1,e:"Second AP engages when APPR is armed; capability shown in the FMA fourth column — brief the downgrade triggers."},
{d:2,q:"The FCU altitude selector outer ring selects:",o:["Metric","100 ft or 1,000 ft increments","QNH","Flight level only"],a:1,e:"Increment choice speeds altitude setting; always crosscheck the window and PFD target."},
{d:3,q:"FMGC dual mode means:",o:["Both fail together","Both FMGCs synchronized exchanging data (master per AP engaged); independent/single modes exist for failures","Two flight plans","Double waypoints"],a:1,e:"Normal = dual synchronized. Degradations: independent (no crosstalk) and single (one FMGC feeding both) — MCDU annunciations differ."},
{d:2,q:"The MCDU INIT page is used for:",o:["Approach setup","Route, alignment position, weights/fuel (INIT B) at preflight","Radio tuning","Holding"],a:1,e:"Preflight data flow starts at INIT A/B — company route, IRS position, ZFW/block fuel."},
{d:2,q:"Cost Index affects:",o:["Nothing","FMGS-computed ECON speeds (time vs fuel optimization)","V1/VR","Landing distance"],a:1,e:"CI 0 = max range economy; high CI = time priority — company policy value entered in PERF/INIT."},
{d:2,q:"FLX temperature entry on PERF TAKEOFF enables:",o:["De-rated climb only","Reduced takeoff thrust when levers set to FLX/MCT detent","Autobrake","Higher V2"],a:1,e:"Assumed temperature method: FLX must satisfy limits (not below actual OAT/TREF conditions per FCOM)."},
{d:2,q:"V1/VR/V2 are inserted:",o:["Automatically always","By the crew on PERF TAKEOFF (checked against configuration)","On the FCU","Via ACARS only"],a:1,e:"Crew-verified insertion; blue/magenta presentation on PFD tape at takeoff."},
{d:2,q:"The PROG page shows:",o:["Weather","Cruise level, optimum/max altitudes, position accuracy and required navigation data","Fuel only","The flight plan legs"],a:1,e:"Progress monitoring: OPT/REC MAX altitudes and update accuracy live here."},
{d:3,q:"EXPED pushbutton (where fitted) commands:",o:["Economy cruise","Maximum climb/descent performance (green dot up / speed limit down) to FCU altitude","Autoland","Steep approach"],a:1,e:"Expedite mode for rapid level change — check fleet fit; use with awareness of energy management."},
{d:2,q:"FD orders with both FDs off and A/THR active:",o:["A/THR keeps current mode","A/THR reverts to SPEED mode protection philosophy","Thrust locks","No change ever"],a:1,e:"FD/ATHR mode interdependencies: removing FDs changes autothrust behavior — verify per FCOM logic."},
{d:2,q:"Selected speed is shown on the PFD as:",o:["Magenta triangle","Cyan/blue reference matching the FCU window value","Green dot","Amber bug"],a:1,e:"Crew-selected values = blue; managed = magenta — instant recognition of who commands the target."},
{d:3,q:"AP minimum use height on a non-precision approach is approximately:",o:["Touchdown","Per FCOM (e.g., MDA-related/160 ft class limits) — know your operator values","500 ft","No limit"],a:1,e:"Approach-type-dependent AP minimums exist — quote the GLG FCOM/AFM figures in the oral."},
{d:2,q:"The FCU controls:",o:["Only altitude","SPD/MACH, HDG/TRK, ALT, V/S-FPA selections, AP1/2, A/THR, EXPED(if fitted), metric alt","MCDU pages","Flight controls"],a:1,e:"Glareshield short-term interface versus MCDU long-term management — the two-level automation interface concept."},
{d:2,q:"When automation surprises you, the recommended first action set is:",o:["Reprogram the MCDU","Reduce automation level: FDs/AP off if needed, fly the aircraft, then reengage methodically","Cycle the FMGCs","Pull breakers"],a:1,e:"Airbus golden rule: take over, stabilize, then rebuild automation from the FMA upward."}
);
BANK.COM=[];
BANK.COM.push(
{d:1,q:"How many RMPs (Radio Management Panels) are installed?",o:["1","3","2","4"],a:1,e:"Two on the pedestal, one overhead — any RMP can tune any VHF/HF radio."},
{d:2,q:"Audio selection (mic/reception per radio) is done at:",o:["The RMP","The ACPs (Audio Control Panels)","The FCU","MCDU"],a:1,e:"RMP = frequency management; ACP = audio routing, volumes and transmission keying."},
{d:2,q:"VHF 3 is commonly reserved for:",o:["Emergency","ACARS datalink","ATIS listening","Company voice only"],a:1,e:"Default data radio; it remains usable for voice if needed per procedure."},
{d:2,q:"SELCAL alerts the crew:",o:["Of ECAM faults","When a ground station calls the aircraft's code on HF/VHF — light/chime without monitoring audio","Of cabin calls","Of ACARS messages only"],a:1,e:"Selective calling saves continuous HF listening on oceanic ops — code per aircraft."},
{d:2,q:"ACARS provides:",o:["Radar service","Digital datalink for OOOI, weather, clearances (PDC/D-ATIS), company messages, maintenance reports","Passenger WiFi","Voice encryption"],a:1,e:"Data left/right of the ATSU — printer/MCDU interface; CPDLC availability per fleet standard (verify GLG fit)."},
{d:2,q:"With one RMP failed:",o:["The associated radio is lost","Any remaining RMP tunes all radios","VHF1 only remains","HF is lost"],a:1,e:"Full reconfiguration by design; the SEL indication shows a radio tuned from a non-onside panel."},
{d:2,q:"The SEL light on an RMP means:",o:["Squelch active","The onside radio is being tuned by another RMP","Emergency frequency","SATCOM active"],a:1,e:"Cross-tuning awareness light — coordination cue between pilots."},
{d:2,q:"Flight interphone allows:",o:["PA to cabin","Communication between cockpit crew (and ground mechanic via the service jack)","ATC backup","Cabin-to-cabin"],a:1,e:"INT function on ACP; the external jack near the nose gear connects the ground engineer."},
{d:2,q:"The MECH call button in the cockpit:",o:["Rings the cabin","Sounds the horn in the nose gear bay to call the ground mechanic","Calls maintenance base","Tests audio"],a:1,e:"Ground crew alerting — matched by the external horn used for APU fire on ground."},
{d:2,q:"CAB (attendant) calls from the cockpit are made via:",o:["PA only","The CALLS panel (ALL/FWD/AFT/EMER) through CIDS chimes/lights","VHF 2","SELCAL"],a:1,e:"CALLS overhead panel drives attendant station chimes; EMER generates the emergency call indication."},
{d:2,q:"PA announcements from the cockpit use:",o:["Any VHF","The PA key on the ACP or the handmike PA selection — with priority over cabin sources","The RMP","CVR channel"],a:1,e:"Cockpit PA overrides cabin crew PA and boarding music per CIDS priority."},
{d:2,q:"When the oxygen mask is donned, the microphone path:",o:["Is lost","Switches to the mask mic (boom mic muted per audio logic/INT-RAD as set)","Requires the handmike","Uses PA only"],a:1,e:"Mask microphone integrates with the ACP — practice mask-on communication in the sim."},
{d:2,q:"The INT/RAD switch on the ACP:",o:["Tunes radios","Keys interphone (INT) or transmits on the selected radio (RAD) hands-off","Controls PA volume","Resets audio"],a:1,e:"Rocker/latching transmit selector — RAD position transmits without pressing the PTT."},
{d:3,q:"Voice-only filtering on a VOR/ADF audio channel:",o:["Boosts ident","Removes the morse ident leaving voice (or vice versa per VOICE key)","Encrypts audio","Is automatic"],a:1,e:"VOICE button filters navaid idents — remember to verify idents BEFORE filtering when checking raw data."},
{d:2,q:"Emergency frequency guarding:",o:["Not possible","121.5 monitored typically on VHF 2 per SOP/company policy","Automatic on VHF1","Only on HF"],a:1,e:"Company SOP dictates guard monitoring — standard airmanship on international ops."},
{d:2,q:"CVR inputs include:",o:["Only area mic","Each pilot's audio channels plus the cockpit area microphone","Cabin PA only","ACARS data"],a:1,e:"All cockpit audio paths are recorded — the reason for sterile cockpit discipline."},
{d:3,q:"Loss of both on-side ACP: audio recovery is via:",o:["Impossible","The AUDIO SWITCHING selector (third-occupant ACP takes over CAPT or F/O)","RMP audio mode","PA system"],a:1,e:"The overhead AUDIO SWITCHING rotary substitutes ACP 3 — a small panel worth locating before you need it."},
{d:2,q:"HF radios (if installed) are primarily for:",o:["Taxi clearances","Long-range/oceanic communication beyond VHF line-of-sight","ACARS only","Emergency only"],a:1,e:"HF propagation covers remote airspace; SELCAL pairs with it. Fleet fit — verify GLG aircraft."},
{d:2,q:"Passenger address priority order (highest first) is:",o:["Music, cabin, cockpit","Cockpit PA, cabin crew PA, prerecorded/boarding music","Cabin, cockpit, music","No priorities"],a:1,e:"CIDS enforces cockpit priority — your emergency announcement always cuts through."},
{d:2,q:"Datalink clearances (PDC/DCL) arrive via:",o:["VHF voice","ACARS/ATSU printer or MCDU display","SELCAL","Transponder"],a:1,e:"Printed/displayed clearance workflow per company procedure — crosscheck against the FMS route."},
{d:2,q:"Which panel keys radio transmission from the sidestick area?",o:["None","The PTT on each sidestick (RAD selected source)","FCU key","MCDU"],a:1,e:"Sidestick PTT transmits on the ACP-selected radio — the everyday transmit path."},
{d:2,q:"Communication failures in flight are managed by:",o:["Silence","Standard ICAO lost-comm procedures + transponder 7600 + attempts on all radios/frequencies","Immediate diversion always","ACARS text only"],a:1,e:"System knowledge plus procedural response — expect the oral to link both."}
);

{d:2,q:"VLO extension / VLO retraction / VLE are:",o:["250 / 220 / 280 kt","250 / 220 / 280 kt — M 0.67 with gear","220 / 250 / 270 kt","All 250 kt"],a:1,e:"Extend ≤250, retract ≤220, fly extended ≤280/M0.67 — the trio to recite without hesitation."},

{d:2,q:"Maximum tailwind for takeoff and landing is typically:",o:["5 kt","10 kt (15 kt where certified/authorized)","20 kt","No limit"],a:1,e:"Standard 10 kt; some aircraft/airports allow 15 for landing — verify GLG FCOM and performance."},
{d:3,q:"CFM56 EGT limits: takeoff and start are approximately:",o:["950 / 725 °C","915-950 °C (TOGA, 5/10 min) and 725 °C during start","1000 / 800 °C","850 / 700 °C"],a:1,e:"TOGA time limit 5 min (10 min single engine); start EGT 725 °C — verify exact GLG engine standard values."},
{d:3,q:"TOGA thrust time limit is:",o:["Unlimited","5 minutes (10 minutes with engine failure)","2 minutes","15 minutes"],a:1,e:"Thermal limitation on maximum thrust — MCT is the continuous rating."},
{d:3,q:"N1 and N2 maximum limits are approximately:",o:["100% / 100%","104% / 105%","110% / 108%","102% / 103%"],a:1,e:"Redline speeds on the engine gauges — verify per GLG FCOM engine section."},
{d:3,q:"Oil temperature limits (CFM56) are approximately:",o:["120 °C max","140 °C continuous / 155 °C transient (15 min)","160 °C continuous","No limit"],a:1,e:"Max continuous vs time-limited transient — plus minimum oil temp before takeoff thrust application. Verify GLG."},

{d:1,q:"The A320 has how many main passenger/service doors?",o:["2","4 (two forward, two aft) plus overwing emergency exits","6","8"],a:1,e:"Four cabin doors plus overwing exits per configuration — each with slide provisions."},

{d:2,q:"Cabin doors open:",o:["Inward","Outward and forward (parallel to fuselage), power-assisted damper","Sliding up","Rotating"],a:1,e:"Handle lifting unlatches; the door swings forward outside — gust lock secures it open."},

{d:2,q:"Minimum dispatch crew oxygen pressure depends on:",o:["A fixed number always","Temperature and number of crew per the FCOM table","Passenger count","Altitude of departure"],a:1,e:"Pressure-vs-temperature dispatch chart for the crew count — always answer 'per the FCOM table' then quote your value."},

{d:3,q:"Smoking/open flame during oxygen use is prohibited because:",o:["Regulation formality","Oxygen-enriched atmospheres dramatically intensify combustion","O2 is flammable itself","It ruins the masks"],a:1,e:"Oxygen is an oxidizer: fire risk management is integral to the oxygen chapter."},

{d:2,q:"Oxygen system indications appear on:",o:["The FUEL page","The DOOR/OXY SD page (crew cylinder pressure)","E/WD permanently","The FCU"],a:1,e:"Pressure readout with amber logic below thresholds — checked in preliminary cockpit preparation."}

BANK.ABBR=[];
BANK.ABBR.push(
{d:1,q:"ECAM stands for:",o:["Engine Computer And Monitoring","Electronic Centralized Aircraft Monitoring","Electric Cabin Alert Module","Emergency Checklist Auto Manager"],a:1,e:"The centralized monitoring/alerting concept at the heart of Airbus cockpit philosophy."},

{d:2,q:"SDAC stands for:",o:["Standard Data Access Card","System Data Acquisition Concentrator","Secondary Display Alert Computer","Static Discharge Air Conditioner"],a:1,e:"SDACs collect system parameters for ECAM display and FWC caution generation."},

{d:2,q:"SFCC stands for:",o:["Standard Flight Computer Core","Slat Flap Control Computer","Secondary Flight Condition Controller","Surface Force Command Computer"],a:1,e:"Two SFCCs, each with a slat and a flap channel."},
{d:2,q:"ELAC stands for:",o:["Electronic Landing Approach Computer","Elevator Aileron Computer","Electric Load Alternating Current","Emergency Lateral Attitude Control"],a:1,e:"Two ELACs: normal elevator/stabilizer and aileron control."},

{d:2,q:"FAC stands for:",o:["Flight Augmentation Computer","Full Aileron Control","Flight Attitude Calculator","Fuel Air Controller"],a:1,e:"Two FACs: rudder functions, yaw damping, characteristic speeds, windshear detection."},
{d:2,q:"ADIRU stands for:",o:["Air Data Inertial Reference Unit","Advanced Digital Instrument Reference Unit","Air Driven Inertial Rotation Unit","Attitude Display Internal Reference Unit"],a:1,e:"Combined ADR + IR in one unit; three installed."},

{d:2,q:"THS stands for:",o:["Thrust Handling System","Trimmable Horizontal Stabilizer","Total Hydraulic System","Terminal Heading Selector"],a:1,e:"The pitch trim surface — autotrimmed in normal law, mechanical backup capable."},
{d:2,q:"WTB stands for:",o:["Wing Tank Boost","Wing Tip Brake","Wheel Temperature Block","Warning Tone Box"],a:1,e:"Locks the slat/flap transmission on asymmetry/overspeed/runaway — no in-flight release."},

{d:2,q:"MCDU stands for:",o:["Master Central Display Unit","Multipurpose Control and Display Unit","Mode Change Data Uplink","Main Cabin Door Unit"],a:1,e:"The FMS keyboard/screen interface — two installed (third optional)."},
{d:2,q:"EIS stands for:",o:["Engine Indication System","Electronic Instrument System","Emergency Information Set","Electric Ignition Starter"],a:1,e:"The six-display suite (PFD/ND/ECAM) with its DMCs."},

{d:2,q:"DMC stands for:",o:["Display Management Computer","Digital Mode Converter","Data Master Chip","Dual Monitor Controller"],a:1,e:"Three DMCs generate display imagery; DMC 3 is the spare via the EIS switching."},
{d:2,q:"TLA stands for:",o:["Total Lift Angle","Thrust Lever Angle","Terminal Landing Approach","Torque Limit Actuator"],a:1,e:"Lever position input to the FADEC — detents define the rating structure."},
{d:2,q:"ABCU stands for:",o:["Auto Brake Control Unit","Alternate Braking Control Unit","Air Bleed Check Unit","Auxiliary Battery Charge Unit"],a:1,e:"Manages alternate braking when the normal (BSCU/green) channel is unavailable."}
);

{d:2,q:"Runway distance credit for reversers in dry performance is:",o:["Full","Generally none (dry) — reversers are credit on contaminated/wet per certification rules","Double","Only NOSE reverser"],a:1,e:"Performance philosophy: reverse is a bonus dry, credited on some contaminated cases — verify GLG performance policy."},
{d:2,q:"The DECEL light NOT illuminating on a contaminated runway with autobrake MED is:",o:["A failure","Possibly normal — anti-skid limited deceleration below selected rate","Reason to reject","Autobrake off"],a:1,e:"Skid-limited friction may never reach the target decel — brief this expectation."},

{d:2,q:"Maximum taxi speed guidance (turns) is approximately:",o:["Any speed","~10 kt in sharp turns, ~30 kt straight per FCTM technique","50 kt","5 kt always"],a:1,e:"Technique values protect gear side loads and passenger comfort."}
