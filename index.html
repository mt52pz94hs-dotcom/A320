const SCRIPTS=[{"sysId":"ELEC","num":1,"title":"ELECTRICAL — SISTEMA ELÉCTRICO","es":{"d":"El A320 genera corriente alterna con dos IDG de 90 kVA, uno por motor, a 115 V y 400 Hz. Cada IDG alimenta su barra AC BUS 1 o 2. Dos TR convierten a 28 V DC para las barras DC. Dos baterías de 23 Ah flotan en la red vía sus contactores, controlados por sus limitadores de carga. Fuentes adicionales: el generador del APU de 90 kVA disponible en todo el sobre de vuelo, la toma externa EXT PWR, y el generador de emergencia CSM/G de 5 kVA movido por el sistema hidráulico azul con la RAT.","n":"En operación normal cada generador alimenta su propio lado con los bus tie contactors gestionando la conexión. La prioridad de fuentes por barra es: generador propio, EXT PWR, APU GEN, y por último el tie del lado opuesto. Los TR alimentan las barras DC; las barras esenciales AC ESS y DC ESS cuelgan normalmente del lado 1 y son transferibles.","a":"Con un generador perdido, el otro asume toda la red por bus tie con desprendimiento automático de cargas de galley. Con ambos generadores perdidos entramos en EMER ELEC: la RAT despliega automáticamente, presuriza el azul y el CSM/G alimenta AC ESS y DC ESS. Por debajo de unos 140 nudos la RAT decae y las baterías sostienen lo esencial, con una autonomía de referencia de 30 minutos. En tierra sin fuentes, la batería permite arrancar el APU con un mínimo de 25.5 V.","p":"Cada GCU protege su generador por sobre y sub voltaje, frecuencia y corriente diferencial. El IDG se desconecta con su pushbutton guardado por sobretemperatura, desconexión irreversible en vuelo. Las baterías se aíslan automáticamente ante condiciones anormales de carga."},"en":{"d":"The A320 generates AC power with two 90 kVA IDGs, one per engine, at 115 V, 400 Hz. Each IDG feeds its AC BUS 1 or 2. Two transformer-rectifiers supply 28 V DC. Two 23 Ah batteries float on the network through battery contactors managed by charge limiters. Additional sources: the 90 kVA APU generator available throughout the flight envelope, external power, and the 5 kVA CSM/G emergency generator driven by the blue hydraulic system via the RAT.","n":"In normal operation each generator powers its own side, with bus tie contactors managing connections. Source priority per bus is: onside generator, external power, APU generator, and finally the opposite-side tie. TRs feed the DC busses; the essential AC and DC busses normally hang from side 1 and are transferable.","a":"With one generator lost, the remaining one carries the whole network through the bus tie, with automatic galley shedding. With both generators lost we enter EMER ELEC: the RAT deploys automatically, pressurizes blue, and the CSM/G powers AC ESS and DC ESS. Below roughly 140 knots RAT output decays and the batteries sustain essentials, with a reference endurance of 30 minutes. On ground with no source, the battery allows an APU start with a 25.5 V minimum.","p":"Each GCU protects its generator against over/under voltage, frequency and differential current. The IDG disconnects via its guarded pushbutton on overtemperature — irreversible in flight. Batteries isolate automatically on abnormal charging conditions."},"keys":"2×IDG 90 kVA · 115V/400Hz · 28V DC · bat 2×23 Ah, ~30 min · APU GEN 90 kVA · CSM/G 5 kVA · RAT ≥140 kt · bat start APU ≥25.5 V"},{"sysId":"HYD","num":2,"title":"HYDRAULICS — SISTEMA HIDRÁULICO","es":{"d":"Tres sistemas independientes, verde, azul y amarillo, a 3,000 psi nominales; la RAT presuriza el azul a unos 2,500 psi. El verde es presurizado por la bomba EDP del motor 1; el amarillo por la EDP del motor 2 más una bomba eléctrica; el azul por bomba eléctrica y por la RAT en emergencia. Existe una bomba manual para la puerta de carga en el amarillo. Los reservorios se presurizan con aire del sistema neumático.","n":"En vuelo normal las tres EDP y la lógica automática mantienen presión. El PTU transfiere potencia, no fluido, entre verde y amarillo cuando detecta un diferencial de unos 500 psi, en ambos sentidos. En tierra el PTU se inhibe durante el arranque con lógica específica.","a":"Perdido el verde, el PTU lo recupera desde el amarillo y viceversa. La pérdida doble G+Y deja el azul con RAT: controles de vuelo en configuración degradada y frenado alternativo por acumulador. La pérdida del azul solo cuesta principalmente el generador de emergencia y algunos spoilers. Las fallas dobles son ejercicios QRH de reparto de superficies: memorizar qué superficie vive en qué sistema.","p":"Válvulas de fuego en verde y amarillo se cierran con el fire pushbutton. Válvulas de prioridad sacrifican consumidores pesados con presión baja. El sistema monitorea cantidad, temperatura y presión de cada reservorio con avisos ECAM dedicados."},"en":{"d":"Three independent systems, green, blue and yellow, at a nominal 3,000 psi; the RAT pressurizes blue to about 2,500 psi. Green is pressurized by the engine 1 EDP; yellow by the engine 2 EDP plus an electric pump; blue by an electric pump and by the RAT in emergency. A hand pump on yellow operates the cargo door.  Reservoirs are pressurized with bleed air.","n":"In normal flight the three EDPs and automatic logic maintain pressure. The PTU transfers power, not fluid, between green and yellow when it senses a differential of about 500 psi, in either direction. On ground the PTU is inhibited during start sequences by specific logic.","a":"With green lost, the PTU recovers it from yellow and vice versa. A dual G+Y loss leaves blue with the RAT: degraded flight control configuration and alternate braking on the accumulator. Losing blue alone mainly costs the emergency generator and some spoilers. Dual failures are QRH surface-allocation exercises: memorize which surface lives on which system.","p":"Fire valves on green and yellow close with the fire pushbutton. Priority valves shed heavy consumers at low pressure. The system monitors quantity, temperature and pressure per reservoir with dedicated ECAM cautions."},"keys":"3,000 psi · RAT/azul ~2,500 psi · PTU Δ~500 psi (potencia, no fluido) · acumulador frenos ~7 aplicaciones sin antiskid"},{"sysId":"FCTL","num":3,"title":"FLIGHT CONTROLS — MANDOS DE VUELO","es":{"d":"Fly-by-wire con computadores dedicados: dos ELAC para elevador, estabilizador y alerones; tres SEC para spoilers y respaldo de cabeceo; dos FAC para timón, amortiguación de guiñada y velocidades características. Los side sticks generan órdenes de factor de carga y tasa de alabeo. El THS provee compensación automática. En el ceo, el timón y el trim del estabilizador conservan vía mecánica de respaldo.","n":"En ley normal el cabeceo comanda factor de carga con autotrim y el alabeo comanda tasa con estabilidad lateral. Protecciones activas: factor de carga, actitud de cabeceo 30 arriba y 15 abajo, alabeo máximo 67 grados, alfa prot, alfa floor y alfa max, y protección de alta velocidad. Los spoilers cumplen roll, speedbrake y ground spoilers.","a":"Fallas dobles de datos o computadores degradan a ley alternante: se conserva la protección de factor de carga y se pierden las demás, con estabilidades sustituidas por avisos. Con tren abajo la ley pasa a directa: stick a superficie, sin autotrim. La pérdida total eléctrica deja el respaldo mecánico: THS con la rueda de trim y timón, volando con MAN PITCH TRIM ONLY hasta recuperar computadores.","p":"Las protecciones de ley normal son el corazón del examen: alfa floor comanda TOGA por el FAC; la protección de alta velocidad introduce encabritado; en alabeo extremo el sistema regresa a 33 grados al soltar. En leyes degradadas, las velocidades características del FAC y la disciplina de piloto sustituyen a las protecciones duras."},"en":{"d":"Fly-by-wire with dedicated computers: two ELACs for elevator, stabilizer and ailerons; three SECs for spoilers and pitch standby; two FACs for rudder, yaw damping and characteristic speeds. Side sticks command load factor and roll rate. The THS provides autotrim. On the ceo, rudder and stabilizer trim retain a mechanical backup path.","n":"In normal law pitch commands load factor with autotrim and roll commands rate with lateral stability. Active protections: load factor, pitch attitude 30 up and 15 down, maximum bank 67 degrees, alpha prot, alpha floor and alpha max, and high speed protection. Spoilers serve roll, speedbrake and ground spoiler functions.","a":"Dual data or computer failures degrade to alternate law: load factor protection remains, the others are lost, with stabilities replaced by warnings. Gear down brings direct law: stick to surface, no autotrim. Total electrical loss leaves mechanical backup: THS via the trim wheel plus rudder, flying MAN PITCH TRIM ONLY until computers are restored.","p":"Normal-law protections are the heart of the oral: alpha floor commands TOGA through the FAC; high speed protection introduces nose-up; extreme bank returns to 33 degrees on release. In degraded laws, FAC characteristic speeds and pilot discipline replace the hard protections."},"keys":"Pitch 30°/-15° · bank 67°→33° · load factor +2.5/-1 limpio · alpha floor→TOGA · alternate: solo load factor · direct con tren"},{"sysId":"WHEEL","num":4,"title":"LANDING GEAR & BRAKES — TREN Y FRENOS","es":{"d":"Tren triciclo retráctil operado por el sistema verde y secuenciado por dos LGCIU que alternan cada ciclo y proveen la lógica aire-tierra a toda la aeronave. Frenos de carbono en las cuatro ruedas principales, gestionados por el BSCU de doble canal: frenado normal verde con antiskid y autobrake. Dirección de rueda de nariz por verde: 75 grados con tiller y 6 con pedales.","n":"Ciclo normal: puertas abren, tren viaja, puertas cierran; tres verdes confirman blocaje. Autobrake LO o MED para aterrizaje y MAX solo para despegue, con luz DECEL al lograr el 80 por ciento de la tasa. El antiskid compara velocidad de rueda contra referencia y corta por debajo de unos 20 nudos. Temperatura máxima de frenos para despegue: 300 grados.","a":"Sin verde, la extensión por gravedad requiere unas tres vueltas de manivela: aísla hidráulica, abre puertas y libera uplocks; las puertas quedan abiertas y la dirección de nariz se pierde, controlando con frenado diferencial. Frenado alternativo por amarillo con antiskid vía ABCU; con solo acumulador quedan unas siete aplicaciones sin antiskid. El freno de parqueo retiene presión unas 12 horas y anula los demás modos.","p":"Protección de touchdown impide presión con ruedas sin girar; los fuse plugs desinflan neumáticos sobrecalentados; el frenado automático de ruedas en retracción detiene la rotación antes de guardar. Pines de seguridad, tres, removidos y mostrados antes del vuelo."},"en":{"d":"Retractable tricycle gear operated by the green system and sequenced by two LGCIUs that alternate each cycle and provide air-ground logic to the whole aircraft. Carbon brakes on the four main wheels, managed by the dual-channel BSCU: normal green braking with anti-skid and autobrake. Nosewheel steering on green: 75 degrees with the tiller and 6 with pedals.","n":"Normal cycle: doors open, gear travels, doors close; three greens confirm downlock. Autobrake LO or MED for landing and MAX for takeoff only, with the DECEL light at 80 percent of the selected rate. Anti-skid compares wheel speed to reference and cuts out below about 20 knots. Maximum brake temperature for takeoff: 300 degrees.","a":"Without green, gravity extension takes about three crank turns: isolates hydraulics, opens doors and releases uplocks; doors remain open and nosewheel steering is lost, controlling with differential braking. Alternate braking on yellow keeps anti-skid via the ABCU; on accumulator only, about seven applications without anti-skid remain. The parking brake holds pressure about 12 hours and overrides other modes.","p":"Touchdown protection prevents pressure with wheels not spun up; fuse plugs deflate overheated tires; automatic wheel braking on retraction stops rotation before stowage. Three safety pins removed and shown before flight."},"keys":"NWS ±75°/±6° · frenos ≤300 °C TO · DECEL 80% · antiskid corta ~20 kt · gravedad 3 vueltas · acumulador ~7 aplic. · parking 12 h"},{"sysId":"FUEL","num":5,"title":"FUEL — COMBUSTIBLE","es":{"d":"Capacidad total aproximada de 18,700 a 19,000 kilos en tres tanques: dos de ala con celdas interior y exterior, y uno central. Seis bombas: dos centrales de mayor presión y dos por ala. Una única válvula de crossfeed une las líneas de alimentación. El APU toma de la línea izquierda con bomba propia automática. Sin capacidad de jettison.","n":"Alimentación tanque a motor con crossfeed cerrado. El centro se consume primero por su mayor presión de bombas, con las bombas centrales inhibidas cuando los slats están extendidos. Al bajar la celda interior a 750 kilos, las válvulas de transferencia pasan el combustible exterior a la interior en ambas alas. El retorno del IDG recircula combustible caliente a las celdas exteriores.","a":"Con bombas de un ala perdidas, la alimentación por gravedad sostiene el motor bajo un techo de altitud del QRH. Con bombas centrales perdidas, ese combustible queda estratégicamente inutilizable: replanificar alcance. Desbalance sobre el límite: abrir crossfeed y apagar bombas del lado liviano. Ante sospecha de fuga, la comparación F.USED más FOB contra el bloque decide: aislar por procedimiento y nunca alimentar una fuga con el crossfeed.","p":"Aviso LO LVL a 750 kilos por ala; límites de temperatura de menos 43 a más 54 grados; monitoreo FQI capacitivo con indicadores magnéticos de respaldo en tierra; válvula LP cerrada por master o fire pushbutton; venteo por tanques surge y tomas NACA."},"en":{"d":"Total capacity approximately 18,700 to 19,000 kilos in three tanks: two wing tanks with inner and outer cells, and a center tank. Six pumps: two center pumps at higher pressure and two per wing. A single crossfeed valve joins the feed lines. The APU draws from the left line with its own automatic pump. No jettison capability.","n":"Tank-to-engine feeding with crossfeed closed. Center burns first due to higher pump pressure, with center pumps inhibited while slats are extended. When an inner cell drops to 750 kilos, transfer valves move outer fuel inboard on both wings. IDG return recirculates warm fuel to the outer cells.","a":"With one wing's pumps lost, gravity feeding sustains the engine below a QRH altitude ceiling. With center pumps lost, that fuel becomes strategically unusable: replan range. Imbalance beyond the limit: open crossfeed and switch off pumps on the light side. On suspected leak, the F.USED plus FOB versus block comparison decides: isolate per procedure and never feed a leak through the crossfeed.","p":"LO LVL at 750 kilos per wing; temperature limits minus 43 to plus 54 degrees; capacitance FQI with magnetic indicators as ground backup; LP valve closed by master or fire pushbutton; venting through surge tanks and NACA intakes."},"keys":"~18.7-19 t total · 6 bombas · outer→inner 750 kg · LO LVL 750 kg · imbalance ~1.5 t · -43/+54 °C · sin jettison"},{"sysId":"ENG","num":6,"title":"POWERPLANT — MOTOR CFM56-5B","es":{"d":"Turbofán de doble eje y alto índice de derivación: N1 agrupa fan y baja presión, N2 el núcleo de alta que mueve la caja de accesorios con EDP, IDG y bomba de combustible. FADEC de doble canal con alternador dedicado, autoalimentado en rotación. Cuatro detentes: TOGA, FLX-MCT, CL e IDLE, más reversa.","n":"Arranque automático: el FADEC abre la válvula de arranque, introduce ignición y combustible entre 16 y 22 por ciento de N2, corta el starter hacia el 50 por ciento y estabiliza en ralentí, alternando igniters A y B. En vuelo, palancas en CL con autothrust gestionando hasta el límite de subida. Reversas de flujo frío con cuatro blocker doors, reduciendo a idle reverse hacia los 70 nudos.","a":"En tierra el FADEC aborta arranques calientes, colgados o con stall y puede ventilar; en vuelo la protección se reduce y la tripulación monitorea. Fallo de motor tras V1: continuar y gestionar en altura segura. Reencendido por molinete o asistido según el sobre del QRH. Fuego de tubo de escape: dry crank, sin agentes y sin fire pushbutton.","p":"Límites que protegen el motor: EGT de arranque 725 grados, TOGA 5 minutos o 10 con un motor, aceite mínimo 9.5 cuartos y 13 psi, temperatura 140 continua y 155 transitoria, ciclos de starter con enfriamientos. Vibraciones con umbrales advisory y monitoreo de márgenes EGT para tendencias."},"en":{"d":"Twin-spool high-bypass turbofan: N1 groups fan and low pressure, N2 the high-pressure core driving the accessory gearbox with EDP, IDG and fuel pump. Dual-channel FADEC with a dedicated alternator, self-powered once rotating. Four detents: TOGA, FLX-MCT, CL and IDLE, plus reverse.","n":"Automatic start: the FADEC opens the start valve, introduces ignition and fuel between 16 and 22 percent N2, cuts the starter around 50 percent and stabilizes at idle, alternating igniters A and B. In flight, levers in CL with autothrust managing up to the climb limit. Cold-stream reversers with four blocker doors, reducing to idle reverse by 70 knots.","a":"On ground the FADEC aborts hot, hung or stalled starts and can motor the engine; in flight protection reduces and the crew monitors. Engine failure after V1: continue and manage at a safe altitude. Relight by windmill or starter-assist per the QRH envelope. Tailpipe fire: dry crank, no agents and no fire pushbutton.","p":"Protective limits: start EGT 725 degrees, TOGA 5 minutes or 10 single-engine, oil minimum 9.5 quarts and 13 psi, temperature 140 continuous and 155 transient, starter duty cycles with cooling. Vibration advisories and EGT margin monitoring for trends."},"keys":"Fuel+ignición ~16-22% N2 · starter out ~50% · rev idle 70 kt · EGT start 725 °C · TOGA 5/10 min · aceite ≥9.5 qt / 13 psi / 140-155 °C"},{"sysId":"APU","num":7,"title":"APU","es":{"d":"Turbina de gas monoeje en el cono de cola, con caja de engranajes que mueve su generador de 90 kVA, bomba de aceite y starter eléctrico DC. Control de autoridad total por el ECB. Provee neumática y electricidad en tierra y respaldo en vuelo.","n":"Secuencia: MASTER SW ON abre el flap de admisión y energiza ECB y válvula de combustible; confirmado FLAP OPEN en ECAM, START pb: el starter acelera hasta el 60 por ciento de N, la ignición corta cerca de la velocidad de gobierno y AVAIL aparece al 95 por ciento. Bleed de unos 35 psi: dos packs hasta 15,000 pies, un pack hasta 20,000; electricidad hasta el techo certificado. Combustible de la línea izquierda con bomba propia automática.","a":"Arranque en vuelo con batería hasta unos 25,000 pies, mínimo 25.5 voltios; con generadores, envolvente superior. En EMER ELEC el arranque del APU es la recuperación primaria de la red. Apagado: enfriamiento de 60 a 120 segundos si hubo bleed en uso; inmediato si no.","p":"El ECB autoprotege por sobrevelocidad, EGT, presión de aceite y fallas detectadas. Fuego en tierra: apagado automático, descarga automática de la botella única y bocina en el pozo de rueda de nariz; en vuelo el drill es de tripulación. Prioridad de fuentes: EXT PWR sobre APU GEN; el bleed del APU sí tiene prioridad y cierra los bleeds de motor con válvula check de protección."},"en":{"d":"Single-shaft gas turbine in the tailcone, with a gearbox driving its 90 kVA generator, oil pump and DC electric starter. Full-authority control by the ECB. Provides pneumatics and electricity on ground and backup in flight.","n":"Sequence: MASTER SW ON opens the intake flap and powers the ECB and fuel valve; with FLAP OPEN confirmed on ECAM, START pb: the starter accelerates to 60 percent N, ignition cuts near governed speed and AVAIL appears at 95 percent. Bleed around 35 psi: two packs to 15,000 feet, one pack to 20,000; electrical power to the certified ceiling. Fuel from the left line with its own automatic pump.","a":"In-flight battery start to about 25,000 feet, minimum 25.5 volts; with generators, a higher envelope. In EMER ELEC the APU start is the primary network recovery. Shutdown: 60 to 120 second cooldown if bleed was in use; immediate if not.","p":"The ECB self-protects on overspeed, EGT, oil pressure and detected faults. Ground fire: automatic shutdown, automatic single-bottle discharge and horn in the nose wheel well; in flight the drill is crew-executed. Source priority: EXT PWR over APU GEN; APU bleed does have priority and closes engine bleeds with a protective check valve."},"keys":"Starter corta 60% N · AVAIL 95% · bleed ~35 psi · 2 packs/15,000 ft · 1 pack/20,000 ft · bat start ≤25,000 ft, ≥25.5 V · GEN 90 kVA · cooldown 60-120 s"},{"sysId":"BLEED","num":8,"title":"PNEUMATIC — SISTEMA NEUMÁTICO","es":{"d":"El aire sangrado se extrae de la etapa intermedia del compresor en potencia normal, y la válvula HP complementa a baja potencia. La válvula de bleed regula a unos 45 psi y el precooler, con aire de fan modulado por su válvula, controla la temperatura hacia unos 200 grados. Dos BMC monitorean el sistema y detectan fugas con loops sensores en ala, pylon y APU. Una válvula de crossbleed une ambos lados, con alimentación alternativa del APU o de un carro de alta presión.","n":"En vuelo cada motor alimenta su lado con el crossbleed en AUTO, que abre solo con el bleed del APU. El bleed del APU tiene prioridad: al abrirse cierra los bleeds de motor, con válvula check de protección. Usuarios: packs, antihielo de ala, arranque de motores, presurización de reservorios hidráulicos y de agua. En el arranque, los packs cierran automáticamente para entregar toda la presión al starter.","a":"Una fuga detectada aísla el lado afectado: el principio es no alimentar nunca una fuga, por eso el crossbleed permanece cerrado hacia el lado con leak, sacrificando usuarios de ese lado como el antihielo de ala. La pérdida doble de bleeds elimina la fuente de presurización: descenso y recuperación con el APU dentro de su envolvente, un pack hasta 20,000 pies. El arranque por crossbleed usa el motor operativo con presión suficiente.","p":"Protecciones de sobretemperatura y sobrepresión cierran válvulas automáticamente. Las válvulas neumáticas son operadas por aire y controladas eléctricamente, cerradas por resorte sin presión. El fire pushbutton cierra el bleed del motor afectado como parte del paquete de aislamiento."},"en":{"d":"Bleed air is extracted from the intermediate compressor stage at normal power, with the HP valve supplementing at low power. The bleed valve regulates to about 45 psi and the precooler, using fan air modulated by its valve, controls temperature toward 200 degrees. Two BMCs monitor the system and detect leaks with sensing loops along wing, pylon and APU. A crossbleed valve joins both sides, with alternative supply from the APU or a ground HP cart.","n":"In flight each engine feeds its side with the crossbleed in AUTO, which opens only with APU bleed. APU bleed has priority: when open it closes the engine bleeds, with a protective check valve. Users: packs, wing anti-ice, engine starting, hydraulic and water reservoir pressurization. During start, packs close automatically to give the starter full pressure.","a":"A detected leak isolates the affected side: the principle is never feed a leak, so the crossbleed stays closed toward the leaking side, sacrificing that side's users such as wing anti-ice. A dual bleed loss removes the pressurization source: descend and recover with the APU within its envelope, one pack up to 20,000 feet. Crossbleed start uses the running engine at sufficient pressure.","p":"Overtemperature and overpressure protections close valves automatically. Pneumatic valves are air-operated and electrically controlled, spring-closed without pressure. The fire pushbutton closes the affected engine bleed as part of the isolation package."},"keys":"PRV ~45 psi · precooler ~200 °C · 2 BMC · APU bleed prioridad, ~35 psi · dual bleed loss → APU 1 pack ≤20,000 ft · never feed a leak"},{"sysId":"COND","num":9,"title":"AIR CONDITIONING — AIRE ACONDICIONADO","es":{"d":"Dos packs en el carenado ventral producen aire acondicionado que se combina en la mixing unit con aire recirculado, cerca del 40 por ciento, filtrado por HEPA con dos ventiladores. Tres zonas, cabina de mando, cabina delantera y trasera, con aire caliente de trim para ajuste fino entre 18 y 30 grados, gestionadas por dos controladores. La presurización la gobiernan dos CPC alternándose cada vuelo, actuando la outflow valve con tres motores, dos automáticos y uno manual.","n":"El pack entrega la temperatura más fría demandada y el trim air calienta cada zona a su selección. El flujo se ajusta con LO, NORM o HI. La presurización sigue un programa automático: leve prepresurización en despegue, cabina máxima de 8,000 pies en crucero con diferencial máximo de 8.6 psi, y elevación de destino automática desde el FMGS.","a":"Con un pack perdido, el restante sostiene la presurización con consideraciones de flujo. Con ambos packs perdidos la cabina asciende: descenso, y el RAM AIR ventila directamente cuando el diferencial baja de aproximadamente 1 psi, porque su válvula check no abre contra presión. La falla de ambos CPC lleva al modo manual: controlar la outflow con el toggle vigilando altitud de cabina, tasa y diferencial, y en tierra abrirla completamente antes de puertas. El pushbutton de ditching sella válvulas bajo la línea de flotación.","p":"Aviso rojo de altitud de cabina excesiva a 9,550 pies. Válvulas de seguridad a 8.6 psi y alivio negativo para presión externa mayor. Protección de sobrecalentamiento de ductos cerrando el aire caliente, y ventilación de aviónica con reconfiguraciones blower y extract para humo."},"en":{"d":"Two packs in the belly fairing produce conditioned air blended in the mixing unit with recirculated air, around 40 percent, HEPA-filtered by two fans. Three zones, cockpit, forward and aft cabin, with hot trim air for fine adjustment between 18 and 30 degrees, managed by two controllers. Pressurization is governed by two CPCs alternating each flight, driving the outflow valve with three motors, two automatic and one manual.","n":"The pack delivers the coldest demanded temperature and trim air warms each zone to its selection. Flow adjusts with LO, NORM or HI. Pressurization follows an automatic schedule: slight pre-pressurization at takeoff, maximum 8,000 foot cabin in cruise with a maximum differential of 8.6 psi, and automatic landing elevation from the FMGS.","a":"With one pack lost, the remaining pack sustains pressurization with flow considerations. With both packs lost the cabin climbs: descend, and RAM AIR ventilates directly once differential drops near 1 psi, since its check valve will not open against pressure. Dual CPC failure brings manual mode: control the outflow with the toggle watching cabin altitude, rate and differential, and on ground open it fully before doors. The ditching pushbutton seals valves below the waterline.","p":"Red excessive cabin altitude warning at 9,550 feet. Safety valves at 8.6 psi and negative relief for higher external pressure. Duct overheat protection closing hot air, and avionics ventilation with blower and extract reconfigurations for smoke."},"keys":"ΔP máx 8.6 psi · cabina ≤8,000 ft · warning 9,550 ft · RAM AIR ΔP<1 psi · recirc ~40% HEPA · zonas 18-30 °C · 2 CPC alternando"},{"sysId":"FIRE","num":10,"title":"FIRE PROTECTION — PROTECCIÓN CONTRA FUEGO","es":{"d":"Detección de fuego de motor y APU por dos loops paralelos de elementos sensores de presión de gas con lógica Y: ambos deben detectar para generar la alarma. Cada motor dispone de dos botellas extintoras con squibs; el APU de una sola. Las bodegas de carga usan detectores de humo de doble canal y una botella con dos cabezales de descarga. Los lavatorios llevan detector y botella automática en el basurero, y la aviónica detecta humo en su aire de extracción.","n":"El test de fuego verifica continuidad de loops e indicaciones, luces, ECAM, squib y disch, sin disparar botellas. Un loop en falla deja detección por loop simple. La rotura simultánea de ambos loops se interpreta como fuego real.","a":"Con fuego de motor: el fire pushbutton aísla la zona cerrando combustible LP, válvula hidráulica de fuego y bleed, disparando el generador y armando los squibs; el agente uno se descarga tras la secuencia con espera definida antes del agente dos. El fuego del APU en tierra es automático: apagado, descarga y bocina en el pozo de nariz; en vuelo lo ejecuta la tripulación. Fuego de carga: descarga y aislamiento de ventilación para mantener concentración, con desvío inmediato. El tailpipe fire es distinto: ventilar con dry crank, sin agentes ni fire pushbutton.","p":"Todo evento de fuego de motor es LAND ASAP rojo. La descarga de carga es de un solo tiro: un segundo evento exige desvío inmediato. La protección humana combina máscaras al cien por ciento y PBE para combatir fuego."},"en":{"d":"Engine and APU fire detection uses two parallel loops of gas-pressure sensing elements with AND logic: both must sense to trigger the warning. Each engine has two extinguisher bottles with squibs; the APU has one. Cargo compartments use dual-channel smoke detectors and one bottle with two discharge heads. Lavatories carry a detector and an automatic waste-bin bottle, and avionics smoke is detected in the extract air.","n":"The fire test verifies loop continuity and indications, lights, ECAM, squib and disch, without firing bottles. A failed loop leaves single-loop detection. Simultaneous breakage of both loops is interpreted as a real fire.","a":"With an engine fire: the fire pushbutton isolates the zone closing LP fuel, the hydraulic fire valve and bleed, tripping the generator and arming squibs; agent one discharges after the sequence with a defined wait before agent two. APU fire on ground is automatic: shutdown, discharge and nose-well horn; in flight the crew executes. Cargo fire: discharge plus ventilation isolation to hold concentration, with immediate diversion. Tailpipe fire is different: ventilate with dry crank, no agents and no fire pushbutton.","p":"Any engine fire event is a red LAND ASAP. Cargo suppression is single-shot: a second event demands immediate diversion. Human protection combines 100 percent oxygen masks and PBE for firefighting."},"keys":"2 loops lógica Y · 2 botellas/motor · APU 1 botella (tierra auto + bocina) · carga: 1 botella 2 cabezales · tailpipe = dry crank sin agentes"},{"sysId":"ICE","num":11,"title":"ICE & RAIN PROTECTION — ANTIHIELO","es":{"d":"Condiciones de engelamiento: TAT de 10 grados o menos con humedad visible, o superficies contaminadas en tierra. El antihielo de motor calienta el labio de admisión con bleed propio, con válvula que falla abierta sin energía eléctrica. El antihielo de ala calienta los slats 3, 4 y 5 con una válvula por ala. Eléctricamente se calientan pitots, estáticas, AOA, TAT solo en vuelo, y parabrisas con regulación automática.","n":"El antihielo de motor activa además ignición continua y ajusta el ralentí. Probe y window heat operan automáticos en vuelo y forzados en tierra con el pushbutton. En tierra, el antihielo de ala solo admite una prueba de unos 30 segundos. Con antihielo activo se contabilizan penalizaciones de performance y mayor ralentí de aproximación.","a":"Una válvula de ala fallada crea asimetría gestionada por procedimiento. La pérdida de neumática de un lado elimina su antihielo de ala. En engelamiento severo la respuesta es salir de las condiciones con todo el antihielo activo. Fallas de calefacción de sondas enlazan directamente con velocidad no confiable.","p":"El deshielo en tierra sigue el concepto de aeronave limpia con fluidos tipo I a IV y tiempos de protección; runups periódicos desprenden hielo del fan. Límite de wipers 230 nudos. La definición de engelamiento delimita el uso en ambos sentidos: sin amenaza, el antihielo solo cuesta performance."},"en":{"d":"Icing conditions: TAT of 10 degrees or less with visible moisture, or contaminated surfaces on ground. Engine anti-ice heats the inlet lip with its own bleed, through a valve that fails open without electrical power. Wing anti-ice heats slats 3, 4 and 5 with one valve per wing. Electrical heating covers pitots, statics, AOA, TAT in flight only, and windshields with automatic regulation.","n":"Engine anti-ice also activates continuous ignition and adjusts idle. Probe and window heat run automatically in flight and forced on ground with the pushbutton. On ground, wing anti-ice allows only a 30 second test. With anti-ice active, performance penalties and a higher approach idle are accounted for.","a":"A failed wing valve creates asymmetry managed per procedure. Losing one side's pneumatics removes its wing anti-ice. In severe icing the response is exiting the conditions with all anti-ice on. Probe heat failures link directly to unreliable airspeed.","p":"Ground de-icing follows the clean aircraft concept with type I to IV fluids and holdover times; periodic runups shed fan ice. Wiper limit 230 knots. The icing definition bounds usage both ways: without threat, anti-ice only costs performance."},"keys":"TAT ≤10 °C + humedad visible · ENG A/I falla abierta + ignición continua · WAI slats 3-4-5, test tierra 30 s · wipers 230 kt · TAT no calentado en tierra"},{"sysId":"NAV","num":12,"title":"NAVIGATION — NAVEGACIÓN","es":{"d":"Tres ADIRU combinan cada una un ADR de datos de aire, velocidad, altitud, ángulo de ataque y temperatura, con un IR inercial de actitud, rumbo y posición. Dos MMR integran ILS y GPS; dos VOR, dos DME y ADF opcional completan la radionavegación. Dos radioaltímetros alimentan bajo 2,500 pies. La posición FM mezcla las inerciales con GPS o actualización por radioayudas, con lógica GPS PRIMARY comparando precisión estimada contra la requerida.","n":"Alineación en tierra de unos 10 minutos con posición ingresada y verificada por puertas de razonabilidad. IR uno al comandante, dos al copiloto, tres de reserva por el selector ATT HDG. El FMGC autosintoniza radioayudas, con página RAD NAV para manual. EGPWS con base de datos de terreno, modos clásicos y TERR en el ND; TCAS con tráfico en ND y resolución en la escala vertical.","a":"Perdida la navegación inercial, el modo ATT recupera actitud con rumbo manual. Fallas de ADR o IR se reconfiguran con los selectores de switching; las fallas dobles de ADR degradan las leyes de vuelo y activan el drill de velocidad no confiable. Con ambos FMGC perdidos: sintonía de respaldo por RMP y vuelo con datos crudos. GPS PRIMARY LOST impone chequeos de precisión y reportes según el espacio aéreo.","p":"Las puertas de alineación rechazan posiciones groseras; el monitoreo de posición compara cada fuente. La disciplina de datos crudos, identificación de ILS y gates de distancia contra altitud protege la aproximación incluso con automatización plena."},"en":{"d":"Three ADIRUs each combine an ADR for air data, speed, altitude, angle of attack and temperature, with an inertial IR for attitude, heading and position. Two MMRs integrate ILS and GPS; two VORs, two DMEs and optional ADF complete radio navigation. Two radio altimeters feed below 2,500 feet. FM position blends the inertials with GPS or radio updating, with GPS PRIMARY logic comparing estimated against required accuracy.","n":"Ground alignment takes about 10 minutes with position entered and checked by reasonableness gates. IR one to the captain, two to the first officer, three as spare through the ATT HDG selector. The FMGC autotunes navaids, with the RAD NAV page for manual. EGPWS with terrain database, classic modes and TERR on ND; TCAS with traffic on ND and resolution on the vertical speed scale.","a":"With inertial navigation lost, ATT mode recovers attitude with manual heading. ADR or IR failures reconfigure through the switching selectors; dual ADR failures degrade flight laws and trigger the unreliable airspeed drill. With both FMGCs lost: backup tuning via RMP and raw data flying. GPS PRIMARY LOST imposes accuracy checks and reporting per airspace.","p":"Alignment gates reject gross positions; position monitoring compares every source. Raw data discipline, ILS identification and distance-versus-altitude gates protect the approach even with full automation."},"keys":"3 ADIRU (ADR+IR) · alineación ~10 min · 2 MMR (ILS+GPS) · 2 RA · GPS PRIMARY (EPE vs RNP) · RMP backup tuning · IR3 spare"},{"sysId":"AFS","num":13,"title":"AUTO FLIGHT — FMGS / AUTOMATIZACIÓN","es":{"d":"El FMGS integra dos FMGC con sus dos MCDU para la gestión estratégica, el FCU en el glareshield para el mando táctico, y los FAC para envolvente. Dos autopilotos, directores de vuelo y autothrust. La filosofía del FCU: empujar entrega la guía al avión, gestionada en magenta; halar la toma el piloto, seleccionada en azul. El FMA en cinco columnas es la verdad de la automatización y se anuncia siempre.","n":"Despegue con SRS y RWY, NAV captura desde unos 30 pies; en altitud de reducción las palancas van a CL con LVR CLB destellando, y la aceleración transiciona SRS a CLB. Ascensos y descensos gestionados respetan restricciones, los modos open las ignoran. La aproximación arma APPR: LOC y G/S, LAND bajo 400 pies, FLARE y ROLL OUT en autoland con ambos autopilotos, capacidad CAT 3 DUAL. VAPP se calcula como VLS más corrección de viento con la lógica ground speed mini, que en ráfagas varía el IAS objetivo para conservar energía.","a":"Las reversiones de modo se anuncian con triple click y regresan a modos básicos seguros: la respuesta es leer el FMA y reconstruir. Las degradaciones de capacidad en aproximación se monitorean en su columna. Ante sorpresa de automatización, la regla de oro: bajar el nivel de automatización, volar el avión y reconstruir metódicamente.","p":"Protecciones de guía: reversiones que priorizan velocidad, alpha floor comandando TOGA vía FAC, y el autothrust protegiendo VAPP en ráfagas. La desconexión del autopiloto exige cancelación deliberada del cavalry charge, garantizando conciencia del vuelo manual."},"en":{"d":"The FMGS integrates two FMGCs with their two MCDUs for strategic management, the FCU on the glareshield for tactical command, and the FACs for envelope. Two autopilots, flight directors and autothrust. The FCU philosophy: pushing gives guidance to the aircraft, managed in magenta; pulling takes it, selected in blue. The five-column FMA is the truth of the automation and is always announced.","n":"Takeoff with SRS and RWY, NAV captures from about 30 feet; at reduction altitude levers go to CL with LVR CLB flashing, and acceleration transitions SRS to CLB. Managed climbs and descents respect constraints, open modes ignore them. Approach arms APPR: LOC and G/S, LAND below 400 feet, FLARE and ROLL OUT in autoland with both autopilots, CAT 3 DUAL capability. VAPP computes as VLS plus wind correction with ground speed mini logic, which in gusts varies target IAS to preserve energy.","a":"Mode reversions announce with a triple click and return to safe basic modes: the response is reading the FMA and rebuilding. Approach capability downgrades are monitored in their column. On automation surprise, the golden rule: reduce automation level, fly the aircraft and rebuild methodically.","p":"Guidance protections: reversions prioritizing speed, alpha floor commanding TOGA via the FAC, and autothrust protecting VAPP in gusts. Autopilot disconnection demands deliberate cancellation of the cavalry charge, guaranteeing awareness of manual flight."},"keys":"Push=managed / Pull=selected · FMA 5 columnas · NAV ~30 ft · LAND <400 ft · dual AP solo APPR · VAPP=VLS+GS mini (1/3 headwind, 5-15 kt) · triple click=reversión"},{"sysId":"GEN","num":14,"title":"AIRCRAFT GENERAL — ECAM / EIS","es":{"d":"El EIS presenta seis pantallas: PFD y ND por piloto, y el ECAM con E/WD arriba y SD abajo. Tres DMC generan las imágenes con el tercero de reserva conmutable. Dos FWC generan warnings, cautions, memos y llamadas de voz, alimentados por dos SDAC que concentran parámetros de sistemas. El ECP selecciona páginas del SD.","n":"El E/WD muestra parámetros primarios de motor, flaps y mensajes; el SD presenta la página del sistema pertinente por fase o por lógica de falla. Filosofía de alertas por niveles: nivel tres rojo con CRC para peligro inmediato, nivel dos ámbar con single chime para anormalidades, nivel uno sin llamada. La secuencia ECAM: leer, ejecutar acciones en pantalla, confirmar antes de acciones irreversibles, y cerrar con la página de estado.","a":"Fallas de DMC reconfiguran pantallas automática o manualmente con los selectores de switching. Un FWC o un SDAC perdido reduce redundancia con avisos; la pérdida doble de FWC elimina alertas centralizadas: vigilancia por parámetros y papel. Con una pantalla perdida, la prioridad de presentación reorganiza la información restante.","p":"Los inhibits de fase de vuelo, despegue y aterrizaje, silencian avisos no críticos en fases críticas. Las acciones irreversibles, fuego, IDG, se confirman entre ambos pilotos. La página STATUS resume la condición operacional de la aeronave tras la falla: es la síntesis final de todo procedimiento ECAM."},"en":{"d":"The EIS presents six displays: PFD and ND per pilot, and the ECAM with E/WD above and SD below. Three DMCs generate imagery with the third as switchable spare. Two FWCs generate warnings, cautions, memos and voice callouts, fed by two SDACs concentrating system parameters. The ECP selects SD pages.","n":"The E/WD shows primary engine parameters, flaps and messages; the SD presents the relevant system page by phase or failure logic. Alert philosophy by levels: level three red with CRC for immediate danger, level two amber with single chime for abnormalities, level one without callout. The ECAM sequence: read, execute on-screen actions, confirm before irreversible actions, and close with the status page.","a":"DMC failures reconfigure displays automatically or manually with the switching selectors. A lost FWC or SDAC reduces redundancy with cautions; dual FWC loss removes centralized alerting: monitor by parameters and paper. With one display lost, presentation priority reorganizes the remaining information.","p":"Flight phase inhibits, takeoff and landing, silence non-critical alerts in critical phases. Irreversible actions, fire, IDG, are cross-confirmed between both pilots. The STATUS page summarizes the aircraft's operational condition after the failure: the final synthesis of every ECAM procedure."},"keys":"6 DUs · 3 DMC (3=spare) · 2 FWC + 2 SDAC · Nivel 3 rojo/CRC · Nivel 2 ámbar/chime · T.O./LDG inhibits · STATUS cierra el ECAM"},{"sysId":"COM","num":15,"title":"COMMUNICATIONS — COMUNICACIONES","es":{"d":"Tres RMP gestionan frecuencias: dos en el pedestal y uno en el techo, y cualquiera puede sintonizar cualquier radio VHF o HF. Los ACP de cada puesto manejan el audio: selección de transmisión, recepción y volúmenes. VHF 3 se reserva normalmente para el datalink ACARS del ATSU. SELCAL avisa con luz y campana cuando una estación llama el código del avión. El interfono conecta cabina de mando, cabina de pasajeros y mecánico de tierra, con bocina de llamada en el pozo de nariz, y el PA da prioridad absoluta a la cabina de mando vía CIDS.","n":"Cada piloto sintoniza en su RMP con transferencia activo standby; la luz SEL indica que otra RMP sintoniza una radio ajena. La transmisión usa el PTT del sidestick o la tecla INT RAD del ACP. Al ponerse la máscara de oxígeno, el micrófono conmuta automáticamente. Las llamadas a cabina se hacen desde el panel CALLS con timbres por estación y llamada de emergencia.","a":"Con una RMP fallada, las restantes sintonizan todas las radios. Con un ACP perdido, el selector de audio switching entrega el ACP del tercer ocupante al piloto afectado. Con ambos FMGC caídos, las RMP sintonizan radioayudas en modo NAV backup bajo la tapa. Ante falla total de comunicaciones: procedimiento OACI, transponder 7600 e intentos en todas las frecuencias.","p":"Guardia de 121.5 según SOP de la compañía. El CVR graba todos los canales de cabina más el micrófono de área. El filtro de voz elimina la identificación morse solo después de verificar la radioayuda."},"en":{"d":"Three RMPs manage frequencies: two on the pedestal and one overhead, and any of them can tune any VHF or HF radio. Each station's ACP handles audio: transmission selection, reception and volumes. VHF 3 is normally reserved for the ATSU's ACARS datalink. SELCAL alerts with light and chime when a station calls the aircraft code. The interphone connects cockpit, cabin and ground mechanic, with a call horn in the nose gear bay, and the PA gives absolute priority to the cockpit via CIDS.","n":"Each pilot tunes on his RMP with active-standby transfer; the SEL light indicates another RMP is tuning an offside radio. Transmission uses the sidestick PTT or the ACP INT RAD key. Donning the oxygen mask switches the microphone automatically. Cabin calls go through the CALLS panel with per-station chimes and an emergency call.","a":"With one RMP failed, the remaining ones tune all radios. With an ACP lost, the audio switching selector gives the third occupant's ACP to the affected pilot. With both FMGCs down, the RMPs tune navaids in NAV backup mode under the cover. On total communications failure: ICAO procedure, transponder 7600 and attempts on all frequencies.","p":"121.5 guard per company SOP. The CVR records all cockpit channels plus the area microphone. The voice filter removes the morse ident only after the navaid has been verified."},"keys":"3 RMP (cualquiera→cualquier radio) · VHF3=ACARS · SELCAL · bocina MECH pozo de nariz · PA prioridad cockpit · AUDIO SWITCHING = ACP 3 · 7600"},{"sysId":"OXY","num":16,"title":"OXYGEN — OXÍGENO","es":{"d":"Sistema de tripulación gaseoso: cilindro de alta presión bajo el puesto de mando alimentando máscaras de colocación rápida con regulador de dilución en N, cien por ciento y emergencia con sobrepresión. Los pasajeros usan generadores químicos por bloque de asientos con una autonomía de referencia de unos 13 minutos, de un solo uso. Complementan botellas portátiles de primeros auxilios y los PBE para combatir fuego.","n":"El pushbutton CREW SUPPLY abre la alimentación. En la preparación, prueba de máscara con press to test verificando flujo y blinker, y presión del cilindro en la página DOOR OXY, con mínimo de despacho según la tabla del FCOM por número de tripulantes y temperatura.","a":"A 14,000 pies de altitud de cabina las máscaras de pasajeros caen automáticamente; el respaldo manual es MASK MAN ON. Con humo o vapores: máscara al cien por ciento o emergencia para sobrepresión y protección. Los generadores químicos se calientan al activarse y no se detienen: son de un solo tiro. La remoción de máscaras tras un descenso de emergencia sigue criterios de altitud de cabina del QRH.","p":"Prohibido fumar o llama abierta con oxígeno en uso: el oxígeno intensifica cualquier combustión. La presión mínima de despacho protege la autonomía requerida. Los PBE dan protección completa de humo para combatir fuego."},"en":{"d":"Gaseous crew system: high-pressure cylinder below the flight deck feeding quick-donning masks with a regulator offering N dilution, 100 percent and emergency overpressure. Passengers use chemical generators per seat block with a reference duration around 13 minutes, single-use. First-aid portable bottles and PBEs for firefighting complete the system.","n":"The CREW SUPPLY pushbutton opens the supply. During preparation, mask press-to-test verifying flow and blinker, and cylinder pressure on the DOOR OXY page, with dispatch minimum per the FCOM table by crew number and temperature.","a":"At 14,000 feet cabin altitude passenger masks drop automatically; the manual backup is MASK MAN ON. With smoke or fumes: mask at 100 percent or emergency for overpressure and protection. Chemical generators run hot once fired and cannot be stopped: single-shot. Mask removal after an emergency descent follows QRH cabin altitude criteria.","p":"No smoking or open flame with oxygen in use: oxygen intensifies any combustion. The minimum dispatch pressure protects required endurance. PBEs give full smoke protection for firefighting."},"keys":"Crew: cilindro gaseoso, máscara N/100%/EMER · Pax: generadores químicos ~13 min, un solo uso · caída auto 14,000 ft cabina · mínimo despacho por tabla FCOM"},{"sysId":null,"num":17,"title":"INSTRUMENTS — INSTRUMENTOS / EIS","es":{"d":"El EIS presenta seis pantallas intercambiables: PFD y ND por piloto más los dos ECAM. El PFD integra cinta de velocidad con velocidades características, horizonte, altitud, velocidad vertical, rumbo y el FMA arriba. Tres DMC generan las imágenes, con el tercero de reserva. El ISIS es el standby integrado: actitud, velocidad y altitud con toma pitot estática propia y alimentación de batería, totalmente independiente.","n":"Disciplina de FMA: todo cambio se anuncia. La cinta de velocidad muestra VLS, green dot, velocidades S y F, y las bandas de protección; ámbar y rojo delimitan márgenes. Ajuste barométrico QNH o estándar con crosscheck de ambos pilotos. Los selectores de brillo y transferencia PFD ND completan la gestión.","a":"Una pantalla perdida reconfigura automáticamente con prioridad al PFD; el DMC 3 sustituye por el selector EIS del switching. Fallas de ADR o IR se resuelven con AIR DATA y ATT HDG a la fuente tres, verificando qué pantalla recibe qué fuente. Con velocidad no confiable, la comparación cruzada incluye el ISIS y la altitud GPS. El ISIS es la referencia final si todo lo demás cae.","p":"Monitores de comparación entre lados generan avisos CHECK ATT y CHECK ALT ante discrepancias. Las banderas rojas y ámbar señalan datos inválidos. La independencia física del ISIS es la protección estructural del conjunto."},"en":{"d":"The EIS presents six interchangeable displays: PFD and ND per pilot plus the two ECAM units. The PFD integrates the speed tape with characteristic speeds, attitude, altitude, vertical speed, heading and the FMA on top. Three DMCs generate imagery, the third as spare. The ISIS is the integrated standby: attitude, speed and altitude with its own pitot-static source and battery supply, fully independent.","n":"FMA discipline: every change is announced. The speed tape shows VLS, green dot, S and F speeds, and the protection bands; amber and red bound the margins. Barometric setting QNH or standard with both-pilot crosscheck. Brightness and PFD ND transfer selectors complete the management.","a":"A lost display reconfigures automatically with PFD priority; DMC 3 substitutes through the EIS switching selector. ADR or IR failures are solved with AIR DATA and ATT HDG to source three, verifying which display receives which source. With unreliable airspeed, the crosscheck includes the ISIS and GPS altitude. The ISIS is the final reference if everything else fails.","p":"Side-to-side comparison monitors raise CHECK ATT and CHECK ALT on discrepancies. Red and amber flags mark invalid data. The physical independence of the ISIS is the set's structural protection."},"keys":"6 DUs · 3 DMC (3=spare, selector EIS) · ISIS independiente (pitot-estática propia + batería) · CHECK ATT/ALT · cinta: VLS, green dot, S, F"},{"sysId":null,"num":18,"title":"PRESSURIZATION — PRESURIZACIÓN","es":{"d":"Dos controladores CPC gobiernan la presurización alternándose cada vuelo, comandando la outflow valve accionada por tres motores: dos automáticos y uno manual. Dos válvulas de seguridad alivian a 8.6 psi de diferencial y una protección negativa admite aire si la presión externa supera la de cabina. El programa automático toma la elevación de destino del FMGS.","n":"En despegue el sistema prepresuriza levemente para evitar el salto en rotación. En crucero mantiene la cabina como máximo en 8,000 pies con el diferencial limitado a 8.6 psi, con tasas de confort de unos más 500 en ascenso y menos 300 en descenso. En aproximación programa la cabina a la elevación de destino, automática o seleccionada con la perilla LDG ELEV.","a":"La falla de un CPC transfiere automáticamente al otro. Con ambos perdidos: modo manual, controlando la outflow con el interruptor y gestionando la velocidad vertical de cabina a mano, vigilando altitud, tasa y diferencial; tras aterrizar, abrir completamente la válvula antes de abrir puertas. Altitud de cabina excesiva a 9,550 pies dispara la advertencia roja: descenso de emergencia de memoria. El RAM AIR ventila solo con diferencial bajo 1 psi.","p":"Válvulas de seguridad a 8.6, alivio negativo, advertencia roja a 9,550 pies, caída automática de máscaras a 14,000 de cabina, y el pushbutton de ditching que sella las válvulas bajo la línea de flotación."},"en":{"d":"Two CPC controllers govern pressurization alternating each flight, commanding the outflow valve driven by three motors: two automatic and one manual. Two safety valves relieve at 8.6 psi differential and a negative relief admits air if outside pressure exceeds cabin pressure. The automatic schedule takes destination elevation from the FMGS.","n":"At takeoff the system slightly pre-pressurizes to avoid the bump at rotation. In cruise it holds the cabin at 8,000 feet maximum with differential limited to 8.6 psi, at comfort rates around plus 500 climbing and minus 300 descending. On approach it schedules the cabin to destination elevation, automatic or selected with the LDG ELEV knob.","a":"A single CPC failure transfers automatically to the other. With both lost: manual mode, driving the outflow with the toggle and managing cabin vertical speed by hand, watching altitude, rate and differential; after landing, open the valve fully before opening doors. Excessive cabin altitude at 9,550 feet triggers the red warning: memory emergency descent. RAM AIR ventilates only below 1 psi differential.","p":"Safety valves at 8.6, negative relief, red warning at 9,550 feet, automatic mask drop at 14,000 cabin, and the ditching pushbutton sealing valves below the waterline."},"keys":"2 CPC alternando · outflow 3 motores · ΔP máx 8.6 psi · cabina ≤8,000 ft · +500/-300 fpm · warning 9,550 ft · máscaras 14,000 ft · MAN: abrir outflow en tierra"}];

const KEY="a320t2-state";
function loadState(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):{failed:[],stats:{},answered:{},tests:[]};}catch(e){return{failed:[],stats:{},answered:{},tests:[]};}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
let state=loadState();
if(!state.answered)state.answered={};if(!state.tests)state.tests=[];

/* ===== access control (client-side gate — distribution build) ===== */
const USERS={"CAPTAIN":{p:"A320-CMD-2026",days:0},"GUEST":{p:"A320-7Q4X-30D",days:30}};

/* ===== access code system (self-service, admin generated) ===== */
const CSALT="A320-NIETO-2026-KEY";
function cHash(str){let h=5381;for(let i=0;i<str.length;i++){h=((h*33)^str.charCodeAt(i))>>>0;}return h.toString(36).toUpperCase().slice(-4).padStart(4,"X");}
function today(){return Math.floor(Date.now()/86400000);}
function rnd3(){const A="0123456789ABCDEFGHJKLMNPQRSTUVWXYZ";let s="";for(let i=0;i<3;i++)s+=A.charAt(Math.floor(Math.random()*A.length));return s;}
function makeCode(days){const exp=today()+days;const p=exp.toString(36).toUpperCase();const n=rnd3();return "A320-"+p+"-"+n+"-"+cHash(p+n+CSALT);}
function readCode(code){
 const c=String(code||"").trim().toUpperCase().replace(/\s/g,"");
 let exp=null;
 const m4=c.match(/^A320-([0-9A-Z]+)-([0-9A-Z]{3})-([0-9A-Z]{4})$/);
 if(m4){ if(cHash(m4[1]+m4[2]+CSALT)!==m4[3])return null; exp=parseInt(m4[1],36); }
 else{
  const m3=c.match(/^A320-([0-9A-Z]+)-([0-9A-Z]{4})$/);
  if(!m3)return null;
  if(cHash(m3[1]+CSALT)!==m3[2])return null;
  exp=parseInt(m3[1],36);
 }
 if(!exp||isNaN(exp))return null;
 return {exp:exp,left:exp-today()};
}
const AKEY="a320t2-auth";
function authInfo(){try{return JSON.parse(localStorage.getItem(AKEY))}catch(e){return null}}
function authOK(){const a=authInfo();if(!a)return false;
 if(a.code){const r=readCode(a.code);return !!r&&r.left>=0;}
 const u=USERS[a.u];if(!u)return false;return u.days===0||(Date.now()-a.ts)<u.days*86400000;}
function daysLeft(){const a=authInfo();if(!a)return 0;
 if(a.code){const r=readCode(a.code);return r?Math.max(0,r.left):0;}
 const u=USERS[a.u];if(!u)return 0;return u.days===0?9999:Math.max(0,Math.ceil((u.days*86400000-(Date.now()-a.ts))/86400000));}
function login(user,pass){const k=String(user||"").trim().toUpperCase();
 const rc=readCode(pass);
 if(rc){if(rc.left<0)return "expired";try{localStorage.setItem(AKEY,JSON.stringify({u:k||"GUEST",ts:Date.now(),code:String(pass).trim().toUpperCase()}))}catch(e){}return "ok";}
 const u=USERS[k];if(!u||pass!==u.p)return "bad";const prev=authInfo();const ts=(prev&&prev.u===k)?prev.ts:Date.now();if(u.days>0&&(Date.now()-ts)>=u.days*86400000)return "expired";try{localStorage.setItem(AKEY,JSON.stringify({u:k,ts:ts}))}catch(e){}return "ok";}
function logout(){try{localStorage.removeItem(AKEY)}catch(e){}view="dash";render();}
function isAdmin(){const a=authInfo();if(!a||a.code)return false;const u=USERS[a.u];return !!u&&u.days===0;}
const scriptFor=id=>(typeof SCRIPTS!=="undefined")?(SCRIPTS.find(s=>s.sysId===id)||null):null;

function startQuiz(qs,title,from,type,sysC,dv){queue=prepQuiz(qs);idx=0;picked=null;answers=[];
 activeTest={id:Date.now(),type:type||"PRACTICE",title:title,sys:sysC||"ALL",diff:dv||0,len:queue.length,uids:queue.map(q=>q.uid),created:Date.now(),taken:null,elapsed:0,t0:Date.now(),status:"IN PROGRESS",score:null,idx:0,answers:[]};persistActive();
 meta={title:title,from:from};view="quiz";render();}
function goto(v){view=v;render();}

function answer(i){
  if(picked!==null)return;
  const q=queue[idx],ok=i===q.correct;
  picked=i;answers.push({uid:q.uid,ok:ok});
  if(ok)removeFailed(q.uid);else addFailed(q.uid);
  state.answered[q.uid]=true;saveState();
  render();
}
function next(){
  if(idx+1<queue.length){idx++;picked=null;render();}
  else{const good=answers.filter(a=>a.ok).length;const pct=Math.round(good/answers.length*100);recordScore(meta.title,pct);
   if(activeTest){activeTest.elapsed=(activeTest.elapsed||0)+Math.round((Date.now()-activeTest.t0)/1000);activeTest.status="COMPLETED";activeTest.score=pct;activeTest.taken=Date.now();activeTest.idx=answers.length;activeTest.answers=answers.slice();persistActive();activeTest=null;}
   view="result";render();}
}

function renderQuiz(){
  renderHeader(meta.title);
  const q=queue[idx],done=picked!==null,ok=done&&picked===q.correct;
  const good=answers.filter(a=>a.ok).length,badN=answers.length-good;
  let opts="";
  q.opts.forEach((opt,i)=>{
    let b="var(--line)",c="var(--white)",bg="var(--panel2)";
    if(done){if(i===q.correct){b="var(--green)";c="var(--green)";bg="rgba(47,208,107,0.08)";}
      else if(i===picked){b="var(--red)";c="var(--red)";bg="rgba(239,83,80,0.08)";}
      else c="var(--dim)";}
    opts+='<button class="opt" data-i="'+i+'" '+(done?"disabled":"")+' style="border-color:'+b+';color:'+c+';background:'+bg+'">'+esc(opt)+'</button>';
  });
  app.innerHTML='<div class="spread"><button class="btn gray" id="abort">❚❚ PAUSE</button>'
    +'<span class="mono" style="font-size:12px;color:var(--dim)">'+(idx+1)+' / '+queue.length+' · <span style="color:var(--green)">✓ '+good+'</span> · <span style="color:var(--red)">✗ '+badN+'</span></span></div>'
    +'<div class="progress"><div style="width:'+((idx+(done?1:0))/queue.length*100)+'%"></div></div>'
    +'<div class="card"><div class="row" style="margin-bottom:10px">'+badge(sysEcp(q.sys),"var(--cyan)")+diffBadge(q.d)+'</div>'
    +'<div class="qtext">'+esc(q.q)+'</div>'+opts
    +(done?'<div class="expl" style="color:inherit"><span class="mono" style="font-size:12px;font-weight:700;color:'+(ok?"var(--green)":"var(--red)")+'">'+(ok?"CORRECT — ":"INCORRECT — ")+'</span><span style="color:var(--cyan)">'+esc(q.e)+'</span>'+(!ok?'<div class="mono" style="font-size:11px;color:var(--amber);margin-top:6px">ADDED TO FAILED QUESTIONS BANK</div>':'')+'</div>':'')
    +'</div>'
    +(done?'<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="solid cyan" id="nx">'+(idx+1<queue.length?"NEXT ▸":"RESULTS ▸")+'</button></div>':'')
    +FOOTER;
  document.getElementById("abort").onclick=()=>{pauseActive();goto("tests");};
  if(!done)document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const nx=document.getElementById("nx");if(nx)nx.onclick=next;
}

function normTx(s){return (" "+String(s).toLowerCase().replace(/,/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")+" ");}
function evalSim(txt,num,lg){
 const t=normTx(txt);const ks=EXAM_KEYS[num]||[];const hit=[],miss=[];const li=(lg==="ES")?1:0;
 ks.forEach(c=>{(c.slice(2).some(k=>t.indexOf(k)>=0)?hit:miss).push(c[li]);});
 const cov=ks.length?hit.length/ks.length:0;
 let s=cov*80;
 const words=String(txt).trim()?String(txt).trim().split(/\s+/).length:0;
 s+=words>=120?10:words>=60?5:0;
 [["describ","consist","compris","architect","arquitect","compone","consta"],
  ["normal","operation","operacion"],
  ["fail","loss","emergen","alternat","abnormal","falla","fallo","perdida","emergencia","anormal"],
  ["protect","warning","limit","proteccion","protecciones","aviso","advertencia","limite","limites"]].forEach(g=>{if(g.some(k=>t.indexOf(k)>=0))s+=2.5;});
 return {score:Math.min(100,Math.round(s)),hit:hit,miss:miss,words:words,cov:Math.round(cov*100)};
}

const W=(typeof window!=="undefined")?window:{};
const SRClass=W.SpeechRecognition||W.webkitSpeechRecognition||null;
function stopRec(){if(simRec){try{simRec.onend=null;simRec.stop();}catch(e){}simRec=null;}}
function startRec(){
 if(!SRClass)return;
 const r=new SRClass();simRec=r;
 r.lang=(simLang==="ES")?"es-MX":"en-US";r.continuous=true;r.interimResults=true;
 r.onresult=e=>{let fin="",inter="";
  for(let i=0;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)fin+=res[0].transcript+" ";else inter+=res[0].transcript;}
  simTx=(simBase+" "+fin).trim();
  const ta=document.getElementById("ta");if(ta){ta.value=simTx+(inter?" "+inter:"");}
 };
 r.onerror=e=>{const st=document.getElementById("recst");if(st)st.textContent="MIC ERROR: "+(e.error||"unknown")+" — you can type instead";};
 r.onend=()=>{if(simRec===r){try{r.start();}catch(e){}}};
 try{r.start();}catch(e){}
}

  +(r.hit.length?'<div class="card" style="margin-top:12px"><div class="mono" style="font-size:12px;color:var(--green);font-weight:700;margin-bottom:8px">COVERED ('+r.hit.length+')</div>'+chips+'</div>':'')
  +(r.miss.length?'<div class="card" style="margin-top:12px"><div class="mono" style="font-size:12px;color:var(--amber);font-weight:700;margin-bottom:8px">EXAMINER FOLLOW-UPS ('+r.miss.length+')</div>'+fu+'</div>':'')
  +'<div class="row" style="margin-top:14px"><button class="btn" id="again">TRY AGAIN ▸</button><button class="btn green" id="vs">VIEW SCRIPT ▸</button><button class="solid gray" id="menu">◂ EXAM MENU</button></div>'+FOOTER+navHTML("sim");
  document.getElementById("again").onclick=()=>{simPhase="ask";simTx="";simBase="";simRes=null;render();};
  document.getElementById("vs").onclick=()=>{curScript=simScript;lang=simLang;meta={title:"",from:"scripts"};view="script";render();};

 }
 bindNav();
}
function submitSim(){
 stopRec();
 const ta=document.getElementById("ta");if(ta)simTx=ta.value;
 simRes=evalSim(simTx,simScript.num,simLang);
 const k="SIM "+simScript.num;const p=state.stats[k]||{attempts:0,best:0};

/* ===== dashboard / tests / question bank ===== */
function fmtT(sec){sec=Math.max(0,Math.round(sec||0));const m=Math.floor(sec/60),s=sec%60;return m+":"+(s<10?"0":"")+s;}
function fmtD(ts){if(!ts)return "—";const d=new Date(ts);return d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function persistActive(){if(!activeTest)return;const rec=Object.assign({},activeTest);delete rec.t0;const i=state.tests.findIndex(t=>t.id===rec.id);if(i>=0)state.tests[i]=rec;else state.tests.push(rec);saveState();}
function pauseActive(){if(!activeTest)return;activeTest.elapsed=(activeTest.elapsed||0)+Math.round((Date.now()-activeTest.t0)/1000);activeTest.idx=answers.length;activeTest.answers=answers.slice();activeTest.status="IN PROGRESS";persistActive();activeTest=null;}
function resumeTest(id){const t=(state.tests||[]).find(x=>x.id===id);if(!t)return;
 queue=t.uids.map(u=>byId[u]).filter(Boolean).map(q=>{const order=shuffle([0,1,2,3]);return Object.assign({},q,{opts:order.map(i=>q.o[i]),correct:order.indexOf(q.a)});});
 answers=(t.answers||[]).slice();idx=Math.min(answers.length,queue.length-1);picked=null;
 activeTest=Object.assign({},t,{t0:Date.now(),status:"IN PROGRESS"});
 meta={title:t.title,from:"tests"};view="quiz";render();}
function donut(pct,size){const r=42,c=2*Math.PI*r;const g=Math.max(0,Math.min(100,pct));
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="rgba(239,83,80,.7)" stroke-width="10"/><circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--green)" stroke-width="10" stroke-dasharray="'+(g*c/100).toFixed(1)+' '+c.toFixed(1)+'" stroke-linecap="round" transform="rotate(-90 50 50)"/><text x="50" y="47" text-anchor="middle" fill="#e8edf4" font-size="17" font-weight="700" font-family="IBM Plex Mono,monospace">'+g+'%</text><text x="50" y="63" text-anchor="middle" fill="#5b6575" font-size="8.5" font-family="IBM Plex Mono,monospace">ANSWERED</text></svg>';}

  cov+='<div class="covrow"><span class="mono" style="width:86px;color:var(--cyan);font-size:11.5px;flex:0 0 auto">'+esc(s.ecp)+'</span><div class="covbar"><div style="width:'+p+'%"></div></div><span class="mono" style="font-size:11px;color:var(--gray);width:96px;text-align:right;flex:0 0 auto">'+a+'/'+bank.length+' · '+p+'%</span></div>';});
 app.innerHTML='<div class="mono" style="font-size:12px;color:var(--gray);margin-bottom:10px">QUICK ACTIONS</div>'
 +'<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(155px,1fr))">'
 +'<button class="syscard qa" id="qaP"><div class="ecp">PRACTICE TEST</div><div class="nm">By system &amp; difficulty</div></button>'

 +'<div class="row" style="margin-top:16px;align-items:stretch">'
 +'<div class="card tile"><div class="tno">'+tests.length+'</div><div class="tlb">TESTS TAKEN</div><div class="tsb">'+comp.length+' COMPLETED · '+(tests.length-comp.length)+' IN PROGRESS</div></div>'
 +'<div class="card tile"><div class="tno" style="color:var(--green)">'+hi+'</div><div class="tlb">HIGH SCORES ≥75%</div><div class="tsb">'+exams.length+' EXAM TEST(S) · '+(exams.length?Math.round(exHi/exams.length*100):0)+'% PASS</div></div>'
 +'<div class="card tile"><div class="tno" style="color:var(--cyan)">'+ansN+'</div><div class="tlb">QUESTIONS ANSWERED</div><div class="tsb">OF '+tot+' AVAILABLE · '+pct+'%</div></div></div>'
 +'<div class="row" style="margin-top:12px;align-items:stretch">'
 +'<div class="card" style="flex:1 1 280px;display:flex;gap:16px;align-items:center">'+donut(pct,124)
 +'<div><div class="mono" style="font-size:13px;font-weight:700">QUESTION PROGRESS</div>'
 +'<div class="mono" style="font-size:12px;color:var(--green);margin-top:8px">ANSWERED '+ansN+' · '+pct+'%</div>'

 +'<div class="mono" style="font-size:11px;color:var(--dim);margin-top:8px">QUESTION BANK: '+tot+' TOTAL AVAILABLE</div></div></div>'
 +'<div class="card" style="flex:2 1 360px"><div class="mono" style="font-size:13px;font-weight:700;margin-bottom:10px">CATEGORY COVERAGE — ANSWERED BY CATEGORY</div>'+cov+'</div></div>'
 +FOOTER+navHTML("dash");
 document.getElementById("qaP").onclick=()=>goto("home");
 document.getElementById("qaE").onclick=()=>startQuiz(shuffle(ALL).slice(0,examLen),"GENERAL EXAM "+examLen,"dash","EXAM","ALL",0);
 document.getElementById("qaR").onclick=()=>goto("failedMenu");
 document.getElementById("qaS").onclick=()=>goto("q");
 const qaA=document.getElementById("qaA");if(qaA)qaA.onclick=()=>goto("admin");
 bindNav();}

  +'<div class="mono" style="font-size:10.5px;color:var(--dim);margin-top:3px">CREATED '+fmtD(t.created)+(t.taken?' · TAKEN '+fmtD(t.taken):'')+'</div>'
  +'<div class="row" style="margin-top:8px">'+(t.status!=="COMPLETED"?'<button class="btn green tres" data-id="'+t.id+'" style="padding:5px 10px;font-size:11px">RESUME ▸</button>':'')

 +'<div class="mono" style="font-size:12px;color:var(--gray);margin-bottom:8px">'+ts.length+' TEST(S)</div>'
 +(rows||'<div class="card" style="color:var(--dim);font-size:13px">No tests match the filters. Start one above.</div>')
 +FOOTER+navHTML("tests");
 document.querySelectorAll(".tchip").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;if(k==="t")tfType=v;else if(k==="s")tfSt=v;else tfDiff=+v;render();});
 document.querySelectorAll(".tres").forEach(b=>b.onclick=()=>resumeTest(+b.dataset.id));
 document.querySelectorAll(".tdel").forEach(b=>b.onclick=()=>{state.tests=state.tests.filter(t=>t.id!==+b.dataset.id);saveState();render();});
 document.getElementById("nP").onclick=()=>goto("home");

let qTxt="",qCat="ALL",qDiffF=0,qOpen=null,qPage=0,qPer=25;
function qFiltered(){
 let qs=ALL;
 if(qCat!=="ALL")qs=qs.filter(q=>q.sys===qCat);
 if(qDiffF)qs=qs.filter(q=>q.d===qDiffF);
 const t=qTxt.trim().toLowerCase();
 if(t)qs=qs.filter(q=>q.uid.toLowerCase().indexOf(t)>=0||q.q.toLowerCase().indexOf(t)>=0||q.o.some(o=>String(o).toLowerCase().indexOf(t)>=0));
 return qs;}
function renderQuestions(){
 renderHeader("QUESTION BANK");

  rows+='<div class="qrow" data-uid="'+q.uid+'"><div class="row" style="gap:8px;align-items:center"><span class="mono" style="font-size:11px;color:'+(state.answered[q.uid]?"var(--green)":"var(--dim)")+'">'+(state.answered[q.uid]?"\u25CF":"\u25CB")+'</span>'+badge(q.uid,"var(--cyan)")+diffBadge(q.d)+badge(sysEcp(q.sys),"var(--dim)")+'</div>'

 const pager=(id)=>'<div class="pager"><button class="btn gray pg" data-p="first" id="pf'+id+'" '+(qPage===0?"disabled":"")+'>\u00AB</button>'

 app.innerHTML='<div class="card"><input id="qsr" class="inp" placeholder="SEARCH BY TEXT OR QUESTION ID (e.g. HYD-12)" value="'+esc(qTxt)+'" autocomplete="off">'

 +'<select id="qd" class="inp" style="width:150px;margin-bottom:0">'+[0,1,2,3].map(d=>'<option value="'+d+'"'+(qDiffF===d?" selected":"")+'>'+(d===0?"ALL LEVELS":DIFF[d].label)+'</option>').join("")+'</select></div>'
 +'<div class="spread" style="margin-top:9px"><span class="mono" style="font-size:11.5px;color:var(--gray)">'+qs.length+' MATCH(ES) \u00B7 SHOWING '+(qs.length?from+1:0)+'\u2013'+to+'</span>'
 +'<span class="row" style="gap:6px"><span class="mono" style="font-size:10.5px;color:var(--dim)">PER PAGE</span>'+perBtns+'</span></div>'
