{d:2,q:"The IP check valve prevents:",o:["HP air reaching the packs","Reverse flow into the 5th stage when the HP valve is supplying","Fan air entering the precooler","Crossbleed reverse flow"],a:1,e:"When 9th-stage air feeds the system, the IP check valve stops it back-flowing into the lower compressor stage."},
{d:2,q:"On the ECAM BLEED page you can read:",o:["Only pack temperatures","Bleed valve/HP valve states, duct pressure and temperature, pack data, crossbleed and APU bleed status","Fuel used","Cabin V/S"],a:1,e:"The BLEED page is the pneumatic snapshot: valve positions, PSI/temperature per side, pack operation and APU/crossbleed configuration."},
{d:3,q:"After takeoff with a BLEED fault isolated on one side, wing anti-ice:",o:["Is lost","Can be supplied to both wings via the crossbleed from the operative side","Works on one wing only, always","Requires the APU below FL200"],a:1,e:"Opening the crossbleed lets a single bleed feed both wing anti-ice valves — configuration per ECAM/QRH."},
{d:2,q:"Packs OFF takeoff is used to:",o:["Cool the cabin faster","Increase available engine performance by removing bleed extraction","Save APU fuel","Test the bleed valves"],a:1,e:"Removing pack bleed load improves takeoff performance; the APU may supply the packs instead so the cabin keeps conditioning."},
{d:3,q:"With a dual bleed failure in cruise, the procedure leads to:",o:["Continue at FL350","Descent (cabin will climb) and possible use of APU bleed below its ceiling to restore pressurization","Immediate ditching preparation","RAM AIR at cruise level"],a:1,e:"No bleed = no packs: descend, then APU bleed (≤15,000/20,000 ft logic) can restore pack supply — the APU altitude limits become central."},
{d:2,q:"During engine start, the pack valves:",o:["Stay open","Close to guarantee maximum air to the starter, reopening per sequence timing","Open fully","Modulate"],a:1,e:"Start logic prioritizes starter air; the packs come back automatically after start (staggered to avoid duct surges)."},
{d:2,q:"The fan air valve controls:",o:["Bleed pressure","Cooling airflow through the precooler to regulate bleed temperature","Pack flow","Crossbleed position"],a:1,e:"It modulates fan air across the precooler — the temperature control element of the bleed system."},
{d:3,q:"A BLEED NOT CLOSED indication during start means:",o:["Normal condition","The engine bleed valve failed to close during the start sequence — starter air may be insufficient","APU overspeed","Pack overheat"],a:1,e:"If the bleed valve stays open during start, duct pressure bleeds away from the starter — a cause of weak cranking to recognize."},
{d:2,q:"Hydraulic reservoirs and the water tank are pressurized from:",o:["The packs","The bleed/pneumatic ducting (regulated low pressure)","Cabin air","Ram air"],a:1,e:"Small regulated taps off the pneumatic system keep reservoirs and the potable water tank pressurized — why bleed problems can cascade."},
{d:2,q:"BMC 1 failure results in:",o:["Total loss of bleed monitoring","BMC 2 taking over most monitoring functions for side 1","Automatic bleed shutdown","Loss of pack 1"],a:1,e:"Cross-cover between BMCs preserves monitoring; some leak-detection segments may be degraded per FCOM."},
{d:3,q:"A crossbleed engine start (no APU bleed) requires:",o:["Ground air always","Running engine at higher thrust supplying the duct, crossbleed OPEN, and start per procedure","Battery start","Windmilling"],a:1,e:"The operative engine's bleed feeds the starter through the open crossbleed — a taxi-out procedure with thrust and area precautions."},
{d:1,q:"Wing anti-ice air comes from:",o:["Electric heaters","The pneumatic/bleed system","The APU only","Exhaust gases"],a:1,e:"Wing anti-ice is a bleed consumer downstream of the crossbleed ducting — connecting the BLEED and ICE chapters."},
{d:2,q:"Duct pressure on the BLEED page is indicated in:",o:["Bar","PSI","kPa","Inches Hg"],a:1,e:"PSI per side — with ~45 as the healthy regulated reference and ~35 when the APU supplies."},
{d:3,q:"Why does the bleed system avoid using HP (9th stage) air at high power?",o:["The valve cannot open","Temperature and pressure would be excessive and performance penalty higher — the IP stage suffices","The precooler bypasses it","BMC logic forbids monitoring"],a:1,e:"At high N2, 9th-stage air is too hot/energetic; the IP port delivers adequate pressure at far lower penalty — the design logic behind the two-port system."},
],
APU: [
{d:1,q:"Describe the APU architecture.",o:["Twin-shaft turbine with free power turbine","Single-shaft constant-speed gas turbine; the gearbox drives the APU generator, oil pump and starter","Piston engine driving a generator","Electric turbine"],a:1,e:"Single shaft at governed constant speed; the accessory gearbox drives the APU GEN, the oil pump and the DC electric starter."},
{d:2,q:"APU bleed capability with altitude:",o:["2 packs up to 25,000 ft","2 packs up to 15,000 ft; 1 pack up to 20,000 ft","1 pack up to 15,000 ft only","Bleed available at any altitude"],a:1,e:"Bleed capacity decays with altitude: two packs to 15,000 ft, one pack to 20,000 ft — central numbers for depressurization strategy."},
{d:2,q:"Up to what altitude can the APU supply electrical power?",o:["20,000 ft","25,000 ft","Up to the maximum certified ceiling (~39,000 ft)","10,000 ft"],a:2,e:"Electrical power is available to max certified altitude (~39,100–39,800 ft depending on aircraft) — unlike bleed, which is altitude-limited."},
{d:2,q:"Up to what altitude can the APU be started on batteries in flight?",o:["15,000 ft","~25,000 ft","35,000 ft","Any altitude"],a:1,e:"Battery start capability extends to about 25,000 ft — the EMER ELEC scenario figure. With normal power, start envelope is wider."},
{d:1,q:"What controls and protects the APU?",o:["The FADEC of engine 1","The ECB (Electronic Control Box), with full authority","The BMC","The FWC"],a:1,e:"The ECB is the APU's full-authority computer: sequencing, governing, monitoring and protective shutdowns."},
{d:1,q:"What must be confirmed before pressing the APU START pushbutton?",o:["APU GEN ON","The air intake FLAP is fully OPEN (confirmed on ECAM)","Crossbleed open","EXT PWR disconnected"],a:1,e:"Sequence: MASTER SW ON → verify FLAP OPEN on the APU page → START. The ECB will not start with the flap closed."},
{d:2,q:"During the start sequence, the starter cuts out at approximately:",o:["35% N","60% N","80% N","95% N"],a:1,e:"The DC starter drops off around 60% N; the APU self-accelerates to governed speed and AVAIL appears at ~95% N."},
{d:2,q:"APU bleed pressure indicated on the ECAM APU page is approximately:",o:["20 psi","35 psi","50 psi","80 psi"],a:1,e:"About 35–36 psi when supplying — lower than the ~45 psi engine bleed reference."},
{d:1,q:"Where does the APU take its fuel from?",o:["A dedicated APU tank","The left side of the LP fuel line; the APU fuel pump runs automatically if there is no boost pump pressure","The center tank only","The right wing tank directly"],a:1,e:"Fuel comes from the left feed line; without main pump pressure, the dedicated APU pump activates automatically."},
{d:2,q:"What cool-down applies before APU shutdown?",o:["Always 5 minutes","60–120 seconds if bleed was in use; immediate shutdown if bleed was not used","No cool-down ever","10 minutes after generator use"],a:1,e:"If bleed was being used, run it 60–120 s unloaded before MASTER OFF; generator-only operation permits direct shutdown."},
{d:2,q:"Regarding source priorities:",o:["APU GEN has priority over EXT PWR","APU BLEED has priority over engine bleed, but APU GEN has NO priority over EXT PWR or engine generators","APU has priority in everything","Engine bleed has priority over APU bleed"],a:1,e:"Pneumatics: APU wins. Electrics: engine generators and external power rank above the APU GEN — an asymmetry examiners love."},
{d:2,q:"In case of APU fire on the ground:",o:["The crew must shut it down manually","Automatic shutdown and automatic agent discharge occur, with a horn in the nose wheel well","Only a cockpit warning appears","The bottle must be fired from outside"],a:1,e:"Ground logic is fully automatic: shutdown + extinguisher discharge + external horn to alert ground personnel."},
{d:3,q:"In case of APU fire IN FLIGHT:",o:["Automatic shutdown and discharge","The crew performs shutdown and fires the single bottle — no automatic discharge airborne","Nothing can be done","The ECB discharges after 30 s"],a:1,e:"Airborne, automation is limited to protection shutdowns; fire drill (MASTER OFF, AGENT) is crew action. Auto-discharge is a ground-only feature."},
{d:2,q:"The APU air intake flap:",o:["Is always open","Opens before start and closes after shutdown to reduce drag","Only opens in flight","Is manually operated"],a:1,e:"MASTER SW ON drives the flap open; after shutdown it closes. FLAP OPEN on ECAM is your start precondition."},
{d:3,q:"Which conditions cause an APU automatic shutdown (among others)?",o:["High fuel flow only","Overspeed, low oil pressure, high oil temperature, EGT overtemperature, loss of ECB control","Generator overload","Bleed valve open"],a:1,e:"The ECB protects the machine: speed, oil and EGT exceedances shut it down. On the ground, fire is added to the auto-shutdown list."},
{d:2,q:"The LOW OIL LEVEL advisory on the APU means:",o:["Immediate shutdown required","Maintenance servicing is due soon; operation can continue per procedure — advisory appears on ground with APU off","The APU cannot start","Oil pressure is lost"],a:1,e:"It is a servicing advisory, not an emergency — plan maintenance action; it is not a low oil PRESSURE condition."},
{d:2,q:"APU governed speed corresponds to:",o:["Variable speed with load","~100% N constant speed regardless of load","95% N","Idle at 60%"],a:1,e:"Single-shaft constant-speed design: the ECB holds ~100% N; load changes are absorbed by fuel scheduling, keeping 400 Hz stable."},
{d:2,q:"The APU generator rating is:",o:["45 kVA","90 kVA, able to replace a main generator","5 kVA","120 kVA"],a:1,e:"90 kVA — full replacement for an engine generator within the electrical envelope."},
{d:2,q:"Starting an engine with APU bleed automatically:",o:["Closes the crossbleed","Opens the crossbleed so APU air reaches both start valves","Stops the packs permanently","Requires ground air"],a:1,e:"APU bleed ON opens the crossbleed (AUTO logic), delivering air to either engine's starter; packs close during the start itself."},
{d:3,q:"After several consecutive failed APU start attempts:",o:["Keep trying immediately","Respect the starter cooling limitation (e.g., a waiting period after 3 attempts) per FCOM","Replace the batteries","Start on external air"],a:1,e:"Starter duty cycles impose a cooling wait after repeated attempts — the exact attempts/time figure is an FCOM limitation to verify for the GLG fleet."},
{d:2,q:"The APU FIRE controls in the cockpit include:",o:["Only a light","APU FIRE pushbutton (isolation) and AGENT pushbutton for the single bottle","Two agent buttons","A fuel lever"],a:1,e:"The FIRE pb isolates fuel/air/electrics and arms the squib; AGENT fires the single bottle. An external panel also allows shutdown/discharge."},
{d:3,q:"Approximate APU fuel consumption on the ground (GEN + bleed) is:",o:["~50 kg/h","~100–130 kg/h","~300 kg/h","~10 kg/h"],a:1,e:"Order of magnitude 100–130 kg/h with load — the number behind APU vs GPU economics. Verify GLG planning figures."},
{d:1,q:"Where is AVAIL indicated when the APU reaches governed speed?",o:["On the FCU","In the START pushbutton and on the ECAM APU page","On the PFD","On the overhead ELEC panel only"],a:1,e:"AVAIL lights in the START pb and shows on the APU page: generator and bleed can now be used."},
{d:2,q:"Selecting APU MASTER SW OFF with bleed in use causes:",o:["Immediate shutdown","The cooling period logic to run before the APU actually stops","Nothing until START is pressed","An automatic restart"],a:1,e:"The shutdown sequence honors the cool-down when bleed was loaded, protecting the hot section."},
{d:3,q:"During a battery-only APU start, electrical loads:",o:["Are unaffected","Are reduced (shedding) while the starter draws heavy DC current","Increase","Transfer to the static inverter"],a:1,e:"The DC starter is the biggest battery load: expect load shedding and voltage dip during the crank — why battery condition matters."},
{d:2,q:"The APU EGT indication during start typically:",o:["Stays flat","Peaks during light-off/acceleration, then stabilizes lower at governed speed","Rises continuously","Is not displayed"],a:1,e:"The start peak is the thermally critical moment; the ECB monitors it against start EGT limits and aborts if exceeded."},
{d:2,q:"APU oil system:",o:["Shares engine oil","Is self-contained with its own pump driven by the gearbox","Uses hydraulic fluid","Is gravity fed from a wing tank"],a:1,e:"The APU has its own oil circuit and pump; the LOW OIL LEVEL advisory refers to this independent system."},
{d:3,q:"Why does APU BLEED have priority over engine bleed?",o:["It is hotter","Using free APU air on the ground/low altitude saves engine bleed penalty; system logic closes engine bleeds when APU supplies","The ECB commands the BMCs","It has higher pressure than engine bleed"],a:1,e:"Design intent: when the APU can supply, engine bleed extraction (and its fuel/performance cost) is removed; note APU bleed is ~35 psi, LOWER than engine's ~45."},
{d:2,q:"The external APU shutdown/fire panel is located:",o:["At the tail cone","Near the nose gear area with the horn","On the refuel panel","Inside the cabin"],a:1,e:"Ground crew access at the nose area: horn + shutdown/discharge controls for ground fire response."},
{d:3,q:"With loss of all main generators in flight, starting the APU restores:",o:["Only bleed air","AC power to the network via APU GEN (within its envelope), removing the emergency electrical configuration","The IDGs","Nothing above 20,000 ft"],a:1,e:"APU GEN can repower the AC buses up to its electrical ceiling — the standard recovery path from EMER ELEC before landing."},
],
FIRE: [
{d:1,q:"How is engine fire detection achieved?",o:["One loop per engine","Two parallel detection loops (A and B) per engine","Smoke detectors in the nacelle","Thermocouples on the EGT probes"],a:1,e:"Dual sensing loops (A and B) run through the engine fire zones; redundancy prevents both missed detection and false alarms."},
{d:2,q:"When is an engine FIRE warning triggered?",o:["When one loop detects fire","When both loops detect fire (or one, if the other has failed)","Only during the fire test","When EGT exceeds limits"],a:1,e:"AND logic: both loops must agree, unless one is failed — then the surviving loop suffices. Single-loop detection with both serviceable gives a fault, not a fire."},
{d:1,q:"How many fire extinguisher bottles per engine?",o:["1","2 (AGENT 1 and AGENT 2)","3","None; only fuel cutoff"],a:1,e:"Two bottles per engine, discharged via AGENT 1 and AGENT 2 pushbuttons after the FIRE pb is released."},
{d:2,q:"Pushing the ENG FIRE pushbutton:",o:["Discharges the agents immediately","Closes the LP fuel valve, hydraulic fire shutoff and bleed/pack valves, trips the generator, arms the squibs and silences the aural","Only silences the warning","Shuts down both engines"],a:1,e:"The FIRE pb isolates everything feeding the fire — fuel, hydraulics, air, electrics — and arms the bottles. Discharge is a separate, deliberate action."},
{d:2,q:"APU fire protection consists of:",o:["Two bottles, manual discharge only","One bottle; on the ground, shutdown and discharge are automatic","No extinguishing capability","Engine 2 bottles shared"],a:1,e:"A single bottle protects the APU; ground fires trigger automatic shutdown + discharge + external horn. Airborne, the crew acts."},
{d:2,q:"Cargo compartment fire extinguishing (classic A320):",o:["Two bottles per compartment","One bottle, dischargeable into the forward OR the aft compartment","Automatic water mist","Handled by cabin crew extinguishers"],a:1,e:"One bottle with discharge heads to either hold; smoke detection in ceiling cavities triggers the warning. Verify GLG configuration (some fits differ)."},
{d:1,q:"Lavatory fire protection includes:",o:["A crew-operated bottle only","A smoke detector plus an automatic extinguisher in the waste bin","A fire loop","Nothing; only procedures"],a:1,e:"Each lavatory has smoke detection and a small automatic bottle discharging into the waste bin — the most common onboard fire source."},
{d:2,q:"The ENG 1(2) FIRE TEST verifies:",o:["Only the light bulbs","Detection loops, warning activation (lights/aurals) and squib circuit indications","Bottle pressure by discharging","The FADEC channels"],a:1,e:"The test exercises the full chain: loops, FIRE lights, MASTER WARN, aural, and squib/DISCH indications — without firing anything."},
{d:2,q:"What type of detectors do the engine/APU fire loops use?",o:["Optical flame detectors","Pressure-type gas detection sensing elements responding to heat","Ionization smoke detectors","Thermocouples"],a:1,e:"Gas-filled sensing elements: heat raises internal pressure, closing the alarm switch — robust and self-monitoring for leaks/breaks (fault indication)."},
{d:3,q:"If both detection loops of one engine fail:",o:["Fire detection remains normal","ENG FIRE DET FAULT is shown — fire detection is lost on that engine","The bottle discharges","The engine must be shut down"],a:1,e:"Loss of both loops removes detection capability and is announced as a fault caution; dispatch/continuation per MEL/QRH."},
{d:2,q:"What is a squib?",o:["A fire loop segment","The pyrotechnic cartridge that ruptures the bottle diaphragm to discharge the agent","A test relay","The agent itself"],a:1,e:"Firing the squib releases the extinguishing agent; SQUIB light shows the circuit is armed/ready, DISCH shows the bottle is empty."},
{d:2,q:"The amber DISCH light on an AGENT pushbutton indicates:",o:["Agent armed","The bottle has discharged (or pressure is low)","Fire extinguished","Squib failure"],a:1,e:"DISCH = bottle empty/low pressure. After firing AGENT 1, monitor: if fire persists after the QRH time, fire AGENT 2."},
{d:2,q:"After discharging AGENT 1 on an engine fire, AGENT 2 is fired:",o:["Immediately together with AGENT 1","If the fire warning persists after the procedure's waiting time (~30 s per QRH)","Never in flight","Only on the ground"],a:1,e:"The drill staggers the bottles: give agent 1 time to work, then commit the second if FIRE persists — exact timing per GLG QRH."},
{d:2,q:"The engine FIRE indications appear in all these locations EXCEPT:",o:["ENG FIRE pushbutton (red)","MASTER WARN + ECAM","FIRE light on the ENG MASTER panel","On the FCU"],a:3,e:"The FCU has no fire indications. The red pb, the ENG panel FIRE light, MASTER WARN and the ECAM warning make the set."},
{d:2,q:"Cargo smoke detection uses:",o:["Fire loops","Smoke detectors in compartment ceiling cavities with dual-detector logic","Temperature probes","Pressure sensors"],a:1,e:"Optical/ionization detectors in the holds trigger SMOKE warnings; suppression follows with the cargo bottle discharge."},
{d:3,q:"After discharging the cargo bottle into a compartment:",o:["The fire is guaranteed out","Agent concentration is designed to be maintained for a period; plan landing per QRH — do not reopen the compartment","Ventilation should be increased","The second compartment loses protection forever"],a:1,e:"The strategy is suppression + containment: isolation valves close, agent knockdown then metered concentration; land as the procedure dictates."},
{d:2,q:"Avionics smoke is detected by:",o:["Crew smell only","A smoke detector in the avionics ventilation extract duct","Fire loops under the floor","The FWC"],a:1,e:"The extract air passes a detector — smoke in the cooling flow reveals an avionics source, triggering the AVIONICS SMOKE procedure."},
{d:1,q:"Portable fire protection in the cabin/cockpit includes:",o:["Nothing portable","Halon (BCF) extinguishers and PBE smoke hoods at defined stations, plus one in the cockpit","Water extinguishers only","CO2 bottles in each seat row"],a:1,e:"Portable halon units + protective breathing equipment cover cabin/cockpit fires; locations are part of the safety equipment briefing."},
{d:2,q:"The lavatory smoke warning is announced by:",o:["No indication in the cockpit","CRC/warning with ECAM message plus cabin indications","Only a light in the lavatory","A single chime only"],a:1,e:"Lavatory smoke generates a cockpit warning and cabin alerts so crew can intervene fast — verify exact alert level in FCOM."},
{d:3,q:"An engine tailpipe fire during start is fought by:",o:["ENG FIRE pb + agents","Dry cranking the engine (MASTER OFF, crank to blow out fuel) — the fire pb/agents are NOT the first action since the fire is internal","Discharging both bottles","Evacuating immediately always"],a:1,e:"A tailpipe fire is burning fuel in the exhaust: ventilate it out by cranking. Firing agents doesn't reach it and the fire pb removes your motoring capability."},
{d:3,q:"Why does a single-loop detection (both loops serviceable) NOT trigger a fire warning?",o:["The loop is ignored entirely","AND logic protects against false warnings from a damaged loop; a single-loop alert with the other serviceable indicates a probable fault","It does trigger the warning","The FWC filters it"],a:1,e:"Design balances missed-alarm vs false-alarm risk: agreement of both loops (or one failed + one alarming) is required."},
{d:2,q:"Where do the engine detection loops run?",o:["Only in the fan case","Pylon, fan section and core zones of each engine","Inside the combustion chamber","Along the wing leading edge"],a:1,e:"Loops cover the fire zones: nacelle core, fan compartment and pylon — where flammable fluid + ignition can coexist."},
{d:2,q:"Bottle pressure monitoring:",o:["Does not exist","Continuously monitored; loss of pressure shows as DISCH/maintenance indication","Checked only by discharge","Read on a cockpit gauge"],a:1,e:"Pressure switches monitor each bottle; a leaked bottle is flagged so you never depend on an empty extinguisher."},
{d:1,q:"The aural for a fire warning is:",o:["Single chime","Continuous repetitive chime (CRC)","Cavalry charge","Triple click"],a:1,e:"Fire is Level 3: CRC + MASTER WARN + red ECAM warning + local red lights."},
{d:3,q:"Engine fire on ground after shutdown — key considerations include:",o:["Only calling maintenance","Fire drill + both agents as needed, ATC/ground fire services, and evaluating evacuation per SOP","Restarting the engine to blow it out","Taxiing back immediately"],a:1,e:"Ground fire response couples the aircraft drill with external firefighting and an evacuation decision — command judgment, not just switchology."},
{d:2,q:"The FIRE light in the ENG MASTER lever area indicates:",o:["Master lever failure","Fire detected on that engine — reinforcing which lever to select OFF","FADEC fault","Starter engaged"],a:1,e:"The light next to the master lever helps prevent shutting down the wrong engine under stress — always crosscheck with the pb and ECAM."},
{d:2,q:"During the FIRE TEST, how many indications confirm a good test (engine)?",o:["Only the pb lights","A defined set: FIRE pb red, ENG panel FIRE light, MASTER WARN, CRC, ECAM warning, and SQUIB/DISCH lights on agents","Just the CRC","The DISCH lights only"],a:1,e:"Know the full expected indication set from the FCOM — an incomplete test is a no-go item to resolve before dispatch."},
{d:3,q:"If an engine fire warning extinguishes after AGENT 1:",o:["The failure is over; restart the engine","Continue the QRH sequence: the engine remains secured, land per procedure — never restart a fire-secured engine","Fire AGENT 2 anyway immediately","Reset the FIRE pb"],a:1,e:"Warning out = fire likely suppressed, but the engine stays secured; the flight continues single-engine per QRH/FCTM guidance."},
{d:1,q:"The APU fire bottle can also be discharged from:",o:["The cabin","The external ground panel near the nose gear","The refuel panel","It cannot be discharged externally"],a:1,e:"Ground personnel can shut down the APU and fire the bottle from the external panel — coupled with the wheel-well horn alert."},
{d:2,q:"Cargo compartment isolation on smoke detection includes:",o:["Opening ventilation","Closing the compartment's ventilation/isolation valves to starve airflow before/with agent discharge","Depressurizing the cabin","Opening the outflow valve fully"],a:1,e:"Cutting airflow is part of suppression: less oxygen and no agent dilution — the procedure sequences isolation and discharge."},
],
ICE: [
{d:1,q:"Which slats are heated by wing anti-ice?",o:["All slats","Slats 3, 4 and 5 (outboard) of each wing","Slats 1 and 2","Only the slat leading edge of slat 1"],a:1,e:"Bleed air heats the three outboard slats — the aerodynamically critical region; exhaust holes under the slats vent the spent air."},
{d:2,q:"Selecting WING ANTI ICE on the ground:",o:["Is prohibited","Triggers a 30-second test sequence, after which the valves close","Provides continuous heating","Only works with engines off"],a:1,e:"Ground selection opens the valves for a 30 s self-test only — continuous wing anti-ice is an airborne function."},
{d:2,q:"Engine anti-ice air comes from:",o:["The opposite engine","Its own engine HP compressor, independent of the crossbleed","The APU only","The wing anti-ice ducting"],a:1,e:"Each nacelle is anti-iced by its own engine's compressor air, upstream of the bleed system — so it works regardless of pack/crossbleed configuration."},
{d:3,q:"In case of electrical power loss, the engine anti-ice valves:",o:["Fail closed","Fail open","Remain in the last position","Cycle automatically"],a:1,e:"Fail-safe philosophy: losing control power leaves the valves OPEN — protection is preserved at the cost of some performance."},
{d:1,q:"Icing conditions are considered to exist when:",o:["OAT below 0°C","TAT at or below 10°C with visible moisture","SAT below -40°C","Only in clouds"],a:1,e:"TAT ≤10°C (OAT on ground) plus visible moisture (or contaminated taxi surfaces) defines icing conditions — the trigger for anti-ice use."},
{d:3,q:"The exception to engine anti-ice use in icing conditions is:",o:["During descent","In climb and cruise when SAT is below -40°C","Above FL200","With wing anti-ice on"],a:1,e:"At SAT below -40°C in climb/cruise, supercooled water is unlikely, so engine anti-ice is not required — but it IS required in descent regardless. A precise FCOM rule."},
{d:2,q:"Probe and window heat operates:",o:["Only when selected ON","Automatically when at least one engine is running (windows at low power on ground)","Only in flight","Only in icing conditions"],a:1,e:"Automatic with the first engine; the PROBE/WINDOW HEAT pb forces ON before start. Window heat runs at low power on the ground."},
{d:2,q:"Which probes are electrically heated?",o:["Pitot only","Pitot, static ports, AOA and TAT probes","Static ports only","AOA vanes only"],a:1,e:"All air-data sensors are heated; note TAT probe heating is inhibited on the ground (aspirated design) — a favorite oral detail."},
{d:3,q:"TAT probe heating operates:",o:["On ground and in flight","In flight only — it is inhibited on the ground","Only in icing","Never; it is unheated"],a:1,e:"Ground heating would distort TAT readings without airflow, so it is inhibited until airborne."},
{d:2,q:"With only one engine bleed available, wing anti-ice for BOTH wings is obtained by:",o:["Impossible","Opening the crossbleed so the single bleed feeds both wing valves","Using the APU above 20,000 ft","Electric backup heaters"],a:1,e:"Crossbleed logic lets one pneumatic source serve both wings — symmetry of protection is the priority."},
{d:2,q:"Selecting ENG ANTI ICE ON causes:",o:["No engine effect","Idle N1 increases (and thrust limits are adjusted by the FADEC)","EGT decreases","Continuous ignition always, on all variants"],a:1,e:"Bleed extraction for anti-ice raises idle and adjusts limits; ignition logic depends on variant — verify GLG FCOM before quoting it."},
{d:2,q:"Wing anti-ice increases:",o:["Available thrust","Bleed demand and fuel consumption, reducing performance margins","Cabin pressure","Stall speed protection"],a:1,e:"Anti-ice is a performance cost: bleed extraction penalizes thrust and fuel — accounted for in takeoff/landing performance data."},
{d:2,q:"A leak detected on one wing anti-ice duct causes:",o:["Both valves to open","The affected side's valve to close (BLEED LEAK logic)","Nothing","Automatic descent"],a:1,e:"Leak isolation shuts the affected supply; asymmetric wing anti-ice generates the associated ECAM caution."},
{d:1,q:"Windshield ice/fog protection is provided by:",o:["Bleed air","Electric heating of windshields and windows","Hot air blown externally","Alcohol spray"],a:1,e:"Electric film heating — with a low setting on the ground and normal in flight, controlled by the WHC."},
{d:1,q:"Rain removal on the A320 is by:",o:["Bleed air blast","Two-speed wipers (and rain repellent where installed)","Hydrophobic coating only","Heated glass melting rain"],a:1,e:"Wipers with slow/fast speeds; rain repellent is an option not present on all fleets — check GLG configuration."},
{d:2,q:"Maximum speed for windshield wiper use is:",o:["180 kt","230 kt","250 kt","VMO"],a:1,e:"Wiper operation is limited to 230 kt — above that, aerodynamic loads and blade damage risk."},
{d:2,q:"The visual ice indicator between the windshields serves to:",o:["Measure ice thickness electronically","Give the crew a visual cue of ice accretion (lighted for night use)","Detect windshield heat failure","Sample TAT"],a:1,e:"A simple accretion probe visible to both pilots; some aircraft add an electronic ice detection system — configuration dependent."},
{d:2,q:"Anti-ice philosophy on the A320 is:",o:["De-ice after accumulation","Anti-ice: turn protection ON before entering icing conditions to prevent accretion","Only ground de-icing matters","Automatic activation always"],a:1,e:"Engine/wing heat prevents formation rather than shedding it — hence 'when icing conditions are expected or exist', not 'when ice appears'."},
{d:3,q:"Why must engine anti-ice be ON during descent in icing even at very cold SAT?",o:["It must not","Descent brings the aircraft into warmer, moisture-rich layers quickly and idle power gives minimal thermal margin","To increase idle for pressurization","FADEC requires it"],a:1,e:"The -40°C exception applies to climb/cruise only; descent profiles cross icing layers where protection must already be active."},
{d:2,q:"The window/probe heat computer (PHC/WHC) provides:",o:["Manual control only","Automatic regulation and fault monitoring of probe and window heating","Heating power from batteries","Anti-ice valves control"],a:1,e:"Dedicated computers regulate heating levels and flag failures (e.g., CAPT PITOT caution) to the FWC."},
{d:2,q:"A failed pitot heater in flight generates:",o:["No indication","An ECAM caution for the affected probe (e.g., CAPT PITOT) with unreliable-speed awareness","Immediate autopilot loss","A red warning"],a:1,e:"The caution alerts the crew to potential air-data contamination on that side — connect this to the unreliable airspeed procedure."},
{d:1,q:"Ice accumulation on the airframe primarily causes:",o:["Better lift","Increased weight/drag and degraded lift and stall margin","Reduced fuel burn","Improved control response"],a:1,e:"Contaminated aerodynamics: earlier separation, higher stall speeds, control anomalies — the reason for the clean-aircraft concept."},
{d:2,q:"Wing anti-ice selection in flight opens:",o:["A valve per slat","One valve per wing, both commanded by the single WING pushbutton","Only the left valve","The pack valves"],a:1,e:"One pb, two valves (one per wing); position disagreement or low pressure raises ECAM messages."},
{d:3,q:"With WING A. ICE ON and low bleed pressure on one side, the system:",o:["Ignores it","May close/indicate fault on the affected valve — asymmetric protection is announced to the crew","Increases engine thrust automatically","Uses electric backup"],a:1,e:"Valve/pressure monitoring guards against asymmetric heating; crew resolves via crossbleed or procedure."},
{d:2,q:"Static port heating protects against:",o:["Rain","Ice blocking the static system causing altitude/airspeed errors","Bird strike","Lightning"],a:1,e:"A blocked static source corrupts altimetry and airspeed — heated plates prevent the classic frozen-static scenario."},
{d:2,q:"Waste water drain masts are:",o:["Unheated","Electrically heated to prevent ice buildup from drained water","Bleed heated","Retractable"],a:1,e:"Drain masts freeze without heat, forming ice that can shed into airframe/engines — hence electric heaters."},
{d:3,q:"'Severe icing' operationally implies:",o:["Continue as planned","Conditions beyond certification envelope: exit the conditions (change altitude/route) — anti-ice may not cope","Turning everything ON solves it","Only a cabin comfort issue"],a:1,e:"Severe icing exceeds what the protected surfaces handle; the correct response is escape, not reliance on systems."},
{d:2,q:"Before takeoff in icing conditions with precipitation, the aircraft must be:",o:["Flown as is if anti-ice is ON","De-iced/anti-iced per the ground procedure with holdover time management","Only inspected visually from the cockpit","Warmed with engines at high power"],a:1,e:"Ground icing is managed with fluids and holdover times — onboard anti-ice does not clean wings contaminated on the ground."},
{d:2,q:"Engine ice shedding procedures on ground (as per SOP) involve:",o:["Nothing special","Periodic run-ups to a defined N1 to shed fan ice during prolonged ground ops in icing","Reverse thrust","Wing anti-ice ON"],a:1,e:"Fan ice shedding run-ups at intervals are standard in freezing precipitation — exact N1/interval per GLG SOP/FCOM."},
{d:1,q:"The ANTI ICE panel is located:",o:["On the pedestal","On the overhead panel","On the glareshield","Behind the F/O"],a:1,e:"WING, ENG 1/2 anti-ice and PROBE/WINDOW HEAT pushbuttons sit together on the overhead panel."},
],
ENG: [
{d:1,q:"Describe the CFM56-5B architecture.",o:["Three-spool turbofan","Twin-spool turbofan: N1 (fan/LP) and N2 (HP core)","Geared turbofan","Single-spool turbojet"],a:1,e:"Two rotors: N1 = fan/booster/LP turbine; N2 = HP compressor/HP turbine. N1 produces most thrust; N2 drives the accessories."},
{d:2,q:"How is the FADEC powered in normal operation?",o:["By the aircraft AC network at all times","By its own dedicated alternator once N2 exceeds ~12%; aircraft power below that (start)","By the batteries only","By the IDG"],a:1,e:"Each dual-channel FADEC self-powers from a dedicated magnetic alternator above ~12% N2 — engine control independent of aircraft electrics."},
{d:1,q:"Thrust lever detents, from aft to forward:",o:["IDLE, CL, MCT, TOGA (plus MAX REV)","REV, IDLE, CL, FLX/MCT, TOGA","IDLE, FLX, CL, TOGA","REV, IDLE, MCT, CL, TOGA"],a:1,e:"MAX REV / REV IDLE / IDLE / CL / FLX-MCT / TOGA. The levers do not move with A/THR — they set the limit."},
{d:2,q:"With A/THR active in normal operation, the thrust levers are set to:",o:["TOGA","The CL detent (MCT with one engine inoperative)","IDLE","Anywhere"],a:1,e:"A/THR authority spans IDLE to the lever position: CL in normal ops, MCT single-engine. Lever position caps commanded thrust."},
{d:2,q:"During an automatic start on the ground, the FADEC:",o:["Provides no protection","Monitors and can abort/recycle the start (hot start, hung start, no light-off)","Only controls the igniters","Requires manual fuel introduction"],a:1,e:"Auto start = full protection: the FADEC aborts, dry-cranks and may retry on detected start malfunctions."},
{d:3,q:"During a MANUAL engine start, the FADEC:",o:["Provides the same full protections","Provides passive monitoring only — the crew must abort if limits are exceeded","Aborts automatically","Cannot be used"],a:1,e:"Manual start shifts abort responsibility to the crew; the FADEC still gives limited passive protection. Know which malfunctions the crew must catch."},
{d:3,q:"Igniter usage:",o:["Both igniters always","Auto start on ground uses A and B alternately (one per start); manual and in-flight starts use both","Igniter A only","Continuous ignition always active"],a:1,e:"Ground auto start alternates single igniters to balance wear; manual and in-flight starts energize both for maximum light-off reliability."},
{d:3,q:"CFM56-5B EGT limits (typical):",o:["TOGA 915°C / start 650°C","TOGA 950°C (5 min) / MCT 915°C / start 725°C","TOGA 1000°C / start 800°C","No EGT limits with FADEC"],a:1,e:"950°C for 5 min (10 min OEI), 915°C continuous, 725°C during start — memorize and verify against GLG FCOM limitations."},
{d:2,q:"The thrust reversers deflect:",o:["Hot core exhaust","Fan (cold stream) air, using blocker doors — four per engine","Both streams","Bleed air"],a:1,e:"Cold-stream reversers: translating sleeves and blocker doors redirect fan air forward. The core flow is untouched."},
{d:2,q:"Minimum engine oil pressure (CFM56-5B):",o:["8 psi","13 psi","25 psi","60 psi"],a:1,e:"13 psi is the red-line minimum; below it, the LO OIL PR warning and shutdown considerations apply. Verify GLG FCOM value."},
{d:2,q:"The engine start valve is:",o:["Electrically actuated","Pneumatically operated using bleed air, controlled by the FADEC (manual override available)","Hydraulically actuated","Spring-loaded open"],a:1,e:"Bleed pressure opens the start valve to drive the air turbine starter; a manual wrench override exists for a stuck valve."},
{d:2,q:"What is approach idle?",o:["A fuel-saving idle","A higher idle setting used in flight to ensure rapid thrust response (e.g., go-around)","Ground idle with reversers","Idle with anti-ice off"],a:1,e:"The FADEC raises idle in approach configurations so the engines can spool up quickly if needed — certification requirement for go-around response."},
{d:2,q:"Typical takeoff thrust rating of the CFM56-5B on the A320 is approximately:",o:["20,000 lb","27,000 lb","35,000 lb","15,000 lb"],a:1,e:"Around 27,000 lb per engine depending on the -5B variant/rating — confirm the exact GLG engine rating."},
{d:3,q:"Maximum N1 and N2 limits are approximately:",o:["100% / 100%","104% / 105%","110% / 108%","98% / 102%"],a:1,e:"Redlines: N1 104%, N2 105% (CFM56-5B typical) — percentages referenced to nominal design speeds, verify FCOM."},
{d:3,q:"Maximum N2 for starter re-engagement is:",o:["Any N2","About 20% N2","50% N2","Only at 0%"],a:1,e:"Re-engaging the air starter above ~20% N2 risks starter/gearbox damage — relevant on aborted starts and in-flight restart technique."},
{d:2,q:"The ENG MODE selector positions are:",o:["OFF / ON / TEST","CRANK / NORM / IGN-START","START / RUN / STOP","AUTO / MAN"],a:1,e:"CRANK for dry motoring, NORM for flight, IGN/START to arm the start sequence or select continuous ignition with engines running."},
{d:2,q:"Selecting IGN/START with both engines running provides:",o:["A restart","Continuous ignition on both engines","Nothing","Starter engagement"],a:1,e:"With engines running, IGN/START gives continuous ignition — used in heavy precipitation/turbulence per SOP."},
{d:2,q:"What is FLEX takeoff thrust?",o:["Maximum thrust","Reduced takeoff thrust computed via an assumed (flex) temperature entered in the MCDU PERF page","Thrust for short runways","A FADEC failure mode"],a:1,e:"Assumed-temperature reduction: the FADEC computes thrust as if OAT were the flex temp — saving engine life when performance permits."},
{d:3,q:"Maximum allowed thrust reduction with FLEX is:",o:["10%","25% below full rated takeoff thrust","50%","No limit"],a:1,e:"Regulatory cap: flex cannot reduce thrust more than 25%. TOGA remains available at any moment by pushing the levers fully forward."},
{d:2,q:"Maximum reverse thrust should be reduced to idle reverse by:",o:["100 kt","70 kt","40 kt","Taxi speed"],a:1,e:"By ~70 kt, reduce toward idle reverse to avoid re-ingestion and FOD; full reverse is most effective at high speed anyway."},
{d:2,q:"Engine primary parameters on the E/WD are:",o:["Oil pressure and vibration","N1, EGT, N2 and fuel flow","EPR and N3","Thrust in pounds"],a:1,e:"The CFM E/WD set: N1 (thrust reference), EGT, N2, FF. Oil and vibration data live on the SD ENG page."},
{d:2,q:"Engine vibration indications (N1/N2 VIB) are found on:",o:["The E/WD","The ECAM ENG page, with advisory thresholds","The PFD","The overhead panel"],a:1,e:"The ENG page shows oil parameters, vibration, ignition status — vibration advisories prompt monitoring or crew action per QRH."},
{d:3,q:"A hung start is:",o:["No light-off at all","Light-off with N2 stagnating below idle while EGT rises","An EGT overtemperature after idle","Starter valve stuck open"],a:1,e:"Hung = acceleration stalls before idle, temperature climbing on insufficient airflow. Auto start aborts it; in manual start, YOU abort it."},
{d:2,q:"During start, fuel and ignition are introduced by the FADEC at approximately:",o:["5% N2","Around 20–22% N2 (near max motoring)","40% N2","Immediately with master ON"],a:1,e:"The FADEC sequences ignition and fuel near maximum motoring speed (~20-22% N2) — enough airflow for a clean, cool light-off."},
{d:2,q:"The EIU (Engine Interface Unit) function is:",o:["Controlling fuel directly","Interfacing airframe systems/commands with the FADEC","Measuring EGT","Driving the igniters"],a:1,e:"One EIU per engine passes airframe data (bleed status, ATC of thrust levers, etc.) to the FADEC — a data gateway, not a controller."},
{d:3,q:"The active FADEC channel alternates:",o:["Every 10 minutes","With each engine start (active/standby swap)","Only after failures","Never"],a:1,e:"Channel swap each start exercises both channels — the same health-check philosophy as BSCU/CPC alternation."},
{d:2,q:"Oil quantity for dispatch must be at least:",o:["Any visible quantity","A minimum per FCOM (typically ~9.5 qt plus estimated consumption)","Full tank always","5 qt"],a:1,e:"Dispatch requires minimum quantity plus consumption allowance for the flight — verify the exact GLG figure and per-hour allowance."},
{d:3,q:"Maximum continuous oil temperature (CFM56-5B) is approximately:",o:["90°C","140°C (with a transient allowance to 155°C, time-limited)","200°C","No limit"],a:1,e:"140°C continuous; short transients to 155°C for up to 15 min typical — FCOM limitation numbers to confirm for GLG."},
{d:2,q:"REV green indication on the E/WD means:",o:["Reverser stowed","Reverser deployed and locked in the commanded position","Reverser in transit","Reverser fault"],a:1,e:"Amber REV = in transit/disagree; green REV = deployed. Monitoring these during rollout is part of the landing scan."},
{d:2,q:"If a start is aborted, before a new attempt the crew should:",o:["Try again immediately","Dry crank per procedure to ventilate fuel vapors, respecting starter cycle limits","Swap FADEC channels","Use both packs"],a:1,e:"Motoring clears residual fuel preventing a hot start on the next attempt; starter duty-cycle limits govern how soon and how long."},
],
};

BANK.GEN.push(
{d:1,q:"Flight crew oxygen masks are:",o:["Continuous flow","Quick-donning diluter-demand masks stowed in lateral boxes","Chemical generator masks","Portable bottles only"],a:1,e:"One-hand quick-donning masks with diluter-demand regulators — donned within seconds per certification."},
{d:2,q:"The crew mask selector positions are:",o:["ON/OFF","N (normal dilution), 100% (pure oxygen), EMER (overpressure)","LOW/HIGH","AUTO/MAN"],a:1,e:"N mixes cabin air with O2; 100% delivers pure oxygen; EMER adds positive pressure to keep smoke/fumes out of the mask."},
{d:1,q:"Passenger oxygen masks deploy automatically at a cabin altitude of about:",o:["10,000 ft","14,000 ft","8,000 ft","20,000 ft"],a:1,e:"Automatic deployment ~14,000 ft cabin altitude; chemical generators start when a mask is pulled."},
{d:2,q:"Passenger oxygen is supplied by:",o:["Gaseous bottles per row","Chemical generators (~13 min flow once activated, cannot be stopped)","The crew oxygen cylinder","Bleed air"],a:1,e:"Chemical generators provide roughly 13 minutes (variant dependent — verify GLG). Once triggered they burn to completion."},
{d:2,q:"Crew oxygen pressure is checked on:",o:["The overhead gauge only","The ECAM DOOR/OXY page","The MCDU","The FUEL page"],a:1,e:"Cylinder pressure appears on the DOOR/OXY page; below the FCOM minimum it turns amber (half-boxed indication)."},
{d:2,q:"The MASK MAN ON pushbutton:",o:["Drops the crew masks","Deploys the passenger masks manually before automatic altitude is reached","Tests the generators","Shuts off oxygen"],a:1,e:"Guarded pb for manual deployment when the crew anticipates need — e.g., slow depressurization before 14,000 ft cabin."},
{d:3,q:"The EMER position of the crew mask regulator is used for:",o:["Saving oxygen","Creating overpressure inside the mask to prevent smoke/fume ingress","Speaking on radio","Diluting with cabin air"],a:1,e:"Positive pressure keeps contaminants out — the smoke/fumes drill selects 100%/EMER as required."},
{d:1,q:"Cabin portable oxygen consists of:",o:["Nothing portable","Portable bottles with masks for first aid and crew mobility","Chemical canisters","Bleed outlets"],a:1,e:"Portable bottles at defined stations support first aid and PBE complement firefighting — locations per cabin layout."},
{d:1,q:"Arming a cabin door slide means:",o:["Locking the door","Connecting the girt bar so opening the door inflates/deploys the slide","Disarming evacuation","Opening from outside only"],a:1,e:"Armed mode ties the slide to the floor: door opening deploys it — the reason for the arm/disarm crosscheck calls."},
{d:2,q:"Opening an armed cabin door from inside results in:",o:["Normal opening","Automatic slide deployment and inflation","Slide detachment","An ECAM warning only"],a:1,e:"That is the design intent for evacuation; outside opening mechanisms disarm the slide automatically."},
{d:2,q:"The reinforced cockpit door in case of total electrical failure:",o:["Stays locked","Fails unlocked (mechanically openable)","Opens automatically","Can only be opened from inside"],a:1,e:"Fail-safe philosophy: with power lost the electric locks release. Emergency keypad access with time delay covers incapacitation."},
{d:2,q:"On the ECAM DOOR page, an open door is shown in:",o:["Green","Amber (or red per phase logic)","White","Blue"],a:1,e:"Open/unlocked doors display amber; the SLIDE indication shows armed state next to each cabin door."},
{d:1,q:"The beacon light is switched ON:",o:["After takeoff","Before pushback/engine start, signaling engines running or about to run","Only at night","During refueling"],a:1,e:"Red beacon = danger area around aircraft; it stays on until engines are shut down."},
{d:1,q:"Strobe lights are normally:",o:["On at the gate","ON entering the runway (or AUTO where fitted)","Used during taxi","Never used by day"],a:1,e:"Strobes signal runway occupancy and flight; AUTO extends them airborne automatically on equipped aircraft."},
{d:2,q:"The RWY TURN OFF lights are located on:",o:["The wing roots","The nose landing gear","The tailcone","Wingtips"],a:1,e:"Nose-gear-mounted lights aimed sideways to illuminate turnoffs; the taxi/T.O light shares the nose gear."},
{d:2,q:"The NOSE light selector positions are:",o:["ON/OFF","OFF / TAXI / T.O","LOW/HIGH","AUTO only"],a:1,e:"TAXI for ground movement, T.O adding the takeoff light intensity for departure and landing."},
{d:2,q:"A320 overall length is approximately:",o:["31 m","37.6 m","44 m","28 m"],a:1,e:"~37.57 m — useful for parking/clearance awareness. (A319 ~33.8, A321 ~44.5.)"},
{d:2,q:"A320 wingspan is approximately:",o:["30 m","34.1 m (35.8 m with sharklets)","38 m","40 m"],a:1,e:"~34.10 m baseline, ~35.80 m with sharklets — verify GLG fleet configuration for taxi clearance planning."},
{d:2,q:"A320 tail height is approximately:",o:["9 m","11.8 m","14 m","16 m"],a:1,e:"~11.76 m — hangar and de-icing rig clearance figure."},
{d:3,q:"Typical A320ceo MTOW is around:",o:["66,000 kg","77,000 kg (variant dependent)","89,000 kg","59,000 kg"],a:1,e:"Common certified MTOWs cluster near 73.5–78 t; the GLG weight variant governs — verify your FCOM limitations."},
{d:3,q:"Maximum certified passenger capacity of the A320 (exit limit) is:",o:["150","180","195","220"],a:1,e:"180 passengers is the A320 exit-limited maximum (single-class high density)."},
{d:1,q:"How many identical display units (DU) equip the cockpit?",o:["4","6","8","5"],a:1,e:"Six interchangeable DUs: two PFD, two ND, E/WD and SD — physical interchangeability simplifies reconfiguration."},
{d:2,q:"If the Captain's PFD screen fails:",o:["The image is lost","The PFD/ND XFR pb swaps the PFD image onto the ND unit","DMC 3 must be selected","Use the F/O side only"],a:1,e:"The transfer pushbutton relocates the vital PFD image to the adjacent screen; the ND is sacrificed on that side."},
{d:2,q:"The EIS DMC selector allows:",o:["Turning off displays","Replacing DMC 1 or DMC 2 with DMC 3 after a failure","Changing display colors","Testing the FWC"],a:1,e:"CAPT or F/O position on the EIS DMC switch substitutes DMC 3 for a failed channel, restoring displays."},
{d:2,q:"The standby instruments (ISIS or classic standby set) provide:",o:["Autopilot backup","Independent attitude, airspeed and altitude with dedicated power","Navigation display","Engine data"],a:1,e:"A fully independent air data/attitude reference, battery-backed — the last-resort instrument set. Configuration per GLG fleet."},
{d:1,q:"The CVR and DFDR record respectively:",o:["Video and audio","Cockpit audio (~2 h) and flight parameters (~25 h)","Only radio calls","ECAM messages"],a:1,e:"Cockpit Voice Recorder ~2 hours of audio; Digital Flight Data Recorder ~25 hours of parameters — both in the tail area."},
{d:2,q:"The RCDR GND CTL pushbutton is used to:",o:["Erase the CVR","Energize the recorders on the ground before engine start","Test the DFDR","Stop recording in flight"],a:1,e:"On ground the recorders run automatically with engines; GND CTL powers them earlier (e.g., for briefing/pushback)."},
{d:1,q:"The ELT (Emergency Locator Transmitter):",o:["Transmits weather","Activates on impact transmitting on 406 MHz (and 121.5)","Is portable only","Requires manual arming each flight"],a:1,e:"Fixed automatic ELT triggers on crash deceleration; remote switch allows manual activation/test per SOP."},
{d:2,q:"The EVAC panel allows:",o:["Announcing boarding","Commanding/acknowledging the evacuation signal between cockpit and cabin","Opening doors remotely","Deploying slides"],a:1,e:"EVAC COMMAND generates the evacuation tone at attendant stations; the CAPT/PURS selector defines activation authority."},
{d:2,q:"The T.O CONFIG pushbutton:",o:["Configures flaps automatically","Simulates takeoff power application to test the takeoff configuration warnings","Arms autobrake MAX","Sets FLEX thrust"],a:1,e:"Pressing it triggers any config warning (flaps, trim, spoilers, park brake) before thrust is really applied — 'T.O CONFIG NORMAL' expected."},
{d:2,q:"A takeoff configuration warning is generated for all EXCEPT:",o:["Flaps outside takeoff range","Speedbrakes not retracted","Pitch trim outside the green band","Landing lights OFF"],a:3,e:"Lights are not a config item. Flaps/slats, spoilers, trim, parking brake and side stick fault conditions are monitored."},
{d:2,q:"The TAKEOFF memo appears:",o:["At V1","About 2 minutes after second engine start (or pressing T.O CONFIG)","At the runway holding point automatically","After flap selection only"],a:1,e:"FWC logic arms the T.O memo after the second start; blue lines turn green as items are completed."},
{d:2,q:"The LANDING memo appears:",o:["At 10,000 ft","On approach around 2,000 ft RA (FWC logic)","Only with gear down","At the FAF"],a:1,e:"Approaching land, LDG memo lists gear/signs/spoilers/flaps status — approximate trigger height, verify FCOM."},
{d:3,q:"The automatic 'RETARD' callout occurs at:",o:["50 ft","20 ft in manual landing (10 ft in autoland)","At touchdown","100 ft"],a:1,e:"The FWC prompts thrust reduction to idle for the flare; in autoland it comes at 10 ft."},
{d:2,q:"Automatic radio height callouts are generated by:",o:["The pilots only","The FWC (e.g., 400, 300, 200, 100, 50, 40, 30, 20, 10)","ATC","The GPWS exclusively"],a:1,e:"FWC auto callouts support the landing; 'HUNDRED ABOVE'/'MINIMUM' relate to selected minima."},
{d:3,q:"The C-chord altitude alert sounds when:",o:["Passing 10,000 ft","Deviating from the FCU-selected altitude beyond the alert threshold (~250 ft)","Reaching cruise","Capturing the glide"],a:1,e:"Steady light approaching the selected altitude; deviation afterwards flashes the altitude window and sounds the C-chord. Verify exact thresholds."},
{d:2,q:"The CRUISE page on the SD:",o:["Must be selected manually","Is displayed automatically in cruise phase, summarizing engines/cabin data","Replaces the E/WD","Shows the flight plan"],a:1,e:"With no page manually selected and no advisories, the CRUISE synthesis page shows in cruise."},
{d:2,q:"Which of these is NOT an SD system page?",o:["HYD","F/CTL","RADAR","APU"],a:2,e:"Radar shows on the ND, not the SD. The 12 system pages + STATUS + CRUISE make the SD set."},
{d:1,q:"On ECAM, BLUE color identifies:",o:["Normal parameters","Actions to be carried out or limitations to apply","Failures","Titles"],a:1,e:"Blue lines = crew actions/limits; they turn white (cleared) as executed per ECAM handling."},
{d:2,q:"The amber STS reminder at the bottom of the E/WD indicates:",o:["A red warning pending","Status page content exists — review before approach","FWC failure","Stale data"],a:1,e:"STS flags that the STATUS page holds items (limitations/INOP SYS); it flashes at approach-preparation phase."},
{d:3,q:"A caution cancelled with EMER CANC can be reviewed by:",o:["It is gone forever","Holding RCL for about 3 seconds — CANCELLED CAUTION appears on STATUS","Cycling the FWC","Pressing CLR"],a:1,e:"EMER CANC inhibits for the flight, but RCL (3 s) recalls it and STATUS lists the cancellation."},
{d:2,q:"The ANN LT switch TEST position:",o:["Tests the batteries","Illuminates all annunciator lights to verify bulbs/LEDs","Runs the fire test","Dims the cockpit"],a:1,e:"Annunciator light test — distinct from system tests; DIM/BRT manage intensity."},
{d:2,q:"Windshields are:",o:["Simple tempered glass","Heated laminated assemblies certified for bird impact","Acrylic single pane","Unheated but hydrophobic"],a:1,e:"Multi-ply heated windshields meet bird-strike certification; side sliding windows complete the front set."},
{d:2,q:"The cockpit escape rope is stowed:",o:["Under the seats","Above the sliding windows","In the avionics bay","At the main door"],a:1,e:"After opening the sliding window, the rope provides descent to ground level in an evacuation."},
{d:1,q:"Lavatory and cabin waste servicing is performed:",o:["From the cabin","Through external service panels (aft)","Via the avionics bay","It is not required"],a:1,e:"External waste/water service panels support turnaround servicing without cabin access."},
{d:3,q:"RVSM airspace requires as minimum equipment:",o:["One altimeter","Two independent primary altimeters, one autopilot, altitude alerter and transponder","Triple ADIRU only","GPS"],a:1,e:"The RVSM package: dual primary altimetry, altitude-hold autopilot, alerter, and altitude-reporting transponder — MEL relief limited."},
{d:2,q:"CAT 3 DUAL versus CAT 3 SINGLE means:",o:["Two autopilots vs one engaged","Fail-operational vs fail-passive autoland capability","Two runways","Dual radio altimeters only"],a:1,e:"DUAL (fail-operational) continues the autoland after a single failure; SINGLE (fail-passive) requires go-around capability — DH limits differ."},
{d:2,q:"The reactive windshear warning is generated by:",o:["The weather radar","The FACs — red WINDSHEAR on PFD with triple aural","EGPWS","The FMGC"],a:1,e:"Reactive detection uses aircraft energy data (FAC); predictive windshear ahead of the aircraft comes from the radar."},
{d:2,q:"Predictive windshear alerts originate from:",o:["The FAC","The weather radar scanning ahead during takeoff/approach","The transponder","The GPWS"],a:1,e:"Radar-based PWS gives advisories/cautions/warnings with aural and ND indications before entering the shear."},
{d:1,q:"'PULL UP' warnings are generated by:",o:["The FWC alone","The (E)GPWS terrain protection","ATC","TCAS"],a:1,e:"(E)GPWS modes protect against terrain — Mode 1 excessive sink rate gives 'SINK RATE' then 'PULL UP'."},
{d:2,q:"GPWS Mode 1 protects against:",o:["Terrain closure","Excessive barometric sink rate near the ground","Glideslope deviation","Bank angle"],a:1,e:"Mode 1 monitors descent rate vs height: SINK RATE, escalating to PULL UP."},
{d:2,q:"The LDG FLAP 3 pushbutton is used to:",o:["Select flaps 3","Inhibit the GPWS 'TOO LOW FLAPS' alert when a CONF 3 landing is planned","Test the GPWS","Arm autobrake"],a:1,e:"Planning CONF 3? Press LDG FLAP 3 so the GPWS accepts the configuration without nuisance alerts."},
{d:2,q:"TCAS resolution advisories are displayed on:",o:["The ND only","The PFD vertical speed scale (green/red bands) with aural commands","The MCDU","The E/WD"],a:1,e:"RA guidance appears on the V/S scale: fly the green band, avoid the red — 'CLIMB', 'DESCEND', etc."},
{d:2,q:"The ATC/TCAS control panel is located:",o:["Overhead","On the pedestal","On the glareshield","Behind the F/O"],a:1,e:"Transponder code, mode and TCAS TA/RA selections are made on the pedestal panel."},
{d:2,q:"Cabin signs (seat belts / no smoking or no PED) are controlled from:",o:["The FAP only","Overhead panel switches (with AUTO logic where fitted)","The MCDU","They are automatic only"],a:1,e:"Overhead selectors command the signs; AUTO ties them to gear/flap/altitude logic on equipped aircraft."},
{d:2,q:"Cabin/crew communication uses:",o:["Only shouting distance","CIDS: PA, interphone and attendant panels (FAP/AAP)","VHF 3","ACARS"],a:1,e:"The Cabin Intercommunication Data System integrates PA, interphone, signs and cabin systems management."},
{d:2,q:"Weather radar controls and display are respectively on:",o:["Overhead / PFD","Pedestal / ND","Glareshield / SD","MCDU / E/WD"],a:1,e:"Radar panel on the pedestal; returns overlay the ND with gain/tilt management per SOP."},
{d:2,q:"Maximum certified altitude of the A320 is:",o:["FL350","FL390 (FL398 some variants)","FL410","FL450"],a:1,e:"39,000–39,800 ft depending on variant — matches the APU electrical envelope discussion. Verify GLG value."},
{d:3,q:"After an ECAM warning, the sequence 'analyze SD page → STATUS' is delayed until:",o:["Immediately always","All required blue actions on the E/WD are completed and cleared","After landing","The FWC resets"],a:1,e:"Discipline: actions first, then system page analysis when CLR steps forward, finishing with STATUS — never jump ahead."},
{d:3,q:"During LDG INHIBIT phase, warnings are inhibited between approximately:",o:["1,500 ft and touchdown","800 ft and 80 kt on rollout","2,000 ft and 60 kt","Glide capture and taxi"],a:1,e:"Landing inhibition spans ~800 ft RA to 80 kt ground — protecting the flare/rollout from distraction. Verify FCOM phase table."},
{d:1,q:"The pitch trim wheels are located:",o:["Overhead","On each side of the pedestal thrust quadrant","On the glareshield","On the sidestick"],a:1,e:"Two interconnected wheels flank the pedestal — mechanical THS access for trim setting and backup."},
{d:2,q:"Emergency lighting in the cabin is powered by:",o:["Main AC only","Independent battery packs ensuring exit path illumination","The APU","Hot buses only"],a:1,e:"Self-contained batteries keep exit signs/floor path lighting alive independent of aircraft power; EMER EXIT LT switch arms it."},
{d:1,q:"The EMER EXIT LT selector should be positioned for flight:",o:["OFF","ARM","ON","TEST"],a:1,e:"ARM lets emergency lighting trigger automatically on power loss; ON is manual activation."},
{d:2,q:"Flight deck emergency equipment includes all EXCEPT:",o:["Fire extinguisher and crash axe","Flashlights and life vests","PBE smoke hood","A spare IDG"],a:3,e:"No spare hardware onboard. Extinguisher, axe/crowbar, PBE, flashlights, vests and gloves are the standard kit."},
{d:2,q:"Sliding window opening in flight is:",o:["Routine for ventilation","Not possible against cabin differential pressure","Automatic in smoke","Recommended below 10,000 ft"],a:1,e:"With cabin pressurized, differential force prevents opening — usable on ground/unpressurized only."},
{d:3,q:"The FWC receives flight phase data primarily to:",o:["Drive the autopilot","Tailor warnings/memos and inhibits to the operational phase","Compute V speeds","Set cabin pressure"],a:1,e:"Phase awareness (10 phases) is the backbone of warning relevance: same failure, different presentation by phase."},
{d:2,q:"An amber cross (X) over an ECAM parameter means:",o:["Value excessive","Invalid/failed data from the sensor or computer","Maintenance item","Advisory pulse"],a:1,e:"Amber crosses replace unreliable data — distinguish failed indication from failed system."},
{d:3,q:"If E/WD and SD both fail (dual ECAM screens), engine data:",o:["Is lost","Can be recovered on an ND via the ECAM/ND XFR selector","Shows on the PFD automatically","Only on standby instruments"],a:1,e:"The transfer selector redisplays ECAM imagery on a navigation display — keep primary engine parameters visible."},
{d:2,q:"Semi-automatic ECAM page calls occur when:",o:["Never","A system page relevant to a detected advisory/failure displays without pilot action","The pilot presses ALL","In cruise only"],a:1,e:"Auto page-calling directs attention: advisory pulses call the page; failures call it as part of the warning."},
{d:1,q:"The aircraft is certified for how many flight crew (minimum)?",o:["1","2","3","2 + engineer"],a:1,e:"Two-pilot certified cockpit; automation and ECAM philosophy are built around two-crew operation."}
);

BANK.ELEC.push(
{d:2,q:"The GCU (Generator Control Unit) of each generator provides:",o:["Only frequency display","Voltage regulation, protection functions and line contactor control","Battery charging","IDG cooling"],a:1,e:"Each GCU regulates output, trips protections (over/under voltage and frequency, differential) and commands its contactor."},
{d:2,q:"External power supplies the aircraft only when:",o:["Plugged in (AVAIL)","The EXT PWR pb is pressed ON (blue ON light)","The batteries are off","The APU is off"],a:1,e:"AVAIL means ready; the crew must select ON for the external contactor to close and feed the buses."},
{d:3,q:"With EXT PWR showing AVAIL (not ON) and APU GEN running, the buses are fed by:",o:["External power","The APU generator","The batteries","Nothing"],a:1,e:"Unselected external power feeds nothing — the running APU GEN takes the network."},
{d:2,q:"The Bus Tie Contactors (BTC) function is to:",o:["Parallel generators","Automatically route an available source to a bus whose normal source failed","Isolate the batteries","Feed the galleys"],a:1,e:"BTCs interconnect AC BUS 1/2 through the tie bus so one source (GEN, APU, EXT) can carry both sides — one at a time."},
{d:2,q:"BUS TIE pb OFF results in:",o:["Total blackout","Isolation of the two AC sides — used in specific abnormal procedures","Battery operation","APU start"],a:1,e:"Opening the ties separates the network halves (e.g., smoke/electrical fault isolation drills)."},
{d:2,q:"The ECAM ELEC page displays for each generator:",o:["Only ON/OFF","Load percentage, voltage and frequency","Oil quantity","kVA rating placard"],a:1,e:"Load %, V and Hz per source — plus battery volts/amps and TR parameters: your electrical health snapshot."},
{d:3,q:"The battery contactors open automatically:",o:["Never","When charging is complete (charge current logic), leaving batteries floating off the bus","At engine start","On ground only"],a:1,e:"The Battery Charge Limiters cycle the contactors: connect to charge, disconnect when charged — normal to see them open in flight."},
{d:2,q:"The GALY & CAB pushbutton allows:",o:["Testing galleys","Manual shedding of galley/commercial loads","Cabin lighting control","Ground service power"],a:1,e:"Crew can shed comfort loads manually; automatic shed also occurs in single-generator operation."},
{d:3,q:"Automatic galley shedding occurs when:",o:["Both gens run","A single generator supplies the entire AC network","EXT PWR is used","The APU starts"],a:1,e:"One source for everything = shed the galleys to protect capacity for essential loads."},
{d:2,q:"An IDG FAULT amber light indicates:",o:["Generator offline","IDG oil outlet overheat or low pressure — ECAM may command disconnection","Low fuel","GCU failure"],a:1,e:"IDG mechanical distress: follow ECAM; disconnection (guarded pb, <3 s) prevents drive destruction."},
{d:2,q:"A GEN FAULT reset is attempted by:",o:["Pulling a breaker","Cycling the GEN pb OFF then ON per procedure","Pressing EMER CANC","Disconnecting the IDG"],a:1,e:"One reset attempt (conditions per QRH); if the GCU protection re-trips, the generator stays off."},
{d:3,q:"Generator protective trips include all EXCEPT:",o:["Over/under voltage","Over/under frequency","Differential (feeder) fault","High cabin altitude"],a:3,e:"Cabin data is irrelevant to the GCU. Electrical parameter and feeder-fault protections open the line contactor."},
{d:2,q:"When a TR fails:",o:["Both DC buses die","Its contactor opens and the remaining TR feeds both DC buses through the DC tie","The batteries take over instantly","AC is lost"],a:1,e:"DC network reconfigures automatically: one TR can carry DC1+DC2+DC BAT within its 200 A rating."},
{d:3,q:"If DC BUS 1 fails, the DC BAT BUS is:",o:["Lost","Automatically fed from DC BUS 2","Fed by the static inverter","Unpowered until landing"],a:1,e:"Reconfiguration logic swaps the DC BAT bus supply to the healthy side."},
{d:3,q:"The ESS TR receives its input power from:",o:["DC BUS 1","The AC ESS bus (emergency generator in EMER config)","The batteries","TR 2"],a:1,e:"ESS TR converts AC ESS power to DC ESS when the normal path fails — in EMER ELEC that AC comes from the CSM/G."},
{d:2,q:"DC ESS BUS in normal configuration is supplied by:",o:["The ESS TR","DC BUS 1 (with ESS TR as backup path)","Battery 1","The static inverter"],a:1,e:"Normal feed from DC 1; failures reroute via the ESS TR — layered redundancy for essential DC."},
{d:3,q:"With TR1 and TR2 both failed:",o:["All DC is lost","The ESS TR keeps DC ESS alive; non-essential DC buses are lost","Batteries feed everything indefinitely","Nothing changes"],a:1,e:"Dual TR loss reduces you to essential DC via the ESS TR — expect significant equipment loss per STATUS."},
{d:2,q:"The static inverter activates automatically when:",o:["Any generator fails","The aircraft is on batteries only in flight","EXT PWR connects","The APU runs"],a:1,e:"Batteries-only flight: BAT 1 feeds the inverter to keep AC ESS alive until the emergency generator comes online."},
{d:2,q:"The EMER ELEC PWR overhead panel contains:",o:["Battery switches","RAT & EMER GEN fault light and MAN ON pushbutton, plus EMER GEN TEST","GEN 1/2 pbs","TR resets"],a:1,e:"Emergency generation controls live on their own overhead section — know it for the EMER ELEC drill."},
{d:3,q:"In EMER ELEC CONFIG, the available cockpit displays are:",o:["All six","Captain PFD + ND and upper ECAM (E/WD)","F/O side only","Standby only"],a:1,e:"Essential-bus displays: captain's pair and the E/WD — the F/O side and SD go dark."},
{d:3,q:"Dual generator failure with both engines RUNNING means hydraulics are:",o:["Lost","Normal — the engine-driven pumps are mechanical and keep all pressures","Blue only","On RAT"],a:1,e:"Key distinction: EDPs need rotation, not electricity. EMER ELEC ≠ hydraulic emergency unless engines also fail."},
{d:2,q:"A monitored (green-collared) circuit breaker trip generates:",o:["Nothing","An ECAM 'C/B TRIPPED' caution identifying the breaker","A red warning","Automatic reset"],a:1,e:"Monitored C/Bs report to ECAM; unmonitored ones require panel scan — part of the abnormal toolkit."},
{d:3,q:"In-flight circuit breaker reset policy:",o:["Reset anything once","Only if the Captain judges it necessary for safe flight — and NEVER fuel pump C/Bs","Reset twice with 1 min interval","Prohibited entirely"],a:1,e:"A tripped breaker did its job. Fuel pump C/Bs are never reset (arc/ignition risk in tanks) — a hard rule."},
{d:2,q:"During APU battery start, the ECAM ELEC page typically shows:",o:["Nothing unusual","High battery discharge current while the starter cranks, then charging current after","Zero amps","TR overload"],a:1,e:"The DC starter draws heavily; post-start you verify the batteries recover into charge — confirming system health."},
{d:2,q:"The A320 electrical network philosophy is:",o:["Fully paralleled","Two independent split halves (side 1 / side 2) tied only when needed","Single bus","DC primary"],a:1,e:"Split design: each engine generator owns a side; ties reconfigure on failure — simplicity and fault isolation."},
{d:3,q:"Why are AC sources never paralleled on the A320?",o:["Frequency cannot match","Design simplicity and fault isolation — contactor logic guarantees one source per bus","Certification forbids AC","IDGs are DC machines"],a:1,e:"No paralleling avoids load-sharing complexity and isolates faults cleanly — a deliberate architecture choice."},
{d:2,q:"HOT BUS 1 and HOT BUS 2 are:",o:["Shed buses","Buses permanently connected to their batteries, powering selected services at all times","Ground-only buses","AC buses"],a:1,e:"Direct battery buses keep vital/standby items alive with the aircraft dark (e.g., APU fire protection elements, parking brake related services)."},
{d:2,q:"Refueling with the aircraft otherwise unpowered is possible because:",o:["It is not possible","The refuel panel can be powered from the battery hot bus","The fuel truck powers it","Gravity only"],a:1,e:"Hot-bus supply enables refuel panel operation without full aircraft power — verify GLG ground procedures."},
{d:2,q:"AC BUS 1 and AC BUS 2 supply respectively:",o:["TR2 and TR1","TR1 and TR2","Both TRs from AC 1","The ESS TR"],a:1,e:"Straight mapping: each AC side feeds its own TR — which is why an AC bus loss cascades into its DC side."},
{d:3,q:"Loss of AC BUS 1 (with AC ESS FEED action) implies losing:",o:["Nothing","TR1 and DC BUS 1 normal feeds, with reconfigurations recovering essentials","All DC power","The APU"],a:1,e:"Follow the chain: AC1 → TR1 → DC1. Ties and AC ESS FEED recover the essential paths — trace this chain for the oral."},
{d:2,q:"In EMER ELEC configuration, radios available include:",o:["None","VHF 1 (essential-powered) at least","All VHF/HF","Only SATCOM"],a:1,e:"Essential buses keep VHF1 and core comms alive — you can still talk while managing the emergency."},
{d:3,q:"Autopilot availability in EMER ELEC CONFIG:",o:["AP1 available","Autopilots are lost — manual flight on remaining instruments","AP2 only","Both APs available"],a:1,e:"AP computers/servos are not essential-bus customers: expect hand flying, typically in a degraded law."},
{d:3,q:"EMER ELEC CONFIG carries which STATUS classification?",o:["LAND ASAP amber","LAND ASAP red","No classification","CAT 1 only note"],a:1,e:"Red LAND ASAP: land at the nearest suitable airport — battery endurance backs the urgency."},
{d:2,q:"The ELEC page indicates power flow by:",o:["Numbers only","Green connection lines/arrows between sources and buses","Sound","Flashing labels"],a:1,e:"Reading the lines tells you instantly which source feeds which bus — train systematic ELEC page scans."},
{d:2,q:"The GND SVC (ground service) bus concept allows:",o:["Full aircraft power","Powering cabin cleaning/service loads from EXT PWR without energizing the whole network","APU-less flight","Battery charging only"],a:1,e:"A cabin switch routes external power to service loads only — verify the GLG aircraft fit for this feature."},
{d:2,q:"The generator line contactor (GLC) opens:",o:["Only manually","On GCU protection trip or pb OFF, removing the generator from its bus","At every landing","When the IDG disconnects"],a:1,e:"Contactor = the switch; GCU = the brain. Protections or crew selection open the GLC."},
{d:3,q:"Pressing EXT PWR ON with both engine generators online:",o:["Transfers the buses to EXT","Does not take over the buses — own-generator priority is higher than external power","Trips both gens","Damages the GPU"],a:1,e:"Priority logic keeps each bus on its engine generator; EXT waits below in the hierarchy."},
{d:2,q:"If GEN 1 fails in flight with the APU running and APU GEN available:",o:["EMER ELEC config","AC BUS 1 is recovered automatically via the APU generator through the tie","Manual switching required","AC1 stays dead"],a:1,e:"Automatic reconfiguration: the APU GEN picks up the failed side — the reason to start the APU early in electrical doubts."},
{d:2,q:"The BCL (Battery Charge Limiter) monitors:",o:["Generator load","Battery charging current/voltage and contactor control, with overheat protection","TR temperature","IDG oil"],a:1,e:"Each battery's BCL manages its contactor and protects against overcharge conditions."},
{d:2,q:"Cockpit electrical panel arrangement: the ELEC panel is located:",o:["On the pedestal","On the overhead panel, center area","Behind the Captain","On the glareshield"],a:1,e:"Overhead center: BAT, GEN, TR-related, EXT PWR, APU GEN, BUS TIE, AC ESS FEED, GALY & CAB, IDG."},
{d:3,q:"Which battery feeds the static inverter?",o:["Battery 2","Battery 1","Both in parallel","Either automatically"],a:1,e:"BAT 1 is wired to the static inverter — a fixed assignment worth remembering for the emergency diagram."},
{d:2,q:"ELEC page battery information appears:",o:["Always with amps","Voltage always; current/arrows when the battery contactor is closed","Only on ground","Never"],a:1,e:"Open contactor = voltage only; closed = charge/discharge current shown with flow indication."},
{d:2,q:"The external power receptacle is located:",o:["At the tail","Near the nose landing gear area","Under the right wing","On the APU"],a:1,e:"Forward lower fuselage by the nose gear — with the physical AVAIL indications at the receptacle panel."},
{d:3,q:"A single BTC failure means:",o:["Total tie loss","The affected side cannot receive tie-bus power — its own sources must carry it","Automatic EMER ELEC","Nothing"],a:1,e:"Tie redundancy is per-side: plan source management knowing which side lost its tie path."},
{d:2,q:"Generator load indications should normally be:",o:["Above 100%","Below 100% of rated load with brief transient allowances","Exactly 50%","Zero in cruise"],a:1,e:"Monitor loads on the ELEC page; sustained overload triggers shedding/protection logic."},
{d:2,q:"The IDG disconnect pushbutton is:",o:["Unguarded white","Guarded red, momentary — engine running/windmilling required","On the pedestal","Software only"],a:1,e:"Guard against inadvertent irreversible disconnection; press ≤3 s per FCOM."},
{d:3,q:"The emergency generator supplies which buses?",o:["All AC","AC ESS (and DC ESS via the ESS TR); SHED portions remain shed","AC 1 only","DC BAT only"],a:1,e:"CSM/G output covers the essential AC network, converted for essential DC — SHED sub-buses stay off in EMER config."},
{d:3,q:"During RAT deployment transition (before emergency generator coupling), power comes from:",o:["Nothing","The batteries (with static inverter for AC ESS)","TR1","APU"],a:1,e:"A brief battery-bridged gap covers RAT spin-up — displays may blink; the system recovers automatically."},
{d:2,q:"ELECTRICAL smoke/fault isolation procedures may use:",o:["Random breaker pulls","Structured source isolation (e.g., GEN 1 LINE, bus splits) per QRH sequence","Immediate battery off","Nothing available"],a:1,e:"The smoke/elec drill isolates halves methodically to find the source — never improvise the sequence."},
{d:2,q:"After electrical transients (source switching), many systems:",o:["Fail permanently","Self-recover; some computers may need resets per QRH","Require maintenance airborne","Ignore transients"],a:1,e:"Contactor switching causes brief interruptions; know which systems auto-recover and which need crew resets."},
{d:3,q:"Battery-only endurance design target and its operational implication:",o:["Unlimited — no rush","≈30 minutes: in EMER ELEC start the APU if able and plan an expeditious approach","5 minutes","24 hours"],a:1,e:"The clock matters: restore a generator (APU) or be on the ground within the battery design window. Verify GLG figure."},
{d:2,q:"AC ESS FEED pb FAULT light illuminates when:",o:["Bus tie open","The AC ESS BUS is not electrically supplied","Galley shed","EXT PWR available"],a:1,e:"FAULT = essential AC unpowered — act (feed transfer) before essential-equipment losses cascade."},
{d:2,q:"Which loads are typical AC ESS customers?",o:["Galleys","Captain instruments, essential comms/nav items","Cargo heating","Wipers only"],a:1,e:"Essential = what you need to fly/communicate: captain side EFIS, core radios/nav — the design logic of the ESS network."},
{d:3,q:"GEN 1 LINE pb OFF while GEN 1 keeps running is useful because:",o:["It saves fuel","GEN 1 remains available for immediate reconnection while isolated from a suspected smoke source","The IDG cools","It parallels sources"],a:1,e:"Isolation without shutdown: reversible step in the smoke drill — contrast with IDG disconnect (irreversible)."},
{d:2,q:"TR parameters visible on the ELEC page include:",o:["Oil temp","Voltage and current per TR","Frequency","kVA"],a:1,e:"DC side monitoring: TR volts/amps confirm rectifier health and load sharing after reconfigurations."},
{d:2,q:"On battery start of the APU at night, expect:",o:["No visible effect","Momentary lighting/display dips from starter current draw","Total blackout","EXT PWR auto-connect"],a:1,e:"Normal transient from heavy DC draw — anticipate it so it doesn't surprise you on a dark ramp."},
{d:3,q:"The design reason batteries connect for APU start even with EXT PWR available can be:",o:["They never do","Start assurance logic per aircraft standard (battery-assisted APU start scheme) — verify GLG aircraft behavior","EXT PWR cannot make DC","APU uses AC start"],a:1,e:"APU start power schemes vary by standard (battery vs TR-assisted). Confirm your aircraft's logic in the GLG FCOM."},
{d:2,q:"Loss of both batteries in flight (contactors open, batteries failed):",o:["No effect ever","Normal generation continues, but emergency backup depth is reduced — treat per ECAM/QRH","Immediate EMER ELEC","APU cannot run"],a:1,e:"Batteries are the last-resort layer: generation is unaffected now, resilience later is what you lost."},
{d:2,q:"Ground mechanics ask to apply external power: correct crew sequence includes:",o:["BAT off first always","Verify AVAIL, then EXT PWR ON, monitoring ELEC page configuration","Start APU first mandatorily","Pull TR breakers"],a:1,e:"Standard flow: confirm source quality (AVAIL), select ON, verify bus transfer on the ELEC page."},
{d:3,q:"Which failure produces the 'chain': AC1 lost → TR1 lost → DC1 lost → DC BAT refeed from DC2?",o:["GEN 2 failure","Unrecovered loss of AC BUS 1","Battery 1 failure","Static inverter failure"],a:1,e:"Bus-dependency chains are prime oral material: walk each network layer from the failed AC side downward."},
{d:2,q:"The purpose of splitting captain/F.O. equipment across sides 1/2 is:",o:["Weight balance","Ensuring a single-side electrical failure leaves one pilot's core instruments powered","Cost reduction","Cooling symmetry"],a:1,e:"Side segregation guarantees residual capability: one bus failure never blinds both pilots."},
{d:2,q:"APU GEN pb FAULT illuminates when:",o:["APU running normally","The APU GCU trips a protection with APU running","EXT PWR available","Bleed on"],a:1,e:"Same protection philosophy as main gens, applied by the APU's control unit."},
