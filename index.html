{d:3,q:"Center tank pumps (ceo, MODE SEL AUTO) are inhibited when:",o:["Never","Slats are extended (takeoff/landing configuration logic)","Above FL250","Crossfeed open"],a:1,e:"Keeps wing-fed configuration for takeoff; center feeding resumes after slat retraction. Verify GLG standard."},
{d:2,q:"The MODE SEL pushbutton (fuel panel) in MAN:",o:["Shuts pumps","Disables automatic center pump logic — crew manages center pumps","Opens crossfeed","Transfers outer fuel"],a:1,e:"Manual mode per procedures; FAULT shows auto logic issues."},
{d:2,q:"The crossfeed system consists of:",o:["Two valves","A single crossfeed valve connecting left/right feed lines (X FEED pb)","Gravity ports","No crossfeed"],a:1,e:"One valve balances/isolates sides — the core of fuel imbalance and engine-out feeding drills."},
{d:3,q:"Outer wing cell fuel transfers to the inner cell when:",o:["Pilot selects","Inner cell fuel drops to ~750 kg — intercell transfer valves open (both wings)","Center empties","Crossfeed opens"],a:1,e:"Automatic gravity transfer keeps wing bending relief until late in flight; valves latch open."},
{d:2,q:"Fuel quantity indication is provided by:",o:["Float gauges","The FQI system (capacitance probes) on ECAM FUEL page/E-WD","Sight glasses","Dipsticks only"],a:1,e:"FQI computes mass per tank; magnetic level indicators under-wing serve as ground backup."},
{d:2,q:"Magnetic Level Indicators (MLI) are used:",o:["In flight","On ground to manually verify tank quantities (dripless sticks)","For temperature","Never"],a:1,e:"Manual measurement with attitude/density corrections — degraded FQI dispatch tool."},
{d:2,q:"LO LVL warning triggers at approximately:",o:["1,500 kg per wing","750 kg in a wing tank (feed cell)","Zero fuel","3,000 kg total"],a:1,e:"Low level = land soon mentality; check crossfeed/pump configuration per ECAM. Verify GLG value."},
{d:3,q:"Fuel imbalance limitation between wing tanks is approximately:",o:["No limit","~1,500 kg class (FCOM value — verify GLG); procedure balances via crossfeed","5,000 kg","150 kg"],a:1,e:"Lateral balance protects handling/structure; open X FEED, off pumps on light side per QRH."},
{d:2,q:"Engine feed in normal operation is:",o:["Crossfed always","Tank-to-engine (left wing→ENG1, right wing→ENG2), crossfeed closed","Center to both directly","Gravity"],a:1,e:"Split feed isolates problems; crossfeed opens only on procedure."},
{d:2,q:"If all pumps in a wing tank fail:",o:["Engine flames out","Gravity feeding sustains the engine within envelope limits (ceiling considerations)","Crossfeed mandatory","Fuel unusable"],a:1,e:"Suction feed works at lower altitudes — QRH gives the gravity-feed ceiling."},
{d:2,q:"The APU normally receives fuel from:",o:["Right side","The left feed line (with its own pump if boost pressure absent)","Center only","Dedicated tank"],a:1,e:"APU fuel pump runs automatically when main pump pressure is unavailable."},
{d:2,q:"IDG cooling relates to fuel because:",o:["It doesn't","IDG oil heat is rejected into fuel; the return system sends warmed fuel to the outer cells","Fuel cools cabin","Pumps heat oil"],a:1,e:"Fuel return valve recirculates heated fuel — explains outer tank quantity/temp behavior."},
{d:3,q:"Minimum fuel temperature limit (JET A1) is approximately:",o:["-30 °C","-43 °C class (fuel freeze margin) — verify GLG FCOM","-60 °C","0 °C"],a:1,e:"Cold soak on long flights: monitor fuel temp; speed/altitude changes warm it."},
{d:2,q:"Maximum fuel temperature limit is approximately:",o:["No limit","+54 °C class per FCOM (verify GLG)","+100 °C","+30 °C"],a:1,e:"Hot climates + returned IDG heat drive the upper limit — outer tank monitored."},
{d:2,q:"The refuel/defuel panel is located:",o:["Cockpit","Under the right wing (fuselage fairing area)","Tail","Left gear bay"],a:1,e:"External panel with preselection and quantity display; battery/hot-bus powered capability."},
{d:2,q:"Overwing gravity refueling:",o:["Impossible","Possible via overwing caps (slower, wing tanks only)","Standard method","Center tank only"],a:1,e:"Backup refuel path when pressure refueling is unavailable."},
{d:2,q:"Fuel venting is via:",o:["Cabin","Surge tanks and NACA vent intakes at wingtips","Engine pylons","Outflow valve"],a:1,e:"Vent system equalizes pressure and captures expansion overflow."},
{d:2,q:"The FUEL SD page shows:",o:["Only totals","Pump status, valve positions, quantities per tank, fuel used, temperatures","Fuel price","Engine oil"],a:1,e:"Full system picture — crosscheck F.USED+FOB coherence against flight plan."},
{d:3,q:"FOB + F.USED significantly less than block fuel suggests:",o:["Normal burn","A possible leak — apply the FUEL LEAK QRH procedure (do NOT open crossfeed blindly)","FQI drift only","Wind effect"],a:1,e:"The leak drill isolates before crossfeeding — opening X FEED into a leaking side loses everything."},
{d:2,q:"The engine LP fuel valve closes with:",o:["MODE SEL","The ENG MASTER lever OFF or the ENG FIRE pushbutton","Crossfeed","Pump off"],a:1,e:"Two closure paths: normal shutdown and fire isolation."},
{d:2,q:"Wing tank pump FAULT light indicates:",o:["Pump on","Low output pressure (or inhibit state per logic)","Full tank","Valve closed"],a:1,e:"Pressure-based fault detection; ECAM guides pump management."},
{d:2,q:"Fuel used (F.USED) is computed from:",o:["FQI decrease","Engine flow meters integration per engine","Flight plan","FADEC guess"],a:1,e:"Flow integration is leak-detection gold when compared with FQI quantities."},
{d:2,q:"Jettison capability on the A320:",o:["Standard","Not fitted — overweight landing per QRH instead","Center only","Via vents"],a:1,e:"No fuel dumping: overweight landing procedures/inspection cover the case."},
{d:2,q:"Refueling with passengers boarding/onboard requires:",o:["Nothing","Company/regulatory precautions (attendant readiness, no-smoking, communication)","Is prohibited always","Engines running"],a:1,e:"Fueling with pax rules per GLG ops manual — systems + procedure awareness."},
{d:3,q:"Center tank fuel with pumps failed is:",o:["Usable by gravity","Unusable in flight by gravity into the feed line (center sits below wing gravity path) — treat per ECAM/QRH","Automatically transferred","Jettisoned"],a:1,e:"Center fuel needs pump pressure — failed center pumps may strand that fuel; plan range accordingly."},
{d:2,q:"Fuel density variations affect:",o:["Nothing","Mass vs volume relationships in refuel computations (FQI reads mass)","Only temperature","Engine thrust directly"],a:1,e:"Uplift arithmetic uses density — a dispatch/refueling crosscheck skill."},
{d:2,q:"X FEED valve indication on the FUEL page:",o:["Hidden","In-line green when open per valve symbology; crossfeed pb ON light","Amber always","Not shown"],a:1,e:"Valve symbols follow ECAM convention: in-line = open flow path."},
{d:2,q:"Engine-out fuel management typically involves:",o:["Nothing","Crossfeed opening to feed the live engine from both sides and maintain balance per QRH","Immediate dumping","Center transfer"],a:1,e:"Single-engine drills include crossfeed configuration — balance and endurance management."},
{d:2,q:"Fuel sample/water drain points exist because:",o:["Decoration","Water accumulates at tank low points — drained per maintenance schedule","Fuel is filtered there","Venting"],a:1,e:"Water contamination control — microbial growth and icing prevention."},
{d:2,q:"Wing tank fuel provides structural benefit as:",o:["None","Wing bending relief (fuel mass counteracts lift bending) — reason outer cells empty last","Ballast for CG only","Noise damping"],a:1,e:"The sequencing logic is structural, not arbitrary — a favorite oral 'why' question."},
{d:2,q:"Fuel temperature indications on ECAM show:",o:["Center only","Wing tank temperatures (outer relevant for IDG return heat/cold soak)","Fuel line temps","Engine fuel temp only"],a:1,e:"Tank temps bound both cold and hot limits — monitored on long/hot sectors."},
{d:3,q:"After landing with center fuel remaining and slats out, center pumps:",o:["Run","Remain inhibited (AUTO logic) — quantity stays until logic re-enables","Empty the tank","Transfer to wings"],a:1,e:"Slat-linked inhibit persists; understand why center fuel 'freezes' during approach/taxi."},
{d:2,q:"Refuel preselection works by:",o:["Guessing","Setting desired total on the panel; automatic shutoff at target distribution","Manual timing","Cockpit MCDU only"],a:1,e:"Auto-distribution fills wings/center per schedule to the preselected mass."},
{d:2,q:"A fuel pump running dry (empty tank):",o:["Is fine","Should be switched off per procedure (cooling/lubrication by fuel)","Self-protects forever","Speeds transfer"],a:1,e:"Pumps are fuel-cooled: ECAM directs pump OFF at empty-tank logic."},
{d:2,q:"The fuel system's role in ETOPS-style diversions (long single-engine) emphasizes:",o:["Nothing special","Crossfeed integrity and gravity-feed ceilings knowledge","Jettison","Center pumps"],a:1,e:"Failure-mode fuel feeding underpins diversion planning — systems knowledge with operational payoff."},
{d:2,q:"Fuel filters/heat management on the engine side include:",o:["None","Fuel heated by engine oil (FOHE) preventing filter icing","Electric heaters","Bleed heating"],a:1,e:"Fuel/oil heat exchange kills two birds: cools oil, warms fuel."},
{d:3,q:"Suspected fuel leak from an engine/pylon: the QRH may direct:",o:["Open crossfeed","Engine shutdown to isolate, and specific valve/pump configuration — never feed a leak","Faster cruise","Ignore if FOB high"],a:1,e:"Leak isolation logic: identify side, isolate, protect remaining fuel — sequence discipline saves the day."},
{d:2,q:"Minimum takeoff fuel consideration includes:",o:["FQI only","Flight plan reserves per regulations + company policy (extra, taxi, contingency)","Whatever fits","Center full always"],a:1,e:"Dispatch fuel arithmetic — systems provide the numbers; ops rules set the minima."},
{d:2,q:"Fuel pump pb OFF with white OFF light means:",o:["Fault","Crew-selected off (procedure/empty tank)","Pump running","Valve closed"],a:1,e:"White = configuration memo; amber FAULT = detected problem — panel color language."},
{d:2,q:"Which tank feeds during a normal takeoff (ceo AUTO)?",o:["Center","Wing tanks (center pumps inhibited with slats out)","Both equally","Outer cells"],a:1,e:"Wing-fed takeoff by design — center resumes after cleanup."},
{d:2,q:"Total fuel flow (FF) indication comes from:",o:["FQI","FADEC fuel metering data per engine","Pump pressure","Tank sensors"],a:1,e:"Engine-measured flow displayed on E/WD — basis of F.USED."},
{d:3,q:"Fuel quantity 'unusable' means:",o:["Reserve fuel","Fuel that cannot reach pumps in normal attitudes — excluded from usable figures","Frozen fuel","Vent losses"],a:1,e:"Certified unusable quantities exist per tank geometry — FQI shows usable."},
{d:2,q:"Wing tank overfull/expansion space is handled by:",o:["Spilling on ramp","Surge tank capture with return, vent system relief","Cabin venting","Burning first"],a:1,e:"2% expansion space + surge design prevents thermal spill."},
{d:2,q:"Defueling/transfer on ground uses:",o:["Buckets","The refuel panel modes and suction via fuel truck through the same coupling","Engines","APU burn"],a:1,e:"Defuel/transfer procedures are maintenance/refueler tasks via the pressure coupling."},
{d:2,q:"An accurate one-line description of ceo fuel automation:",o:["Fully manual","Set pumps ON + AUTO; the system sequences center→wings and outer→inner without crew action","Computer-scheduled CG transfer","Continuous crossfeed"],a:1,e:"(No trim tank on A320.) Normal ops = monitor only; abnormalities bring the crew in."},
{d:2,q:"Fuel checks during cruise per SOP:",o:["None","Periodic FOB vs plan, balance, temperature monitoring","Only at TOD","FQI reset"],a:1,e:"The recurring fuel scan catches leaks/imbalance early — habit pattern for the oral."},
{d:3,q:"Wing gravity feed ceiling exists because:",o:["Regulations","Boost-pump-less feed relies on tank head/suction limits — altitude reduces margins (vapor)","Fuel freezes above","Crossfeed limits"],a:1,e:"QRH gravity ceiling reflects vapor pressure physics — descend to sustain feed."},
{d:2,q:"After refueling, the crew verifies:",o:["Nothing","FQI totals vs uplift arithmetic and distribution symmetry","Only paperwork","Vent closure"],a:1,e:"Uplift × density crosscheck against FQI — dispatch discipline."},
{d:2,q:"Fuel-related items in the ENG FIRE pb press include:",o:["Pump start","LP fuel valve closure for that engine","Crossfeed opening","Center isolation"],a:1,e:"Fire isolation cuts fuel at the wing root valve — dual-path (fire pb/master) closure architecture."},
{d:2,q:"Fuel imbalance with crossfeed stuck closed leads to:",o:["Nothing","Managing imbalance by burn scheduling/pump selection per QRH within limits","Landing prohibited","Automatic fix"],a:1,e:"Degraded balancing strategies exist — know the limitation values you must respect."},
{d:2,q:"The A320 center tank location is:",o:["In the fin","Wing center box between the main gear bays area","Under cockpit","Aft hold"],a:1,e:"Center box structure houses it — explains its pump-fed (not gravity) nature."},
{d:2,q:"Sequencing question: with 2,000 kg center + full wings at cleanup, which pumps feed?",o:["Wings","Center pumps (higher pressure) after slat retraction — center first","Outer transfer","APU pump"],a:1,e:"Post-cleanup the center resumes priority until empty, then wings feed."},
{d:2,q:"'FUEL X FEED' amber in flight without selection indicates:",o:["Normal","Valve position disagree/fault — QRH analysis","Leak confirmed","FQI failure"],a:1,e:"Valve disagreement logic — treat as system fault, review feeding configuration."},
{d:2,q:"Fuel planning figure most oral examiners expect fluently:",o:["Tank paint scheme","Total capacity, LO LVL value, imbalance limit and gravity ceiling — with 'verify GLG FCOM' framing","Pump part numbers","Refuel truck flow"],a:1,e:"Four numbers + source discipline = a professional fuel-system answer."},
{d:2,q:"With both center pumps FAULT and center fuel aboard:",o:["No consequence","Range/endurance reduces by stranded center fuel — replan per ECAM/QRH","Fuel transfers by vent","Land immediately always"],a:1,e:"Treat stranded fuel as unusable in planning — the operational translation of the failure."},
{d:2,q:"Fuel temperature rises in the outer cells during flight mainly due to:",o:["Sun","IDG/return system heat rejection","Engine proximity","Compression"],a:1,e:"Recirculation warms outers — also the tank watched for the max-temp limit."},
{d:2,q:"Vapor lock risk is minimized by:",o:["Cold fuel only","Boost pump pressure feeding and reservoir/collector cell design","High altitude","Crossfeed"],a:1,e:"Pressurized feed suppresses vapor formation — why pump losses matter at altitude."},
{d:2,q:"The collector/feed compartments inside wing tanks ensure:",o:["Nothing","Pump inlets stay submerged during maneuvers/attitudes","Faster refuel","CG shift"],a:1,e:"Baffled feed areas guarantee supply during dynamic maneuvers."},
{d:2,q:"Refuel panel power without aircraft electrics:",o:["Impossible","Available via hot bus/battery per design — verify GLG procedure","Requires APU","Solar"],a:1,e:"Turnaround flexibility: fueling on batteries per ground procedures."},
{d:2,q:"'GRVTY FEED' style memo/status implies:",o:["Better economy","Pumps unavailable — altitude restrictions apply per QRH","Center feeding","Leak"],a:1,e:"Status vocabulary → operational restriction linkage."},
{d:2,q:"A wise close for any fuel oral answer:",o:["Quoting Wikipedia","'…values per our GLG FCOM; I verify against the QRH before applying' ","'Approximately, I think'","Silence"],a:1,e:"Source discipline is scored: numbers + authority citation."}

{d:2,q:"Air conditioning zones on the A320 are:",o:["One zone","Cockpit, forward cabin, aft cabin (3 zones)","Five zones","Two zones"],a:1,e:"Three independently temperature-controlled zones via trim air."},

{d:2,q:"Recirculation fans:",o:["Exhaust air overboard","Return ~40% cabin air through filters to the mixing unit","Cool avionics","Drive packs"],a:1,e:"Two recirc fans reduce bleed demand; filtered recirculated air mixes with pack air."},

{d:2,q:"With one pack failed:",o:["Descend immediately","Single-pack operation sustains pressurization (altitude/flow considerations per FCOM)","Cabin depressurizes","RAM AIR required"],a:1,e:"One pack + HI flow supports flight; performance/altitude notes per FCOM."},

{d:2,q:"Cargo compartment ventilation/heating:",o:["Not available","Aft cargo ventilated; heating optional per fleet — isolation valves close for fire suppression","Full A/C always","Frozen"],a:1,e:"Cargo conditioning is configuration-dependent; fire procedure shuts ventilation to starve/contain."},

{d:2,q:"Maximum normal cabin altitude in cruise is approximately:",o:["6,000 ft","8,000 ft","10,000 ft","4,000 ft"],a:1,e:"Schedule keeps ≤8,000 ft at max certified altitude — comfort/physiology certification standard."},
{d:3,q:"Excessive cabin altitude warning triggers at approximately:",o:["8,500 ft","9,550 ft cabin altitude (red warning)","14,000 ft","11,300 ft"],a:1,e:"EXCESS CAB ALT red — emergency descent territory; masks at 14,000 ft cabin (pax auto)."},

{d:2,q:"LDG ELEV AUTO means:",o:["Manual knob active","Destination elevation from the FMGS drives the landing schedule","Sea level fixed","Cabin stays at cruise"],a:1,e:"Auto landing-elevation from the flight plan; the knob overrides for non-standard cases."},
{d:2,q:"Cabin vertical speed normal targets are approximately:",o:["±2,000 fpm","~+500/-300 fpm class (comfort schedule)","±50 fpm","Uncontrolled"],a:1,e:"Gentle cabin rates by design; MAN mode requires you to respect similar values."},

{d:2,q:"The DITCHING pushbutton:",o:["Opens all valves","Closes outflow valve, avionics inlet/extract and pack flow paths below the waterline","Deploys slides","Arms rafts"],a:1,e:"Sealing the hull for water entry — part of the ditching checklist."},

{d:2,q:"Smoke removal general philosophy uses:",o:["Faster packs","Configuration changes to route/exhaust smoke (blower/extract OVRD, possible depressurization steps per QRH)","Cabin spraying","Silence"],a:1,e:"Ventilation architecture doubles as smoke management — QRH sequences are specific."},

{d:2,q:"Managed descent (DES) requires:",o:["Nothing","NAV mode engaged (lateral managed) to fly the computed profile","Autoland","Speedbrakes"],a:1,e:"Vertical managed rides on lateral managed — else open modes."},
{d:2,q:"OPEN DES uses:",o:["Path tracking","Idle thrust + speed on elevator (no path protection to constraints)","Constant V/S","Autobrake"],a:1,e:"Open descent ignores constraints — altitude awareness is on you."},
{d:2,q:"DES mode vertical deviation is shown by:",o:["Nothing","The VDEV/'yoyo' symbol on the PFD altitude scale (path above/below)","GS diamond","Trend arrow"],a:1,e:"Path-tracking cue during managed descent — energy management reference."},
{d:2,q:"The triple click aural signifies:",o:["Autoland","FMA mode reversion/downgrade drawing attention","Fuel low","AP engage"],a:1,e:"Automation attention-getter: look at the FMA and reassess."},
{d:2,q:"Loss of NAV mode in flight reverts lateral guidance to:",o:["Nothing","HDG/TRK (current heading) — crew re-manages","LOC","RWY"],a:1,e:"Reversion philosophy holds a safe basic mode + triple click."},
{d:2,q:"After takeoff, NAV engages:",o:["At 500 ft","At/above ~30 ft when armed (RWY→NAV sequence)","At acceleration altitude","Manually only"],a:1,e:"Armed NAV captures shortly after liftoff following runway mode."},
{d:2,q:"SRS disengages at:",o:["V2","Acceleration altitude (→CLB) or by selecting another vertical mode","1,000 ft fixed","Gear up"],a:1,e:"SRS to CLB transition at accel altitude — FMA sequence to verbalize."},
{d:2,q:"VAPP computed by the FMGS equals approximately:",o:["VLS","VLS + wind correction (GS mini logic; typically 1/3 headwind, 5-15 kt bounds)","VREF+20 always","Green dot"],a:1,e:"Approach speed with gust protection — the GS mini foundation."},
{d:3,q:"Ground speed mini (GS mini) protects by:",o:["Limiting GS","Keeping groundspeed ≥ a computed minimum: target IAS varies with gusts to preserve energy","Reducing VAPP","Autobrake tuning"],a:1,e:"In gusts the A/THR flies varying IAS to hold energy — explains 'speed chasing' behavior."},
{d:2,q:"A/THR in approach (managed speed) commands:",o:["Fixed N1","SPEED mode tracking VAPP/GS mini targets","MCT","Idle"],a:1,e:"Autothrust responsiveness in gusts is the GS mini payoff."},
{d:2,q:"At the RETARD callout in a manual landing:",o:["A/THR retards","The PILOT moves levers to idle (callout is a reminder)","Nothing needed","Reverse engages"],a:1,e:"Autoland auto-retard exists on some logic, but the trained action: pilot retards at the call."},
{d:2,q:"ROLL OUT mode provides:",o:["Braking","Runway centerline tracking guidance after touchdown (autoland)","Reverse control","Steering to gate"],a:1,e:"Autoland completion mode — disconnect AP when appropriate during rollout."},
{d:2,q:"CAT capability downgrade (e.g., CAT3 DUAL→CAT2) is announced by:",o:["Silence","Triple click + FMA capability change","Red warning","ECAM only"],a:1,e:"Monitor capability line during approach; brief downgrade gates."},
{d:2,q:"Engine-out SRS/guidance during takeoff provides:",o:["Nothing special","Adjusted pitch targets maintaining safe EO speeds","Autoland","Bank 45°"],a:1,e:"EO logic in guidance supports the takeoff flight path."},
{d:2,q:"Thrust reduction/acceleration altitudes default to:",o:["400/400 ft","Company values (~1,500/1,500 ft class) editable on PERF TO","10,000 ft","V1 dependent"],a:1,e:"THR RED/ACC define CL selection prompt (LVR CLB flashing) and SRS→CLB."},
{d:2,q:"LVR CLB flashing on the FMA prompts:",o:["Ignore","Bringing levers to CL at thrust reduction altitude","TOGA","Idle"],a:1,e:"Lever choreography cue completing takeoff thrust management."},
{d:2,q:"The APPR phase activation (managed speed to VAPP) happens:",o:["At gear down","Automatically at DECEL point (or manually via ACTIVATE APPR)","At 500 ft","Never"],a:1,e:"Approach phase transitions target speeds toward VAPP — verify activation."},
{d:2,q:"DIR TO with radial IN/OUT provides:",o:["Direct only","Course-constrained direct (intercepting a defined radial) options","Holding","Offset"],a:1,e:"DIR TO variants handle ATC 'direct when able/via radial' instructions."},
{d:2,q:"The SEC F-PLN is useful for:",o:["Nothing","Preparing alternates/returns/what-if routes without disturbing the active plan","Games","Backup FMGC"],a:1,e:"Strategic tool: engine-out return, diversion pre-build, runway change."},
{d:2,q:"FCU failure (both channels) leaves:",o:["No control","MCDU-based/selected degraded interfaces per FCOM — significant automation loss","Everything normal","Autoland only"],a:1,e:"Rare but briefed: know the degraded interface hierarchy."},
{d:2,q:"AP disconnection warning is:",o:["Silent","Cavalry charge + red MASTER WARN flashing until cancelled","Triple click","Single chime"],a:1,e:"Deliberate-cancel design ensures awareness of hand-flying state."},
{d:2,q:"A/THR disconnection via levers to idle produces:",o:["Warning forever","A/THR off (memo) — normal at landing; in flight use the instinctive pb technique per SOP","TOGA LK","Reverse"],a:1,e:"Two disconnect paths; idle-gate disconnect is the landing-normal one."},
{d:2,q:"'MODE REVERSION' protections (e.g., V/S excessive with speed decay):",o:["None","Automatic reversions protect speed (e.g., to OP CLB/DES or speed priority logics)","Stall","AP off"],a:1,e:"Guidance-level speed protection exists beneath control-law protections."},
{d:2,q:"The AFS oral one-liner:",o:["Autopilot flies","FMGS manages (MCDU strategic), FCU commands tactically (push managed/pull selected), FMA tells the truth — always announce it","Buttons and knobs","Magic"],a:1,e:"Philosophy + FMA discipline — the answer skeleton for any AFS question."},
{d:2,q:"Dual AP engagement is possible:",o:["Anytime","Only with APPR armed/engaged (autoland architecture)","Never","In cruise"],a:1,e:"AP2 joins for approach redundancy — fail-operational basis."},
{d:2,q:"Selected speed with A/THR off and levers in CL means:",o:["Speed holds","Thrust fixed at CL — speed changes with trajectory (monitor!)","Idle descent","Autoland"],a:1,e:"No A/THR = lever thrust; the selected 'target' is reference only."},
{d:2,q:"PERF GA page contains:",o:["Nothing","Go-around thrust/acc altitudes and engine-out data","Cruise winds","Fuel"],a:1,e:"Phase pages sequence TO→CLB→CRZ→DES→APPR→GA — review before approach."},
{d:2,q:"FMGS predictions accuracy depends on:",o:["Luck","Entered weights, CI, winds, temperatures — garbage in, garbage out","GPS only","Radar"],a:1,e:"Data hygiene drives fuel/time/profile prediction quality."},
{d:2,q:"When ATC gives 'maintain 180 kt to 5 DME':",o:["Managed speed","Pull selected speed 180; resume managed when released","Ignore","VAPP"],a:1,e:"Tactical selected-speed use, then push back to managed — fluency in both worlds."}
);

BANK.ABBR.push(
{d:2,q:"ADR stands for:",o:["Automatic Data Recorder","Air Data Reference","Altitude Display Rate","Auxiliary Drive Relay"],a:1,e:"The air data part of each ADIRU: speed, altitude, AOA, temperature."},
{d:2,q:"IRS stands for:",o:["Internal Rate System","Inertial Reference System","Instrument Routing Selector","Integrated Radio Suite"],a:1,e:"The inertial part: attitude, heading, position."},
{d:2,q:"CPC stands for:",o:["Central Processing Computer","Cabin Pressure Controller","Cockpit Panel Control","Crew Pressure Console"],a:1,e:"Two CPCs alternate control of the outflow valve each flight."},
{d:2,q:"ACP stands for:",o:["Auto Control Panel","Audio Control Panel","Air Conditioning Pack","Alternate Current Power"],a:1,e:"Per-station audio management: transmission keys, reception, volumes."},
{d:2,q:"RMP stands for:",o:["Radio Management Panel","Remote Monitor Processor","Rudder Mode Panel","Reference Map Position"],a:1,e:"Three RMPs; any of them can tune any radio, plus NAV backup tuning."},

{d:2,q:"IDG stands for:",o:["Internal Drive Gear","Integrated Drive Generator","Independent DC Generator","Inertial Data Gyro"],a:1,e:"Engine-driven 90 kVA generator with integrated constant-speed drive."},

{d:2,q:"MMR stands for:",o:["Master Mode Receiver","Multi-Mode Receiver","Main Marker Radio","Managed Map Reference"],a:1,e:"Integrates ILS and GPS receivers; two installed."},
{d:2,q:"EGPWS stands for:",o:["Engine Ground Proximity Warning System","Enhanced Ground Proximity Warning System","Emergency GPS Warning Signal","Extended Glide Path Warning System"],a:1,e:"Classic GPWS modes plus terrain database with predictive alerting."},
{d:2,q:"TCAS stands for:",o:["Terminal Control Alert System","Traffic Alert and Collision Avoidance System","Threat Check Avoidance Suite","Transponder Coded Alert System"],a:1,e:"TA/RA logic with resolution guidance on the PFD vertical speed scale."},
{d:2,q:"FCU stands for:",o:["Flight Control Unit","Flight Control Unit (glareshield AFS interface)","Fuel Control Unit","Fan Cooling Unit"],a:1,e:"Glareshield panel: SPD, HDG/TRK, ALT, V/S-FPA, AP, A/THR — push managed, pull selected."},
{d:2,q:"WAI stands for:",o:["Warning Alert Indicator","Wing Anti-Ice","Wheel Assembly Inspection","Water Injection"],a:1,e:"Bleed-heated slats 3, 4 and 5; one valve per wing."},
{d:2,q:"PRV stands for:",o:["Primary Relay Valve","Pressure Regulating Valve","Pneumatic Return Vent","Pack Recirculation Valve"],a:1,e:"The engine bleed valve: regulates (~45 psi) and shuts off."},
{d:2,q:"ACARS stands for:",o:["Automatic Cabin Announcement Recording System","Aircraft Communications Addressing and Reporting System","Air Control And Radio Suite","Advanced Crew Alerting System"],a:1,e:"Datalink for OOOI, weather, clearances and company messages via the ATSU."},
{d:2,q:"PBE stands for:",o:["Portable Breathing Equipment","Protective Breathing Equipment","Passenger Briefing Equipment","Pressure Balance Element"],a:1,e:"Smoke hood for firefighting, self-contained around 15 minutes."},
{d:2,q:"CRC stands for:",o:["Central Reference Computer","Continuous Repetitive Chime","Cabin Rate Controller","Crew Rest Compartment"],a:1,e:"The level 3 (red warning) aural, paired with flashing MASTER WARN."},
{d:2,q:"ECP stands for:",o:["Engine Control Panel","ECAM Control Panel","Electronic Circuit Protector","Emergency Checklist Procedure"],a:1,e:"Selects SD system pages and manages ECAM (CLR, RCL, STS, ALL)."},
{d:2,q:"QRH stands for:",o:["Quick Response Handbook","Quick Reference Handbook","Qualified Route Handbook","Quality Review Handbook"],a:1,e:"Abnormal/emergency procedures and performance — one of the three GLG authorities."},
